<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kaloridagbok</title>
<style>
  :root{
    --paper:#F7F4EE;
    --card:#FFFFFF;
    --ink:#23262B;
    --muted:#71757D;
    --line:#E7E2D8;
    --sage:#5B7B6A;
    --sage-light:#E4ECE6;
    --rust:#A85C40;
    --rust-light:#F3E3DB;
    --gold:#C9A24B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .display{font-family:Georgia,'Times New Roman',serif;}
  .app{max-width:520px;margin:0 auto;padding:20px 16px 0;}

  header.top{padding:4px 4px 18px; display:flex; align-items:center; justify-content:space-between;}
  header.top .apptitle{
    flex:1; text-align:center; font-size:34px; margin:0; font-weight:600;
    letter-spacing:-.01em; color:var(--sage);
  }
  .refreshbtn{
    border:1px solid var(--line); background:#fff; color:var(--muted);
    width:38px; height:38px; border-radius:50%; font-size:16px; cursor:pointer;
    flex-shrink:0;
  }
  .hdr-spacer{width:38px; flex-shrink:0;}
  .refreshbtn:disabled{opacity:.5;}
  .syncbar{font-size:11.5px; padding:0 4px 12px; min-height:14px;}

  nav.tabs{
    display:flex; gap:4px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:4px; margin-bottom:18px;
  }
  nav.tabs button{
    flex:1; border:none; background:transparent; padding:9px 4px;
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    color:var(--muted); border-radius:10px; cursor:pointer;
  }
  nav.tabs button.active{background:var(--sage); color:#fff;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:14px;
  }

  /* Day view */
  .datebar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .datebar button{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:#fff; font-size:16px; cursor:pointer; color:var(--ink);
  }
  .datebar .label{font-weight:600; font-size:15px; text-align:center;}
  .datebar .label small{display:block; font-weight:400; color:var(--muted); font-size:11.5px; margin-top:1px;}

  .ring-wrap{display:flex; align-items:center; gap:18px;}
  .ring{position:relative; width:112px; height:112px; flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring .center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .ring .center .num{font-size:22px; font-weight:600;}
  .ring .center .unit{font-size:10px; color:var(--muted); letter-spacing:.05em;}

  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; flex:1;}
  .stat{background:var(--paper); border-radius:10px; padding:8px 10px;}
  .stat .k{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .stat .v{font-size:16px; font-weight:600; margin-top:2px;}
  .stat.rust .v{color:var(--rust);}
  .stat.sage .v{color:var(--sage);}

  .macrosplit{margin-top:16px;}
  .msbar{
    display:flex; height:26px; border-radius:8px; overflow:hidden;
    background:var(--line); margin-bottom:10px;
  }
  .msbar.empty{opacity:.5;}
  .msseg{
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:700; color:#fff; letter-spacing:.01em;
    transition:width .25s ease;
  }
  .mslegend{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .msitem{display:flex; align-items:flex-start; gap:6px; min-width:0;}
  .msdot{width:9px; height:9px; border-radius:3px; flex-shrink:0; margin-top:3px;}
  .mstext{min-width:0;}
  .mstext b{font-size:12px; font-weight:600; display:block; line-height:1.25;}
  .mstext .mspct{font-size:11px; color:var(--muted);}
  .mstext em{
    display:block; font-style:normal; font-size:10.5px; color:var(--muted); margin-top:1px;
  }
  .mstext em.good{color:var(--sage);}
  .mstext em.bad{color:var(--rust);}
  .msempty{font-size:12px; color:var(--muted);}
  .sectitle{
    font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
    font-weight:700; margin:18px 0 8px 2px;
  }
  .entry{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:11px 12px; margin-bottom:8px;
  }
  .entry .name{font-size:14px; font-weight:600;}
  .entry .sub{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .entry .right{display:flex; align-items:center; gap:10px;}
  .entry .kcal{font-size:14px; font-weight:600;}
  .entry.exercise .kcal{color:var(--sage);}
  .entry .del{
    border:none; background:none; color:var(--muted); font-size:16px; cursor:pointer;
    width:24px; height:24px; line-height:1;
  }
  .entry .addfav{color:var(--sage); font-size:19px; font-weight:700;}
  .etime{
    display:inline-block; font-size:11px; font-weight:600; color:var(--muted);
    background:var(--paper); border-radius:5px; padding:1px 5px; margin-right:6px;
    vertical-align:1px;
  }
  .qtypick{display:flex; align-items:center; gap:2px; background:var(--paper); border-radius:14px; padding:2px;}
  .qtybtn{
    border:none; background:#fff; color:var(--ink); width:22px; height:22px;
    border-radius:50%; font-size:14px; line-height:1; cursor:pointer; font-family:inherit;
  }
  .qtyval{font-size:12px; font-weight:600; min-width:22px; text-align:center;}
  .entry.confirmdel{border-color:var(--rust); background:var(--rust-light);}
  .confirmbtn{
    border:none; border-radius:7px; padding:6px 10px; font-size:11.5px;
    font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .confirmbtn.no{background:#fff; color:var(--muted);}
  .confirmbtn.yes{background:var(--rust); color:#fff;}
  .confirmbtn.save{background:var(--ink); color:#fff;}
  .editentry{
    border:none; background:transparent; color:var(--muted); font-size:14px;
    cursor:pointer; padding:2px 4px; border-radius:5px;
  }
  .editentry:hover{background:var(--line);}
  .entry.editrow{align-items:flex-start; flex-direction:column; gap:8px; flex-wrap:wrap;}
  .eefield{
    width:100%; border:1px solid var(--line); border-radius:8px;
    padding:8px 9px; font-size:14px; font-family:inherit; background:#fff; color:var(--ink);
  }
  button.etime{border:1px solid transparent; cursor:pointer; font-family:inherit;}
  button.etime:hover{border-color:var(--line);}
  button.etime.notime{color:var(--line);}
  .entry.timeedit{border-color:var(--ink); align-items:flex-end;}
  .whenrow{display:flex; gap:6px; flex-wrap:wrap;}
  .entry.timeedit input[type="date"],
  .entry.timeedit input[type="time"]{
    border:1px solid var(--line); border-radius:8px; padding:7px 9px;
    font-size:15px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:18px 0;}

  .addbtn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; padding:11px; border-radius:12px; border:1.5px dashed var(--line);
    background:transparent; color:var(--muted); font-size:13px; font-weight:600;
    cursor:pointer; margin-bottom:8px;
  }
  .addbtn.food{color:var(--rust); border-color:var(--rust-light);}
  .addbtn.exercise{color:var(--sage); border-color:var(--sage-light);}

  .form{background:var(--paper); border-radius:12px; padding:12px; margin-bottom:10px;}
  .form .row{display:flex; gap:8px; margin-bottom:8px;}
  .form input{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 10px;
    font-size:14px; font-family:'Inter',sans-serif; background:#fff;
  }
  .form .row input{flex:1;}
  .form .actions{display:flex; gap:8px;}
  .form .actions button{
    flex:1; border:none; border-radius:9px; padding:10px; font-weight:600;
    font-size:13.5px; cursor:pointer;
  }
  .form .save{background:var(--ink); color:#fff;}
  .form .cancel{background:var(--line); color:var(--ink);}

  .modeswitch{display:flex; gap:6px; margin-bottom:10px;}
  .modeswitch button{
    flex:1; border:1px solid var(--line); background:#fff; border-radius:8px;
    padding:7px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .modeswitch button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .editbanner{
    background:#FBF6EA; border:1px solid var(--gold); color:#8A6D2A;
    border-radius:9px; padding:8px 10px; font-size:12.5px; margin-bottom:10px;
  }
  .sliderval{text-align:center; margin-bottom:6px;}
  .sliderval b{font-size:32px; font-weight:600; color:var(--sage); display:block; line-height:1.1;}
  .sliderval span{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  #activitySlider{
    -webkit-appearance:none; appearance:none; width:100%; height:8px;
    border-radius:4px; background:var(--line); outline:none; margin:8px 0 2px;
  }
  #activitySlider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%;
    background:#fff; border:2px solid var(--sage); cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  #activitySlider::-moz-range-thumb{
    width:26px; height:26px; border-radius:50%; background:#fff;
    border:2px solid var(--sage); cursor:pointer;
  }
  .sliderends{display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); margin-bottom:12px;}
  .presets{display:flex; gap:5px; margin-bottom:12px; flex-wrap:wrap;}
  .presets .preset{
    flex:1 1 auto; border:1px solid var(--line); background:#fff; border-radius:20px;
    padding:7px 10px; font-size:11.5px; font-weight:600; color:var(--muted);
    cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .budget{background:#fff; border:1px solid var(--line); border-radius:11px; padding:11px 12px;}
  .budgetrow{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; padding:3px 0; color:var(--muted);}
  .budgetrow b{color:var(--ink); font-weight:600;}
  .budgetrow.total{border-top:1px solid var(--line); margin-top:5px; padding-top:8px; color:var(--ink); font-weight:600;}
  .budgetrow.total b{font-size:19px;}

  .ingcard{background:#fff; border:1px solid var(--line); border-radius:11px; padding:10px; margin-bottom:8px;}
  .ingcard .toprow{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .ingcard .toprow input{flex:1;}
  .ingcard .rmv{
    flex-shrink:0; border:none; background:var(--rust-light); color:var(--rust);
    width:28px; height:28px; border-radius:50%; font-size:15px; cursor:pointer;
  }
  .fieldgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px;}
  .fieldgrid label{
    display:block; font-size:9.5px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.03em; margin-bottom:2px;
  }
  .ingcard .sub{font-size:12px; color:var(--sage); font-weight:600; text-align:right; margin-top:2px;}
  .addingbtn{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    padding:9px; border-radius:10px; border:1.5px dashed var(--line); background:transparent;
    color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer; margin-bottom:10px;
  }
  .estbtn{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    padding:7px; border-radius:8px; border:1px solid var(--gold); background:#FBF6EA;
    color:#8A6D2A; font-size:11.5px; font-weight:600; cursor:pointer; margin-bottom:8px;
  }
  .estbtn:disabled{opacity:.6; cursor:default;}
  .est-status{font-size:11px; color:var(--rust); line-height:1.4;}
  .est-status:not(:empty){margin-bottom:10px;}
  .unitswitch{display:flex; gap:5px; margin-bottom:8px;}
  .unitswitch button{
    flex:1; border:1px solid var(--line); background:#fff; border-radius:7px;
    padding:6px; font-size:11.5px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .unitswitch button.active{background:var(--sage); color:#fff; border-color:var(--sage);}
  .pantrybtn{
    border:1px solid var(--line); background:#fff; border-radius:7px; padding:5px 9px;
    font-size:11px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .pantrybtn.saved{background:var(--sage-light); color:var(--sage); border-color:var(--sage-light); cursor:default;}
  .mealtotals{
    display:flex; justify-content:space-between; background:var(--sage-light); border-radius:10px;
    padding:10px 12px; margin-bottom:10px; font-size:12.5px;
  }
  .mealtotals .tot b{font-size:15px; display:block;}

  /* Week/month bars */
  .netchart{width:100%; height:auto; display:block; margin:2px 0 2px;}
  .netchart .axlbl{font-size:9px; fill:var(--muted); font-family:inherit;}
  .netchart .goallbl{font-size:9px; fill:var(--gold); font-family:inherit; font-weight:600;}
  .balancecurve .axlbl{font-size:9px; fill:var(--muted); font-family:inherit;}
  .activerow{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#fff; border:1.5px solid var(--gold); border-radius:12px;
    padding:11px 12px; margin-bottom:8px;
  }
  .activerow.filled{border-color:var(--sage-light); background:var(--sage-light);}
  .activelbl b{display:block; font-size:13.5px; font-weight:600;}
  .activelbl small{display:block; font-size:11px; color:var(--muted); margin-top:1px;}
  .activeinput{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .activeinput input{
    width:64px; border:1px solid var(--line); border-radius:8px; padding:8px 6px;
    font-size:17px; font-weight:600; text-align:center; font-family:inherit;
    background:#fff; color:var(--ink); -moz-appearance:textfield;
  }
  .activeinput .unit{font-size:11px; color:var(--muted);}
  .activesave{
    border:none; background:var(--sage); color:#fff; border-radius:8px;
    padding:8px 11px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .activesave.pending{background:var(--ink);}
  .missbox{background:#FBF6EA; border:1px solid var(--gold); border-radius:12px; padding:10px 12px; margin-bottom:10px;}
  .misslbl{font-size:12.5px; font-weight:600; color:#8A6D2A;}
  .misslbl small{display:block; font-weight:400; font-size:11px; color:var(--muted); margin-top:1px;}
  .misschips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center;}
  .misshead{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .misshide{
    flex-shrink:0; border:none; background:transparent; color:var(--muted);
    font-size:11px; font-weight:600; cursor:pointer; font-family:inherit;
    text-decoration:underline; padding:0;
  }
  .misschip{
    display:inline-flex; align-items:stretch; border:1px solid var(--gold);
    background:#fff; border-radius:16px; overflow:hidden; white-space:nowrap;
  }
  .misschip .mcgo{
    border:none; background:transparent; color:#8A6D2A;
    padding:5px 8px 5px 11px; font-size:11.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .misschip .mcskip{
    border:none; border-left:1px solid var(--gold); background:transparent;
    color:var(--muted); padding:0 8px; font-size:13px; cursor:pointer; font-family:inherit; line-height:1;
  }
  .missmore{font-size:11px; color:var(--muted);}
  .copyday{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    background:#fff; border:1px solid var(--line); border-radius:11px;
    padding:11px 12px; margin-bottom:7px; cursor:pointer; font-family:inherit; text-align:left;
  }
  .copyday b{display:block; font-size:13.5px; color:var(--ink); font-weight:600;}
  .copyday small{display:block; font-size:11.5px; color:var(--muted); margin-top:1px;}
  .copyday .dtk{font-size:14px; font-weight:600; color:var(--rust); white-space:nowrap;}
  .mealtypes{display:flex; flex-direction:column; gap:5px; margin:12px 0;}
  .mtrow{display:flex; gap:6px;}
  .mtbtn{
    flex:1 1 auto; min-width:60px; border:1px solid var(--line); background:#fff; border-radius:16px;
    padding:9px 4px; font-size:12px; font-weight:600; color:var(--muted);
    cursor:pointer; font-family:inherit; white-space:nowrap;
    transition:background .12s, color .12s, border-color .12s;
  }
  .mtbtn.active{background:var(--sage); color:#fff; border-color:var(--sage);}
  .pickerbox{background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:10px;}
  .pickerbox #pantrySearch{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:10px;
    font-size:14px; font-family:inherit; background:var(--paper); margin-bottom:8px;
  }
  .pickerlist{max-height:230px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .pickitem{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    background:transparent; border:none; border-bottom:1px solid var(--line);
    padding:10px 4px; cursor:pointer; font-family:inherit; text-align:left;
  }
  .pickitem:last-child{border-bottom:none;}
  .pkname{font-size:13.5px; font-weight:600; color:var(--ink);}
  .pkname small{display:block; font-size:11px; font-weight:400; color:var(--muted); margin-top:1px;}
  .pkadd{font-size:19px; font-weight:700; color:var(--sage); flex-shrink:0; padding-left:10px;}
  .pickerclose{
    width:100%; border:none; background:var(--line); color:var(--ink); border-radius:9px;
    padding:9px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; margin-top:8px;
  }
  .amtchips{display:flex; gap:4px; margin-top:5px;}
  .amtchip{
    flex:1; border:1px solid var(--line); background:#fff; border-radius:6px;
    padding:4px 2px; font-size:11px; font-weight:600; color:var(--muted);
    cursor:pointer; font-family:inherit;
  }
  .amtchip.active{background:var(--sage); color:#fff; border-color:var(--sage);}
  .mtag{
    display:inline-block; font-size:10px; font-weight:600; color:var(--sage);
    background:var(--sage-light); border-radius:4px; padding:1px 5px; margin-right:5px;
    text-transform:uppercase; letter-spacing:.03em; vertical-align:1px;
  }
  .mealrow{border-top:1px solid var(--line); padding:9px 0 7px;}
  .mealrow:first-of-type{border-top:none;}
  .mealrow-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .mealrow-top b{font-size:13.5px;}
  .mealdiff{font-size:12px; font-weight:600; white-space:nowrap;}
  .mealrow-sub{font-size:11px; color:var(--muted); margin-top:3px; line-height:1.45;}
  .mealrow-note{font-size:11px; color:var(--rust); margin-top:3px;}
  .summaryrow{display:flex; gap:8px; margin-top:14px;}
  .summaryrow .stat{flex:1;}
  .compare{margin-top:14px; padding:12px; background:var(--paper); border-radius:12px;}
  .compare .cmp-row{display:flex; gap:12px;}
  .compare .cmp-row > div{flex:1;}
  .compare .k{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .compare .v{font-size:19px; font-weight:600; margin-top:2px;}
  .cmp-note{font-size:11.5px; color:var(--muted); line-height:1.45; margin-top:8px;}
  .balancehead{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2px;}
  .balanceval{font-size:24px; font-weight:600; margin-top:2px; letter-spacing:-.01em;}
  .balancecurve{width:100%; height:auto; display:block; margin-top:6px;}
  .calcline{display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; padding:5px 0; color:var(--muted);}
  .calcline b{color:var(--ink); font-size:14px;}
  .calcline.total{border-top:1px solid var(--line); margin-top:4px; padding-top:8px; color:var(--ink); font-weight:600;}
  .calcline.total b{font-size:18px; color:var(--sage);}
  .settingsrow select{width:100%; border:1px solid var(--line); border-radius:9px;
    padding:10px; font-size:14px; background:#fff; font-family:inherit; color:var(--ink);}
  .sex-btn{flex:1; border:1px solid var(--line); background:#fff; border-radius:7px;
    padding:8px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer;}
  .sex-btn.active{background:var(--sage); color:#fff; border-color:var(--sage);}

  /* Weight */
  .weightgraph{width:100%; height:auto; display:block;}
  .weightgraph .axlbl{font-size:9px; fill:var(--muted); font-family:inherit;}
  .weightform{display:flex; gap:8px; margin-bottom:12px;}
  .weightform input{flex:1;}
  .weightform button{

function emptyIngredient(){
  return { name:'', unit:'g', amount:100, kcalPer100:0, proteinPer100:0, fatPer100:0, carbsPer100:0 };
}
/* Faktor att multiplicera näringsvärdena med.
   unit 'g'  -> värdena är per 100 g, mängd i gram
   unit 'st' -> värdena är per 1 styck, mängd i antal */
function ingredientFactor(row){
  const amt = Number(row.amount)||0;
  return row.unit === 'st' ? amt : amt/100;
}
function computeMealTotals(){
  return state.mealBuilder.reduce((acc, row) => {
    const factor = ingredientFactor(row);
    acc.kcal += factor * (Number(row.kcalPer100)||0);
    acc.protein += factor * (Number(row.proteinPer100)||0);
    acc.fat += factor * (Number(row.fatPer100)||0);
    acc.carbs += factor * (Number(row.carbsPer100)||0);
    return acc;
  }, { kcal:0, protein:0, fat:0, carbs:0 });
}
function ingredientSubKcal(row){
  return Math.round(ingredientFactor(row) * (Number(row.kcalPer100)||0));
}
function unitLabel(row){
  return row.unit === 'st' ? '/ st' : '/ 100g';
}

/* ---- Livsmedelsbibliotek ---- */
function normName(s){ return (s||'').trim().toLowerCase(); }
function findInPantry(name, unit){
  const n = normName(name);
  if(!n) return null;
  const byUnit = (p) => !unit || p.unit === unit;
  // 1. Exakt match
  const exact = state.pantry.find(p => normName(p.name) === n && byUnit(p));
  if(exact) return exact;
  // 2. Det sökta finns i biblioteksnamnet ("Grekisk yoghurt" → "Arla Grekisk Yoghurt")
  const contains = state.pantry.find(p => normName(p.name).includes(n) && byUnit(p));
  if(contains) return contains;
  // 3. Biblioteksnamnet finns i det sökta ("Arla Grekisk Yoghurt" → "200 g Arla Grekisk Yoghurt")
  const contained = state.pantry.find(p => n.includes(normName(p.name)) && normName(p.name).length > 3 && byUnit(p));
  if(contained) return contained;
  // 4. Fallback utan enhetsfilter
  return state.pantry.find(p => normName(p.name) === n)
      || state.pantry.find(p => normName(p.name).includes(n))
      || null;
}
function pantryHasExact(row){
  const p = findInPantry(row.name, row.unit);
  return !!(p && p.unit === row.unit
    && Number(p.kcalPer100) === Number(row.kcalPer100)
    && Number(p.proteinPer100) === Number(row.proteinPer100)
    && Number(p.fatPer100) === Number(row.fatPer100)
    && Number(p.carbsPer100) === Number(row.carbsPer100));
}
async function savePantryItem(row){
  const item = {
    name: row.name.trim(), unit: row.unit || 'g',
    kcalPer100: Number(row.kcalPer100)||0,
    proteinPer100: Number(row.proteinPer100)||0,
    fatPer100: Number(row.fatPer100)||0,
    carbsPer100: Number(row.carbsPer100)||0,
    portion: Number(row.amount) || (row.unit === 'st' ? 1 : 100),
    lastUsed: Date.now()
  };
  state.pantry = state.pantry.filter(p => !(normName(p.name) === normName(item.name) && p.unit === item.unit));
  state.pantry.push(item);
  state.pantry.sort((a,b) => a.name.localeCompare(b.name, 'sv'));
  await ghSaveBundle();
}
/* Sorterad lista: senast använda först, sedan alfabetiskt. */
/* Läser ut mängd ur fritext: "40 g gurka", "2 ägg", "1,5 dl grädde".
   Returnerar null om ingen mängd hittas. */
function parseAmountFromName(text){
  const t = (text || '').trim();
  if(!t) return null;
  const m = t.match(/^(\d+(?:[.,]\d+)?)\s*(kg|hg|gram|gr|g|st|stycken|styck|dl|cl|ml|l|msk|tsk|kkp|kopp|skiva|skivor|näve|nävar)?\b\s*(.*)$/i);
  if(!m) return null;
  const num = parseFloat(m[1].replace(',', '.'));
  if(!isFinite(num) || num <= 0) return null;
  const unitWord = (m[2] || '').toLowerCase();
  let rest = (m[3] || '').trim();
  // Ta bort inledande "av"/"med"
  rest = rest.replace(/^(av|med)\s+/i, '');
  const gramFactors = { kg:1000, hg:100, gram:1, gr:1, g:1 };
  const volFactors  = { dl:100, cl:10, ml:1, l:1000, msk:15, tsk:5, kkp:240, kopp:240 };
  if(unitWord in gramFactors)
    return { amount: Math.round(num * gramFactors[unitWord]), unit:'g', name: rest || t, exact:true };
  if(unitWord in volFactors)
    return { amount: Math.round(num * volFactors[unitWord]), unit:'g', name: rest || t, exact:false };
  if(['st','stycken','styck','skiva','skivor','näve','nävar'].includes(unitWord))
    return { amount: num, unit:'st', name: rest || t, exact:true };
  // Enbart siffra + livsmedel, t.ex. "2 ägg"
  if(!unitWord && rest) return { amount: num, unit:'st', name: rest, exact:true };
  return null;
}

/* Som parseAmountFromName men klarar även efterställd mängd: "Grekisk yoghurt 125 g". */
function parseQuantityAnywhere(text){
  const t = (text||'').trim();
  if(!t) return null;
  const lead = parseAmountFromName(t);
  if(lead) return lead;
  const m = t.match(/^(.*?)[\s,]*(\d+(?:[.,]\d+)?)\s*(kg|hg|gram|gr|g|st|stycken|styck|dl|cl|ml|l|msk|tsk)\.?$/i);
  if(!m) return null;
  const name = m[1].trim();
  if(!name) return null;
  const flipped = m[2] + ' ' + m[3] + ' ' + name;
  const parsed = parseAmountFromName(flipped);
  return parsed ? { ...parsed, name } : null;
}

/* Slår upp fritext mot biblioteket. Klarar flera delar: "2 ägg och 125 g yoghurt". */
function pantryLookupFromText(text){
  const parts = (text||'').split(/\s*(?:,|\boch\b|\+|&)\s*/i).map(x=>x.trim()).filter(Boolean);
  if(!parts.length) return null;
  const items = [];
  for(const part of parts){
    const q = parseQuantityAnywhere(part);
    const nameGuess = q ? q.name : part;
    const entry = findInPantry(nameGuess) || findInPantry(part);
    if(!entry) return null;                     // en okänd del → låt AI:n ta hela
    const unit = entry.unit;
    let amount;
    if(q && ((q.unit === 'st') === (unit === 'st'))) amount = q.amount;
    else amount = Number(entry.portion) || (unit === 'st' ? 1 : 100);
    items.push({ entry, amount, unit });
  }
  const tot = items.reduce((a,it) => {
    const f = it.unit === 'st' ? it.amount : it.amount/100;
    a.kcal += f * (Number(it.entry.kcalPer100)||0);
    a.protein += f * (Number(it.entry.proteinPer100)||0);
    a.fat += f * (Number(it.entry.fatPer100)||0);
    a.carbs += f * (Number(it.entry.carbsPer100)||0);
    return a;
  }, {kcal:0,protein:0,fat:0,carbs:0});
  return { items, totals: tot };
}

function pantrySorted(query){
  const q = normName(query || '');
  return state.pantry
    .filter(p => !q || normName(p.name).includes(q))
    .sort((a,b) => (b.lastUsed||0) - (a.lastUsed||0) || a.name.localeCompare(b.name,'sv'));
}
function pantryPortionKcal(p){
  const amt = Number(p.portion) || (p.unit==='st' ? 1 : 100);
  return Math.round((p.unit==='st' ? amt : amt/100) * (Number(p.kcalPer100)||0));
}

function updateMealTotalsDOM(){
  const t = computeMealTotals();
  const kcalEl = document.getElementById('buildTotKcal');
  const proteinEl = document.getElementById('buildTotProtein');

    if(pb){

      const saved = pantryHasExact(row);

      pb.disabled = saved;
      pb.classList.toggle('saved', saved);
      pb.textContent = saved ? '✓ I mitt bibliotek' : '💾 Spara livsmedel';
    }
  });
}

function ymd(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayYmd(){ return ymd(new Date()); }
function sortByTime(list){
  list.sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
  return list;
}
const MEAL_SLOTS = [
  { key:'frukost',   label:'Frukost',   time:'07:30', words:['frukost','morgonmål'] },
  { key:'lunch',     label:'Lunch',     time:'12:00', words:['lunch'] },
  { key:'mellanmal', label:'Mellanmål', time:'15:00', words:['mellanmål','mellis','fika','snack'] },
  { key:'middag',    label:'Middag',    time:'18:30', words:['middag','kvällsmat'] },
  { key:'kvall',     label:'Kvällsmål', time:'21:00', words:['kvällsmål','nattmat','kvällsfika'] }
];
function detectSlot(name){
  const n = (name||'').toLowerCase();
  // Längsta nyckelordet först så "kvällsmat" inte fångas av "kväll"
  const all = MEAL_SLOTS.flatMap(s => s.words.map(w => ({ w, s })))
    .sort((a,b) => b.w.length - a.w.length);
  const hit = all.find(x => n.includes(x.w));
  return hit ? hit.s : null;
}
/* Föreslår tid utifrån namnet, annars klockan nu. */
function suggestTime(name){
  const slot = detectSlot(name);
  return slot ? slot.time : nowHM();
}

function nowHM(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ---- Måltidstyper ----
   Etiketten är valfri och påverkar inte tidsstämpeln på dagens datum.
   Föreslagen tid används bara när man loggar en tidigare dag. */
const MEAL_TYPES = [
  { key:'frukost',   label:'Frukost',   time:'07:30', match:/^\s*frukost\b|^\s*breakfast\b/i },
  { key:'lunch',     label:'Lunch',     time:'12:00', match:/^\s*lunch\b/i },
  { key:'middag',    label:'Middag',    time:'18:00', match:/^\s*(middag|kvällsmat|dinner)\b/i },
  { key:'mellanmal', label:'Mellanmål', time:'15:00', match:/^\s*(mellanmål|fika)\b/i },
  { key:'snack',     label:'Snack',     time:'21:00', match:/^\s*(snack|kvällsmat|gottis|chips|nötter|frukt)\b/i }
];
function mealTypeLabel(key){
  const m = MEAL_TYPES.find(x => x.key === key);
  return m ? m.label : null;
}
function detectMealType(name){
  const m = MEAL_TYPES.find(x => x.match.test(name || ''));
  return m ? m.key : null;
}
/* Idag: faktisk tid. Tidigare dag: föreslagen tid för måltidstypen. */
function timeForEntry(name, mealType){
  if(ymd(state.currentDate) === todayYmd()) return nowHM();
  const key = mealType || detectMealType(name);
  const m = MEAL_TYPES.find(x => x.key === key);
  return m ? m.time : '12:00';
}

function fmtDateLabel(d){
  const dayNames = ['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
  const monthNames = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  const isToday = ymd(d) === todayYmd();
  return { main: `${d.getDate()} ${monthNames[d.getMonth()]}`, sub: isToday ? 'Idag' : dayNames[d.getDay()] };
}

function noteSync(ok, label){
  state.lastSync = { ok, label, time: new Date() };
  const el = document.getElementById('syncBanner');
  if(el) el.innerHTML = syncBannerHTML();
}
function syncBannerHTML(){
  if(!state.lastSync) return '';
  const { ok, label, time } = state.lastSync;
  const hh = String(time.getHours()).padStart(2,'0');
  const mm = String(time.getMinutes()).padStart(2,'0');
  const ss = String(time.getSeconds()).padStart(2,'0');
  return `<span style="color:${ok?'var(--sage)':'var(--rust)'}">${ok?'✓':'⚠'} ${label} kl ${hh}:${mm}:${ss}${ok?'':' — sparades EJ till molnet'}</span>`;
}

function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(escape(atob(str)));
}

async function ghRequest(options = {}){
  const cfg = state.gh;
  const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodeURIComponent(cfg.path)}`;
  return fetch(url, {
    ...options,
    headers: {
      'Authorization': `Bearer ${cfg.token}`,
      'Accept': 'application/vnd.github+json',
      ...(options.headers || {})
    }
  });
}

async function ghLoadBundle(){
  if(!ghConfigured()){
    noteSync(false, 'GitHub ej konfigurerat – fyll i under Inställningar');
    return null;
  }
  try{
    const res = await ghRequest({ method: 'GET' });
    if(res.status === 404){
      state.gh.sha = null;
      noteSync(true, 'Ingen datafil i GitHub ännu (skapas vid första sparning)');
      return null;
    }
    if(!res.ok){
      const t = await res.text().catch(() => '');
      throw new Error(`GitHub svarade ${res.status}: ${t.slice(0,120)}`);
    }
    const json = await res.json();
    state.gh.sha = json.sha;
    const decoded = b64DecodeUnicode(json.content.replace(/\n/g, ''));
    const bundle = JSON.parse(decoded);
    noteSync(true, 'Hämtade data från GitHub');
    return bundle;
  }catch(e){
    console.error('GitHub load failed', e);
    noteSync(false, `Kunde inte hämta från GitHub (${(e.message || '').slice(0,80)})`);
    return null;
  }
}

async function ghSaveBundle(retry = true){
  if(!ghConfigured()){
    noteSync(false, 'GitHub ej konfigurerat – fyll i under Inställningar');
    return false;
  }
  const bundle = {
    settings: state.settings,
    weights: state.weights,
    favorites: state.favorites,
    pantry: state.pantry,
    skippedDays: state.skippedDays,
    days: state.cache
  };
  try{
    const body = {
      message: `Uppdatera kaloridagbok ${new Date().toISOString()}`,
      content: b64EncodeUnicode(JSON.stringify(bundle)),
      branch: state.gh.branch || 'main'
    };
    if(state.gh.sha) body.sha = state.gh.sha;
    const res = await ghRequest({ method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if(res.status === 409 && retry){
      await ghLoadBundle();
      return await ghSaveBundle(false);
    }
    if(!res.ok){
      const t = await res.text().catch(() => '');
      throw new Error(`GitHub svarade ${res.status}: ${t.slice(0,120)}`);
    }
    const json = await res.json();
    state.gh.sha = json.content.sha;
    noteSync(true, 'Sparat till GitHub');
    return true;
  }catch(e){
    console.error('GitHub save failed', e);
    noteSync(false, `Kunde inte spara till GitHub (${(e.message || '').slice(0,80)})`);
    return false;
  }
}

async function loadDay(dateStr){
  if(!state.cache[dateStr]) state.cache[dateStr] = { food: [], exercise: [] };
  return state.cache[dateStr];

function dayTotals(data){
  const intake = data.food.reduce((s,f)=>s+Number(f.kcal||0),0);
  const burned = data.exercise.reduce((s,e)=>s+Number(e.kcal||0),0);
  const protein = data.food.reduce((s,f)=>s+Number(f.protein||0),0);
  const fat = data.food.reduce((s,f)=>s+Number(f.fat||0),0);
  const carbs = data.food.reduce((s,f)=>s+Number(f.carbs||0),0);
  return { intake, burned, net: intake - burned, protein, fat, carbs };
}

/* ---- Måltidsmönster: vad händer dagar då ett mål hoppas över? ---- */
function mealPatterns(results){
  const logged = results.filter(r => r.totals.intake > 0 && r.day);
  const out = [];
  MEAL_TYPES.slice(0,3).forEach(kind => {
    const withIt = [], without = [];
    logged.forEach(r => {
      const has = r.day.food.some(f =>
        (f.mealType || detectMealType(f.name)) === kind.key);
      (has ? withIt : without).push(r.totals);
    });
    if(withIt.length < 4 || without.length < 4) return;
    const avg = (arr, key) => Math.round(arr.reduce((s,t)=>s+t[key],0)/arr.length);
    out.push({
      kind,
      nWith: withIt.length, nWithout: without.length,
      intakeWith: avg(withIt,'intake'), intakeWithout: avg(without,'intake'),
      proteinWith: avg(withIt,'protein'), proteinWithout: avg(without,'protein')
    });
  });
  return out;
}

function mealPatternBlock(results){
  const pats = mealPatterns(results);
  if(!pats.length){
    return `<div class="card">
      <div class="sectitle" style="margin:0 0 8px 2px;">Måltidsmönster</div>
      <div class="empty" style="text-align:left; padding:0;">
        Namnge måltider med "frukost", "lunch" eller "middag" så jämförs dagar med och utan varje mål.
        Kräver minst 4 dagar i varje grupp.
      </div>
    </div>`;
  }
  return `<div class="card">
    <div class="sectitle" style="margin:0 0 8px 2px;">Måltidsmönster</div>
    ${pats.map(p => {
      const diff = p.intakeWithout - p.intakeWith;
      const pDiff = p.proteinWithout - p.proteinWith;
      const more = diff > 0;
      return `<div class="patrow">
        <div class="patlbl">Dagar utan ${p.kind.label.toLowerCase()}
          <small>${p.nWithout} dagar utan · ${p.nWith} med</small></div>
        <div class="patval" style="color:${Math.abs(diff) < 100 ? 'var(--muted)' : (more ? 'var(--rust)' : 'var(--sage)')}">
          ${more?'+':'−'}${Math.abs(diff)} kcal
        </div>
      </div>
      <div class="cmp-note" style="margin:0 0 12px;">
        ${p.kind.key === 'snack'
          ? (Math.abs(diff) < 50
            ? `Liten skillnad i totalt intag mellan snack-dagar och andra (${p.intakeWith} mot ${p.intakeWithout} kcal).`
            : `Snack bidrar med i snitt ${Math.abs(p.intakeWith - p.intakeWithout)} extra kcal (${p.intakeWith} mot ${p.intakeWithout} kcal utan snack).`)
          : Math.abs(diff) < 100
            ? `Intaget skiljer sig knappt (${p.intakeWith} mot ${p.intakeWithout} kcal). Att hoppa över verkar inte påverka totalen.`
            : more
              ? `Du åt i snitt mer totalt de dagar ${p.kind.label.toLowerCase()} saknades (${p.intakeWithout} mot ${p.intakeWith} kcal) — det äts alltså upp senare på dagen och lite till.`
              : `Du åt i snitt mindre totalt de dagar ${p.kind.label.toLowerCase()} saknades (${p.intakeWithout} mot ${p.intakeWith} kcal) — måltiden kompenserades inte fullt ut.`}
        ${Math.abs(pDiff) >= 15 ? ` Proteinet ${pDiff < 0 ? 'sjönk' : 'steg'} ${Math.abs(pDiff)} g i snitt.` : ''}
      </div>`;
    }).join('')}
    <div class="cmp-note" style="border-top:1px solid var(--line); padding-top:8px;">
      Det här är en observation, inte ett orsakssamband — dagar då du hoppar över ett mål skiljer sig
      förmodligen på fler sätt (arbetspass, resor, träning). Med få dagar är siffrorna dessutom skakiga.
    </div>
  </div>`;
}

/* ---- Kopiera en tidigare dag ---- */
function recentLoggedDays(limit){
  const cur = ymd(state.currentDate);
  const out = [];
  for(let i = 1; i <= 30 && out.length < (limit||6); i++){
    const d = new Date(state.currentDate);
    d.setDate(d.getDate() - i);
    const key = ymd(d);
    if(key === cur) continue;
    const day = state.cache[key];
    if(!day) continue;
    const t = dayTotals(day);
    if(t.intake <= 0) continue;
    out.push({ date: d, key, totals: t, meals: day.food.length });
  }
  return out;
}
function copyDayAvailable(){ return recentLoggedDays(1).length > 0; }

function copyDayPanel(){
  const days = recentLoggedDays(6);
  const wd = ['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
  const mn = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  const target = state.cache[ymd(state.currentDate)] || { food: [] };
  const hasFood = target.food.length > 0;
  return `<div class="form">
    <div class="cmp-note" style="margin:0 0 10px;">
      Kopierar måltiderna${hasFood ? ' och lägger dem till de ' + target.food.length + ' du redan har' : ''}. Träning kopieras inte.
    </div>
    ${days.map(d => `
      <button class="copyday" data-key="${d.key}">
        <span><b>${wd[d.date.getDay()]} ${d.date.getDate()} ${mn[d.date.getMonth()]}</b>
          <small>${d.meals} ${d.meals === 1 ? 'måltid' : 'måltider'} · P ${Math.round(d.totals.protein)}g</small></span>
        <span class="dtk">${d.totals.intake} kcal</span>
      </button>`).join('')}
    <div class="actions" style="margin-top:10px;"><button class="cancel" id="cancelForm">Avbryt</button></div>
  </div>`;
}

/* Ologgade dagar de senaste 7 dagarna (exkl. idag). */
function missingDays(){
  const out = [];
  for(let i = 1; i <= 7; i++){
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = ymd(d);
    if(state.skippedDays.includes(key)) continue;
    const day = state.cache[key];
    if(!day || dayTotals(day).intake <= 0) out.push(d);
  }
  return out;
}
function missingDaysNotice(){
  if(ymd(state.currentDate) !== todayYmd()) return '';
  const miss = missingDays();
  if(!miss.length) return '';
  const wd = ['sön','mån','tis','ons','tors','fre','lör'];
  const chips = miss.slice(0,4).map(d => {
    const k = ymd(d);
    return `<span class="misschip">
      <button class="mcgo" data-ymd="${k}">${wd[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}</button>
      <button class="mcskip" data-ymd="${k}" title="Hoppa över dagen">×</button>
    </span>`;
  }).join('');
  return `<div class="missbox">
    <div class="misshead">
      <div class="misslbl">${miss.length === 1 ? '1 dag saknas' : miss.length + ' dagar saknas'} senaste veckan
        <small>Tryck på en dag för att fylla i, eller × för att hoppa över den.</small></div>
      <button class="misshide" id="skipAllMissing" title="Hoppa över alla">Dölj alla</button>
    </div>
    <div class="misschips">${chips}${miss.length > 4 ? `<span class="missmore">+${miss.length-4}</span>` : ''}</div>
  </div>`;
}

  const remaining = goal - t.net;
  const label = fmtDateLabel(state.currentDate);
  const circumference = 2 * Math.PI * 46;
  const dash = circumference * (pct/100);
  const overGoal = t.net > goal;

  content.innerHTML = `
    <div class="card">
      <div class="datebar">
        <button id="prevDay">‹</button>
        <div class="label">${label.main}<small>${label.sub}</small></div>

        <div class="ring">
          <svg width="112" height="112">
            <circle cx="56" cy="56" r="46" stroke="var(--line)" stroke-width="10" fill="none"/>
            <circle cx="56" cy="56" r="46" stroke="${overGoal?'var(--rust)':'var(--sage)'}" stroke-width="10" fill="none"
              stroke-dasharray="${circumference}" stroke-dashoffset="${circumference-dash}" stroke-linecap="round"/>
          </svg>
          <div class="center">
            <div class="num">${t.net}</div>
            <div class="unit">av ${goal} kcal</div>
          </div>

          <div class="stat sage"><div class="k">Träning</div><div class="v">−${t.burned}</div></div>
          <div class="stat"><div class="k">Netto</div><div class="v">${t.net}</div></div>
          <div class="stat"><div class="k">${remaining>=0?'Kvar':'Över'}</div><div class="v" style="color:${remaining>=0?'var(--sage)':'var(--rust)'}">${Math.abs(remaining)}</div></div>

    ${state.openForm === 'food' ? foodForm()

      : state.openForm === 'copyDay' ? copyDayPanel() : `
      <div style="display:flex; gap:8px;">
        <button class="addbtn food" id="addFood" style="flex:1;">+ Lägg till måltid</button>

      </div>

    `}
    ${data.food.length ? data.food.map((f,i)=>
      (state.editingTime && state.editingTime.type==='food' && state.editingTime.idx===i)
        ? timeEditRow(f,i,'food')
      : (state.editingEntry && state.editingEntry.type==='food' && state.editingEntry.idx===i)
        ? entryEditRow(f,i,'food') : entryRow(f,i,'food')).join('') : `<div class="empty">Inga måltider loggade</div>`}

    <div class="sectitle">Träning & aktivitet</div>
    ${inBaselineMode() ? activeKcalRow(data) : ''}
    ${state.openForm === 'exercise' ? exerciseForm()
      : state.openForm === 'dayEstimate' ? dayEstimatePanel(data)
      : `<div style="display:flex; gap:8px;">

      state.openForm = null;
      renderContent();

      state.currentDate = new Date(y, m-1, dd);
      state.openForm = null;
      renderContent();
    };
  });

  content.querySelectorAll('.mcskip').forEach(btn => {
    btn.onclick = async () => {
      const k = btn.dataset.ymd;
      if(!state.skippedDays.includes(k)) state.skippedDays.push(k);
      await ghSaveBundle();
      renderContent();
    };
  });

  const skipAll = document.getElementById('skipAllMissing');
  if(skipAll) skipAll.onclick = async () => {
    missingDays().forEach(d => {
      const k = ymd(d);
      if(!state.skippedDays.includes(k)) state.skippedDays.push(k);
    });
    await ghSaveBundle();
    renderContent();
  };

  const showFavBtn = document.getElementById('showFavorites');
  if(showFavBtn) showFavBtn.onclick = () => { state.openForm = 'favorites'; state.confirmDelFav = null; renderContent(); };

  content.querySelectorAll('.editentry').forEach(btn => {
    btn.onclick = () => {

      renderContent();

  const cancelEntry = document.getElementById('cancelEntry');
  if(cancelEntry) cancelEntry.onclick = () => { state.editingEntry = null; renderContent(); };

  const saveEntry = document.getElementById('saveEntry');
  if(saveEntry) saveEntry.onclick = async () => {
    const type = saveEntry.dataset.type, i = Number(saveEntry.dataset.idx);
    const item = data[type] && data[type][i];

    }
    await saveDay(dateStr, data);
    state.editingEntry = null;
    renderContent();
  };

  content.querySelectorAll('.edittime').forEach(btn => {
    btn.onclick = () => {
      state.editingTime = { type: btn.dataset.type, idx: Number(btn.dataset.idx) };
      renderContent();
    };
  });

  const cancelTimeBtn = document.getElementById('cancelTime');
  if(cancelTimeBtn) cancelTimeBtn.onclick = () => { state.editingTime = null; renderContent(); };

  const saveTimeBtn = document.getElementById('saveTime');
  if(saveTimeBtn) saveTimeBtn.onclick = async () => {
    const newTime = document.getElementById('timeInput').value;
    const newDate = document.getElementById('dateInput').value;
    const type = saveTimeBtn.dataset.type, i = Number(saveTimeBtn.dataset.idx);
    if(!data[type] || !data[type][i]){ state.editingTime = null; renderContent(); return; }

    const entry = data[type][i];
    if(newTime) entry.time = newTime;

    if(newDate && newDate !== dateStr){
      // Flytta posten till en annan dag
      data[type].splice(i, 1);
      const target = state.cache[newDate] || { food: [], exercise: [] };
      target[type].push(entry);
      sortByTime(target[type]);
      state.cache[newDate] = target;
      sortByTime(data[type]);
      await saveDay(dateStr, data);
      await saveDay(newDate, target);
      state.editingTime = null;
      noteSync(true, 'Flyttad till ' + newDate);
      renderContent();
      return;
    }

    sortByTime(data[type]);
    await saveDay(dateStr, data);
    state.editingTime = null;
    renderContent();
  };

  content.querySelectorAll('.qtybtn').forEach(btn => {
    btn.onclick = () => {
      const i = Number(btn.dataset.idx);
      const dir = Number(btn.dataset.dir);
      const next = Math.max(0.5, Math.min(10, favQty(i) + dir * 0.5));
      state.favQty[i] = next;
      const qEl = document.getElementById('favQty_' + i);
      const kEl = document.getElementById('favKcal_' + i);
      if(qEl) qEl.textContent = next;
      if(kEl) kEl.textContent = Math.round(state.favorites[i].kcal * next) + ' kcal';
    };
  });

  content.querySelectorAll('.addfav').forEach(btn => {
    btn.onclick = async () => {
      const i = Number(btn.dataset.idx);
      const fav = state.favorites[i];
      if(!fav) return;
      const q = favQty(i);
      const entry = {
        name: q === 1 ? fav.name : q + '× ' + fav.name,
        kcal: Math.round(fav.kcal * q),
        protein: Math.round((fav.protein||0) * q * 10)/10,
        fat: Math.round((fav.fat||0) * q * 10)/10,
        carbs: Math.round((fav.carbs||0) * q * 10)/10,
        time: timeForEntry(q === 1 ? fav.name : q + '× ' + fav.name)
      };
      if(fav.components && fav.components.length){
        entry.components = fav.components.map(c => ({...c, amount: (Number(c.amount)||0) * q}));
      }
      data.food.push(entry);
      sortByTime(data.food);
      await saveDay(dateStr, data);
      state.favQty[i] = 1;
      state.openForm = null;
      renderContent();
    };
  });

  content.querySelectorAll('.editfav').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      const fav = state.favorites[idx];
      if(!fav) return;
      state.editingFav = idx;
      state.openForm = 'food';
      if(fav.components && fav.components.length){
        state.foodFormMode = 'build';
        // djupkopia så avbryt inte förstör originalet
        state.mealBuilder = fav.components.map(c => ({
          name: c.name || '', unit: c.unit || 'g', amount: c.amount,
          kcalPer100: c.kcalPer100, proteinPer100: c.proteinPer100,
          fatPer100: c.fatPer100, carbsPer100: c.carbsPer100
        }));
      } else {
        state.foodFormMode = 'quick';
      }
      renderContent();
    };
  });

  content.querySelectorAll('.delfav').forEach(btn => {
    btn.onclick = async () => {
      const idx = Number(btn.dataset.idx);
      if(state.confirmDelFav === idx){
        state.confirmDelFav = null;
        state.favorites.splice(idx, 1);
        await ghSaveBundle();
        renderContent();
      } else {
        state.confirmDelFav = idx;
        renderContent();
      }
    };
  });

  const cancelDel = document.getElementById('cancelDelFav');
  if(cancelDel) cancelDel.onclick = () => { state.confirmDelFav = null; renderContent(); };

  const cancelBtn = document.getElementById('cancelForm');
  if(cancelBtn) cancelBtn.onclick = () => {
    const wasEditing = state.editingFav !== null;
    state.editingFav = null;
    state.confirmDelFav = null;
    state.mealType = null;
    state.mealBuilder = [];
    state.openForm = wasEditing ? 'favorites' : null;
    renderContent();
  };

  const saveFoodBtn = document.getElementById('saveFood');
  if(saveFoodBtn) saveFoodBtn.onclick = async () => {
    // Namn valfritt: faller tillbaka på måltidstypen
    const name = document.getElementById('fName').value.trim()
      || mealTypeLabel(state.mealType) || '';
    const kcal = Number(document.getElementById('fKcal').value) || 0;
    const protein = Number(document.getElementById('fProtein').value) || 0;
    const fat = Number(document.getElementById('fFat').value) || 0;
    const carbs = Number(document.getElementById('fCarbs').value) || 0;
    if(!name || !kcal) return;
    if(state.editingFav !== null){
      state.favorites[state.editingFav] = { name, kcal, protein, fat, carbs };
      state.editingFav = null;
      await ghSaveBundle();
      state.openForm = 'favorites';
      renderContent();
      return;
    }
    data.food.push({ name, kcal, protein, fat, carbs, time: timeForEntry(name, state.mealType),
      ...(state.mealType ? { mealType: state.mealType } : {}) });
    sortByTime(data.food);
    await saveDay(dateStr, data);
    const favCb = document.getElementById('fSaveFav');
    if(favCb && favCb.checked){
      state.favorites = state.favorites.filter(f => f.name !== name);
      state.favorites.push({ name, kcal, protein, fat, carbs });
      await ghSaveBundle();
    }
    state.openForm = null;
    renderContent();
  };

  const modeQuick = document.getElementById('modeQuick');
  if(modeQuick) modeQuick.onclick = () => { state.foodFormMode = 'quick'; renderContent(); };
  const modeBuild = document.getElementById('modeBuild');
  if(modeBuild) modeBuild.onclick = () => {
    state.foodFormMode = 'build';
    if(!state.mealBuilder.length) state.mealBuilder = [emptyIngredient()];
    renderContent();
  };

  const openPickerBtn = document.getElementById('openPicker');
  if(openPickerBtn) openPickerBtn.onclick = () => {
    state.pickerOpen = true; state.pantryQuery = ''; renderContent();
    const f = document.getElementById('pantrySearch'); if(f) f.focus();
  };
  const closePickerBtn = document.getElementById('closePicker');
  if(closePickerBtn) closePickerBtn.onclick = () => { state.pickerOpen = false; renderContent(); };

  const pSearch = document.getElementById('pantrySearch');
  if(pSearch){
    pSearch.oninput = () => {
      state.pantryQuery = pSearch.value;
      const box = document.querySelector('.pickerlist');
      const wrap = document.querySelector('.pickerbox');
      if(!wrap) return;
      const tmp = document.createElement('div');
      tmp.innerHTML = pantryPicker();
      const fresh = tmp.querySelector('.pickerlist');
      if(box && fresh) box.replaceWith(fresh);
      else renderContent();
      wirePickItems();
    };
  }

  function wirePickItems(){
    content.querySelectorAll('.pickitem').forEach(btn => {
      btn.onclick = async () => {
        const entry = findInPantry(btn.dataset.name, btn.dataset.unit);
        if(!entry) return;
        // Ersätt en tom rad, annars lägg till ny
        const empties = state.mealBuilder.filter(r => !r.name || !r.name.trim());
        let idx;
        if(empties.length){ idx = state.mealBuilder.indexOf(empties[0]); }
        else { state.mealBuilder.push(emptyIngredient()); idx = state.mealBuilder.length - 1; }
        const row = state.mealBuilder[idx];
        row.name = entry.name;
        applyPantryToRow(idx, entry);
        row.portion = Number(entry.portion) || (entry.unit==='st' ? 1 : 100);
        row.amount = row.portion;
        entry.lastUsed = Date.now();
        state.pickerOpen = false;
        state.pantryQuery = '';
        await ghSaveBundle();
        renderContent();
      };
    });
  }
  wirePickItems();

  content.querySelectorAll('.amtchip').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      state.mealBuilder[idx].amount = Number(btn.dataset.amt);
      const inp = content.querySelector(`.ing-amount[data-idx="${idx}"]`);
      if(inp) inp.value = btn.dataset.amt;
      content.querySelectorAll(`.amtchip[data-idx="${idx}"]`).forEach(c =>
        c.classList.toggle('active', c === btn));
      updateMealTotalsDOM();
    };
  });

  const addIngBtn = document.getElementById('addIngredient');
  if(addIngBtn) addIngBtn.onclick = () => { state.mealBuilder.push(emptyIngredient()); renderContent(); };

  content.querySelectorAll('.rmv').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      state.mealBuilder.splice(idx, 1);
      if(!state.mealBuilder.length) state.mealBuilder = [emptyIngredient()];
      renderContent();
    };
  });

  content.querySelectorAll('.estbtn[id^="estBtn_"]').forEach(btn => {
    btn.onclick = () => estimateIngredient(Number(btn.dataset.idx));
  });

  content.querySelectorAll('.mtbtn').forEach(b => {
    b.onclick = () => {
      // Redigeringsrad: bara byt aktiv klass, påverka inte state.mealType
      if(b.closest('.entry.editrow')){
        b.closest('.entry.editrow').querySelectorAll('.mtbtn').forEach(x =>
          x.classList.toggle('active', x === b));
        return;
      }
      // Normalt formulär: växla markeringen på plats
      state.mealType = state.mealType === b.dataset.mt ? null : b.dataset.mt;
      content.querySelectorAll('.mtbtn').forEach(x =>
        x.classList.toggle('active', x.dataset.mt === state.mealType));
    };
  });

  const quickEstBtn = document.getElementById('quickEstBtn');
  if(quickEstBtn) quickEstBtn.onclick = () => estimateQuickMeal();

  const quickPhotoBtn = document.getElementById('quickPhotoBtn');
  const quickPhotoInput = document.getElementById('quickPhotoInput');
  if(quickPhotoBtn && quickPhotoInput){
    quickPhotoBtn.onclick = () => quickPhotoInput.click();
    quickPhotoInput.onchange = () => {
      const f = quickPhotoInput.files && quickPhotoInput.files[0];
      if(f) estimateMealPhoto(f);
      quickPhotoInput.value = '';
    };
  }

  content.querySelectorAll('.unit-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      const newUnit = btn.dataset.unit;
      const row = state.mealBuilder[idx];
      if(row.unit === newUnit) return;
      row.unit = newUnit;
      // Rimliga standardmängder och nollställ näringsvärden (de byter betydelse)
      row.amount = newUnit === 'st' ? 1 : 100;
      row.kcalPer100 = 0; row.proteinPer100 = 0; row.fatPer100 = 0; row.carbsPer100 = 0;
      renderContent();
    };
  });

  content.querySelectorAll('.estbtn[id^="scanBtn_"]').forEach(btn => {
    btn.onclick = () => {
      const idx = btn.dataset.idx;
      const input = content.querySelector(`.scan-input[data-idx="${idx}"]`);
      if(input) input.click();
    };
  });

  content.querySelectorAll('.scan-input').forEach(input => {
    input.onchange = () => {
      const file = input.files && input.files[0];
      if(file) scanLabel(Number(input.dataset.idx), file);
      input.value = '';
    };
  });

  const fieldMap = {
    'ing-name': 'name', 'ing-amount': 'amount', 'ing-kcal': 'kcalPer100',
    'ing-protein': 'proteinPer100', 'ing-fat': 'fatPer100', 'ing-carbs': 'carbsPer100'
  };
  Object.keys(fieldMap).forEach(cls => {
    content.querySelectorAll('.' + cls).forEach(input => {
      input.oninput = () => {
        const idx = Number(input.dataset.idx);
        const key = fieldMap[cls];
        state.mealBuilder[idx][key] = input.value;
        if(key === 'amount' || key === 'name') state.mealBuilder[idx].note = null;
        if(key === 'name'){
          // Skriver man "40 g gurka" ska mängdfältet följa med direkt
          const q = parseAmountFromName(input.value);
          if(q && q.exact){
            const amtEl = content.querySelector(`.ing-amount[data-idx="${idx}"]`);
            if(amtEl && Number(amtEl.value) !== q.amount){
              state.mealBuilder[idx].amount = q.amount;
              amtEl.value = q.amount;
            }
          }
          const hit = findInPantry(input.value);
          if(hit){
            applyPantryToRow(idx, hit);
            renderContent();
            // behåll fokus i namnfältet efter omritning
            const again = content.querySelector(`.ing-name[data-idx="${idx}"]`);
            if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
            const st = document.getElementById('estStatus_' + idx);
            if(st){ st.style.color = 'var(--sage)'; st.textContent = 'Hämtat från ditt bibliotek'; }
            return;
          }
        }
        updateMealTotalsDOM();
      };
    });
  });

  content.querySelectorAll('.pantrybtn').forEach(btn => {
    btn.onclick = async () => {
      const idx = Number(btn.dataset.idx);
      btn.disabled = true; btn.textContent = 'Sparar…';
      await savePantryItem(state.mealBuilder[idx]);
      renderContent();
    };
  });

  const saveMealBtn = document.getElementById('saveMeal');
  if(saveMealBtn) saveMealBtn.onclick = async () => {
    const components = state.mealBuilder.filter(r => r.name && r.name.trim());
    if(!components.length) return;
    const t = computeMealTotals();
    const nameInput = document.getElementById('buildMealName').value.trim();
    // Namn är valfritt: måltidstypen först, annars ingredienserna
    const name = nameInput
      || mealTypeLabel(state.mealType)
      || components.map(c => c.name).join(', ');
    const entry = {
      name,
      kcal: Math.round(t.kcal),
      protein: Math.round(t.protein),
      fat: Math.round(t.fat),
      carbs: Math.round(t.carbs),
      components,
      time: timeForEntry(name, state.mealType),
      ...(state.mealType ? { mealType: state.mealType } : {})
    };
    if(state.editingFav !== null){
      state.favorites[state.editingFav] = { ...entry };
      state.editingFav = null;
      state.mealBuilder = [];
      await ghSaveBundle();
      state.openForm = 'favorites';
      renderContent();
      return;
    }
    data.food.push(entry);
    sortByTime(data.food);
    await saveDay(dateStr, data);
    const favCb2 = document.getElementById('buildSaveFav');
    if(favCb2 && favCb2.checked){
      state.favorites = state.favorites.filter(f => f.name !== name);
      state.favorites.push({ ...entry });
      await ghSaveBundle();
    }
    state.mealType = null;
    state.openForm = null;
    state.mealBuilder = [];
    renderContent();
  };

  const saveExBtn = document.getElementById('saveEx');
  if(saveExBtn) saveExBtn.onclick = async () => {
    const name = document.getElementById('eName').value.trim();
    const kcal = Number(document.getElementById('eKcal').value) || 0;
    if(!name || !kcal) return;
    data.exercise.push({ name, kcal, time: nowHM() });
    sortByTime(data.exercise);
    await saveDay(dateStr, data);
    state.openForm = null;
    renderContent();
  };

  content.querySelectorAll('.entry .del:not(.addfav):not(.delfav):not(.editfav)').forEach(btn=>{
    btn.onclick = async () => {
      const type = btn.dataset.type, idx = Number(btn.dataset.idx);
      if(!type) return;
      data[type].splice(idx,1);
      await saveDay(dateStr, data);
      renderContent();
    };
  });
}

/* Liggande staplat diagram: andel av dagens kalorier per makro.
   Färgerna är kategoriska; måluppfyllelse står i förklaringen under. */
function macroSplit(t){
  const mt = macroTargets();
  const kP = t.protein*4, kF = t.fat*9, kC = t.carbs*4;
  const sum = kP + kF + kC;
  if(sum <= 0){
    return `<div class="macrosplit">
      <div class="msbar empty"></div>
      <div class="mslegend"><span class="msempty">Ingen mat loggad än</span></div>
    </div>`;
  }
  const segs = [
    { key:'p', label:'Protein', g:Math.round(t.protein), kcal:kP, col:'var(--sage)',
      note: mt ? (t.protein >= mt.protein ? 'mål ' + mt.protein + 'g nått' : 'mål ' + mt.protein + 'g') : '',
      ok: mt ? t.protein >= mt.protein : null },
    { key:'f', label:'Fett', g:Math.round(t.fat), kcal:kF, col:'var(--gold)',
      note: mt ? (t.fat >= mt.fatFloor ? 'över golv ' + mt.fatFloor + 'g' : 'under golv ' + mt.fatFloor + 'g') : '',
      ok: mt ? t.fat >= mt.fatFloor : null },
    { key:'c', label:'Kolhydrater', g:Math.round(t.carbs), kcal:kC, col:'var(--rust)', note:'', ok:null }
  ];
  // Avrunda så att andelarna summerar till exakt 100
  let acc = 0;
  segs.forEach((sg,i) => {
    sg.pct = i === segs.length-1 ? 100-acc : Math.round(sg.kcal/sum*100);
    acc += sg.pct;
  });

  return `<div class="macrosplit">
    <div class="msbar">
      ${segs.filter(sg=>sg.pct>0).map(sg =>
        `<div class="msseg" style="width:${sg.pct}%; background:${sg.col}">
          ${sg.pct >= 10 ? sg.pct + '%' : ''}
        </div>`).join('')}
    </div>
    <div class="mslegend">
      ${segs.map(sg => `<div class="msitem">
        <span class="msdot" style="background:${sg.col}"></span>
        <span class="mstext"><b>${sg.label} ${sg.g}g</b>${sg.pct < 10 ? ` <span class="mspct">${sg.pct}%</span>` : ''}
          ${sg.note ? `<em class="${sg.ok===false?'bad':(sg.ok?'good':'')}">${sg.note}</em>` : ''}</span>
      </div>`).join('')}
    </div>
  </div>`;
}


function timeEditRow(item, idx, type){
  return `<div class="entry ${type} timeedit">
    <div style="flex:1; min-width:0;">
      <div class="sub" style="margin-bottom:6px;">När åt du "${item.name}"?</div>
      <div class="whenrow">
        <input type="date" id="dateInput" value="${ymd(state.currentDate)}">
        <input type="time" id="timeInput" value="${item.time || nowHM()}">
      </div>
    </div>
    <div class="right">
      <button class="confirmbtn no" id="cancelTime">Avbryt</button>
      <button class="confirmbtn save" id="saveTime" data-type="${type}" data-idx="${idx}">Spara</button>
    </div>

}

function entryRow(item, idx, type){
  let sub = '';
  if(type === 'food'){
    if(item.components && item.components.length){
      sub = `<div class="sub">${item.components.length} delar: ${item.components.map(c=>{
        const amt = Number(c.amount)||0;
        return c.unit === 'st' ? `${amt} st ${c.name}` : `${c.name} ${amt}g`;
      }).join(', ')}</div>`;
    } else {
      sub = `<div class="sub">P ${item.protein||0}g · F ${item.fat||0}g · K ${item.carbs||0}g</div>`;
    }
  }
  const time = item.time
    ? `<button class="etime edittime" data-type="${type}" data-idx="${idx}" title="Ändra tid">${item.time}</button>`
    : `<button class="etime edittime notime" data-type="${type}" data-idx="${idx}" title="Sätt tid">– –</button>`;
  const mt = type === 'food' ? (item.mealType || detectMealType(item.name)) : null;
  const mtTag = mt ? `<span class="mtag">${mealTypeLabel(mt)}</span>` : '';
  return `<div class="entry ${type}">
    <div>
      <div class="name">${time}${mtTag}${item.name}</div>
      ${sub}
    </div>
    <div class="right">
      <div class="kcal">${type==='exercise'?'−':''}${item.kcal} kcal</div>
      <button class="editentry" data-type="${type}" data-idx="${idx}" title="Ändra">✎</button>
      <button class="del" data-type="${type}" data-idx="${idx}">×</button>
    </div>
  </div>`;
}

}

    ${editing

      : `<div class="modeswitch">
          <button id="modeQuick" class="${state.foodFormMode==='quick'?'active':''}">Snabb</button>

        </div>`}

}

function quickFoodForm(){
  const ed = state.editingFav !== null ? state.favorites[state.editingFav] : null;

  try{
    const base64 = await fileToBase64(file);
    const data = await callAnthropic({
      model: "claude-sonnet-4-6",
      max_tokens: 600,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: file.type || 'image/jpeg', data: base64 } },
          { type: "text", text: `Du är en näringsexpert. Identifiera maten på tallriken och uppskatta portionsstorlekar utifrån vad som syns (använd tallrik, bestick eller glas som storleksreferens om möjligt). Var realistisk om tillagning: anta att synligt fett, olja eller smör i stekt mat räknas med. Svara ENDAST med ett JSON-objekt, ingen markdown, inga kodstaket. Format exakt: {"namn": "kort beskrivning av måltiden", "kcal": number, "protein": number, "fat": number, "carbs": number, "delar": "vad du identifierat och vilka mängder du antagit", "osakerhet": "lag" | "medel" | "hog"}` }
        ]
      }]
    });
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock) throw new Error('Tomt svar från modellen');
    const p = JSON.parse(textBlock.text.replace(/```json|```/g, '').trim());

    const setVal = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };
    const nameEl = document.getElementById('fName');
    if(nameEl && !nameEl.value.trim() && p.namn) nameEl.value = p.namn;

    setVal('fFat', Math.round((Number(p.fat) || 0) * 10) / 10);
    setVal('fCarbs', Math.round((Number(p.carbs) || 0) * 10) / 10);

    if(statusEl){
      const unc = { lag:'låg', medel:'medel', hog:'hög' }[p.osakerhet] || 'medel';
      const warn = p.osakerhet === 'hog';
      statusEl.style.color = warn ? 'var(--rust)' : 'var(--muted)';
      statusEl.innerHTML = `${p.delar ? p.delar + ' ' : ''}<b>Osäkerhet: ${unc}.</b> Fotouppskattningar slår ofta 20–40 % fel — justera siffrorna om du vet bättre.`;
    }
  } catch(e){
    console.error('Photo estimation failed', e);
    if(statusEl){
      statusEl.style.color = 'var(--rust)';
      statusEl.textContent = 'Fel: ' + (e && e.message ? e.message : 'okänt fel') + '. Fyll i manuellt.';
    }
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = '📸 Fota maten'; }
  }
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function callAnthropic(payload){
  if(!state.aiKey){
    throw new Error('Ingen Anthropic API-nyckel angiven (se Inställningar)');
  }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': state.aiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(payload)
  });
  if(!res.ok){
    const t = await res.text().catch(() => '');
    throw new Error(`API svarade ${res.status}: ${t.slice(0,150)}`);
  }
  return await res.json();
}

async function estimateIngredient(idx){
  const row = state.mealBuilder[idx];
  const statusEl = document.getElementById('estStatus_' + idx);
  if(!row || !row.name || !row.name.trim()){
    if(statusEl){ statusEl.style.color = 'var(--rust)'; statusEl.textContent = 'Skriv in ett livsmedel först.'; }
    return;
  }
  const raw0 = row.name.trim();
  // Biblioteket först: exakta värden och inget API-anrop
  const q0 = parseQuantityAnywhere(raw0);
  const hit0 = findInPantry(q0 ? q0.name : raw0) || findInPantry(raw0);
  if(hit0){
    row.name = hit0.name;
    applyPantryToRow(idx, hit0);
    if(q0 && ((q0.unit === 'st') === (hit0.unit === 'st'))) row.amount = q0.amount;
    hit0.lastUsed = Date.now();
    row.note = '✓ Från ditt bibliotek';
    renderContent();
    ghSaveBundle();
    return;
  }

  const btn = document.getElementById('estBtn_' + idx);
  if(btn){ btn.disabled = true; btn.textContent = 'Uppskattar…'; }
  if(statusEl) statusEl.textContent = '';
  try{
    const raw = raw0;
    const data = await callAnthropic({
      model: "claude-sonnet-4-6",
      max_tokens: 400,
      messages: [{
        role: "user",
        content: `Du är en näringsdatabas. Texten kan innehålla en mängd: "${raw}".
Dela upp den i mängd och livsmedel. Välj enhet "g" för sådant som vägs och "st" för sådant som räknas
(ägg, frukt, portionsbröd, korv med bröd). Vardagsmått som dl, msk och skivor räknas om till gram.
Anges ingen mängd, föreslå en normal portion.
Näringsvärdena ska avse PER 100 GRAM om enheten är "g", och PER STYCK om enheten är "st".
Svara ENDAST med ett JSON-objekt, ingen markdown, inga kodstaket. Format exakt:
{"namn": string (livsmedlet utan mängd), "unit": "g" | "st", "amount": number, "kcalPer100": number, "proteinPer100": number, "fatPer100": number, "carbsPer100": number, "antagande": string (kort, t.ex. "1 dl ≈ 100 g")}`
      }]
    });
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock) throw new Error('Tomt svar från modellen');
    const parsed = JSON.parse(textBlock.text.replace(/```json|```/g, '').trim());

    // Lokal tolkning vinner när den är exakt ("40 g"), annars modellens
    const local = parseAmountFromName(raw);
    const useLocal = local && local.exact;
    row.unit = useLocal ? local.unit : (parsed.unit === 'st' ? 'st' : 'g');
    const amt = useLocal ? local.amount : Number(parsed.amount);
    if(isFinite(amt) && amt > 0) row.amount = amt;
    if(parsed.namn) row.name = String(parsed.namn).trim();

    row.kcalPer100 = Math.round(Number(parsed.kcalPer100) || 0);
    row.proteinPer100 = Math.round((Number(parsed.proteinPer100) || 0) * 10) / 10;
    row.fatPer100 = Math.round((Number(parsed.fatPer100) || 0) * 10) / 10;
    row.carbsPer100 = Math.round((Number(parsed.carbsPer100) || 0) * 10) / 10;
    row.portion = null;
    const extra = !useLocal && parsed.antagande ? ' · ' + parsed.antagande : '';
    row.note = `Tolkat som ${row.amount}${row.unit === 'st' ? ' st' : ' g'} ${row.name}${extra}`;

    if(statusEl){
      statusEl.style.color = 'var(--rust)';

    }
  } finally {
