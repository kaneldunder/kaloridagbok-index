<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kaloridagbok</title>
<style>
  :root{
    --paper:#F7F4EE;
    --card:#FFFFFF;
    --ink:#23262B;
    --muted:#71757D;
    --line:#E7E2D8;
    --sage:#5B7B6A;
    --sage-light:#E4ECE6;
    --rust:#A85C40;
    --rust-light:#F3E3DB;
    --gold:#C9A24B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .display{font-family:Georgia,'Times New Roman',serif;}
  .app{max-width:520px;margin:0 auto;padding:20px 16px 0;}

  header.top{padding:4px 4px 18px; display:flex; align-items:center; justify-content:space-between;}
  header.top .apptitle{
    flex:1; text-align:center; font-size:34px; margin:0; font-weight:600;
    letter-spacing:-.01em; color:var(--sage);
  }
  .refreshbtn{
    border:1px solid var(--line); background:#fff; color:var(--muted);
    width:38px; height:38px; border-radius:50%; font-size:16px; cursor:pointer;
    flex-shrink:0;
  }
  .hdr-spacer{width:38px; flex-shrink:0;}
  .refreshbtn:disabled{opacity:.5;}
  .syncbar{font-size:11.5px; padding:0 4px 12px; min-height:14px;}

  nav.tabs{
    display:flex; gap:4px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:4px; margin-bottom:18px;
  }
  nav.tabs button{
    flex:1; border:none; background:transparent; padding:9px 4px;
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    color:var(--muted); border-radius:10px; cursor:pointer;
  }
  nav.tabs button.active{background:var(--sage); color:#fff;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:14px;
  }

  /* Day view */
  .datebar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .datebar button{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:#fff; font-size:16px; cursor:pointer; color:var(--ink);
  }
  .datebar .label{font-weight:600; font-size:15px; text-align:center;}
  .datebar .label small{display:block; font-weight:400; color:var(--muted); font-size:11.5px; margin-top:1px;}

  .ring-wrap{display:flex; align-items:center; gap:18px;}
  .ring{position:relative; width:112px; height:112px; flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring .center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .ring .center .num{font-size:22px; font-weight:600;}
  .ring .center .unit{font-size:10px; color:var(--muted); letter-spacing:.05em;}

  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; flex:1;}
  .stat{background:var(--paper); border-radius:10px; padding:8px 10px;}
  .stat .k{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .stat .v{font-size:16px; font-weight:600; margin-top:2px;}
  .stat.rust .v{color:var(--rust);}
  .stat.sage .v{color:var(--sage);}

  .macrorow{display:flex; gap:10px; margin-top:14px;}
  .macro{flex:1; text-align:center;}
  .macro .bar{height:5px; border-radius:3px; background:var(--line); overflow:hidden; margin-bottom:5px;}
  .macro .bar i{display:block; height:100%; background:var(--sage);}
  .macro .lbl{font-size:11px; color:var(--muted);}
  .macro .amt{font-size:13px; font-weight:600;}

  .sectitle{
    font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
    font-weight:700; margin:18px 0 8px 2px;
  }
  .entry{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:11px 12px; margin-bottom:8px;
  }
  .entry .name{font-size:14px; font-weight:600;}
  .entry .sub{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .entry .right{display:flex; align-items:center; gap:10px;}
  .entry .kcal{font-size:14px; font-weight:600;}
  .entry.exercise .kcal{color:var(--sage);}
  .entry .del{
    border:none; background:none; color:var(--muted); font-size:16px; cursor:pointer;
    width:24px; height:24px; line-height:1;
  }
  .entry .addfav{color:var(--sage); font-size:19px; font-weight:700;}
  .etime{
    display:inline-block; font-size:11px; font-weight:600; color:var(--muted);
    background:var(--paper); border-radius:5px; padding:1px 5px; margin-right:6px;
    vertical-align:1px;
  }
  .qtypick{display:flex; align-items:center; gap:2px; background:var(--paper); border-radius:14px; padding:2px;}
  .qtybtn{
    border:none; background:#fff; color:var(--ink); width:22px; height:22px;
    border-radius:50%; font-size:14px; line-height:1; cursor:pointer; font-family:inherit;
  }
  .qtyval{font-size:12px; font-weight:600; min-width:22px; text-align:center;}
  .entry.confirmdel{border-color:var(--rust); background:var(--rust-light);}
  .confirmbtn{
    border:none; border-radius:7px; padding:6px 10px; font-size:11.5px;
    font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .confirmbtn.no{background:#fff; color:var(--muted);}
  .confirmbtn.yes{background:var(--rust); color:#fff;}
  .confirmbtn.save{background:var(--ink); color:#fff;}
  button.etime{border:1px solid transparent; cursor:pointer; font-family:inherit;}
  button.etime:hover{border-color:var(--line);}
  button.etime.notime{color:var(--line);}
  .entry.timeedit{border-color:var(--ink); align-items:flex-end;}
  .entry.timeedit input[type="time"]{
    border:1px solid var(--line); border-radius:8px; padding:7px 9px;
    font-size:15px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:18px 0;}

  .addbtn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; padding:11px; border-radius:12px; border:1.5px dashed var(--line);
    background:transparent; color:var(--muted); font-size:13px; font-weight:600;
    cursor:pointer; margin-bottom:8px;
  }
  .addbtn.food{color:var(--rust); border-color:var(--rust-light);}
  .addbtn.exercise{color:var(--sage); border-color:var(--sage-light);}

  .form{background:var(--paper); border-radius:12px; padding:12px; margin-bottom:10px;}
  .form .row{display:flex; gap:8px; margin-bottom:8px;}
  .form input{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 10px;
    font-size:14px; font-family:'Inter',sans-serif; background:#fff;
  }
  .form .row input{flex:1;}
  .form .actions{display:flex; gap:8px;}
  .form .actions button{
    flex:1; border:none; border-radius:9px; padding:10px; font-weight:600;
    font-size:13.5px; cursor:pointer;
  }
  .form .save{background:var(--ink); color:#fff;}
  .form .cancel{background:var(--line); color:var(--ink);}

  .modeswitch{display:flex; gap:6px; margin-bottom:10px;}
  .modeswitch button{
    flex:1; border:1px solid var(--line); background:#fff; border-radius:8px;
    padding:7px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .modeswitch button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .editbanner{
    background:#FBF6EA; border:1px solid var(--gold); color:#8A6D2A;
    border-radius:9px; padding:8px 10px; font-size:12.5px; margin-bottom:10px;
  }
  .sliderval{text-align:center; margin-bottom:6px;}
  .sliderval b{font-size:32px; font-weight:600; color:var(--sage); display:block; line-height:1.1;}
  .sliderval span{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  #activitySlider{
    -webkit-appearance:none; appearance:none; width:100%; height:8px;
    border-radius:4px; background:var(--line); outline:none; margin:8px 0 2px;
  }
  #activitySlider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%;
    background:#fff; border:2px solid var(--sage); cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  #activitySlider::-moz-range-thumb{
    width:26px; height:26px; border-radius:50%; background:#fff;
    border:2px solid var(--sage); cursor:pointer;
  }
  .sliderends{display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); margin-bottom:12px;}
  .presets{display:flex; gap:5px; margin-bottom:12px; flex-wrap:wrap;}
  .presets .preset{
    flex:1 1 auto; border:1px solid var(--line); background:#fff; border-radius:20px;
    padding:7px 10px; font-size:11.5px; font-weight:600; color:var(--muted);
    cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .budget{background:#fff; border:1px solid var(--line); border-radius:11px; padding:11px 12px;}
  .budgetrow{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; padding:3px 0; color:var(--muted);}
  .budgetrow b{color:var(--ink); font-weight:600;}
  .budgetrow.total{border-top:1px solid var(--line); margin-top:5px; padding-top:8px; color:var(--ink); font-weight:600;}
  .budgetrow.total b{font-size:19px;}

  .ingcard{background:#fff; border:1px solid var(--line); border-radius:11px; padding:10px; margin-bottom:8px;}
  .ingcard .toprow{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .ingcard .toprow input{flex:1;}
  .ingcard .rmv{
    flex-shrink:0; border:none; background:var(--rust-light); color:var(--rust);
    width:28px; height:28px; border-radius:50%; font-size:15px; cursor:pointer;
  }
  .fieldgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px;}
  .fieldgrid label{
    display:block; font-size:9.5px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.03em; margin-bottom:2px;
  }
  .ingcard .sub{font-size:12px; color:var(--sage); font-weight:600; text-align:right; margin-top:2px;}
  .addingbtn{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    padding:9px; border-radius:10px; border:1.5px dashed var(--line); background:transparent;
    color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer; margin-bottom:10px;
  }
  .estbtn{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    padding:7px; border-radius:8px; border:1px solid var(--gold); background:#FBF6EA;
    color:#8A6D2A; font-size:11.5px; font-weight:600; cursor:pointer; margin-bottom:8px;
  }
  .estbtn:disabled{opacity:.6; cursor:default;}
  .est-status{font-size:11px; color:var(--rust); margin-bottom:6px; min-height:14px; line-height:1.4;}
  .unitswitch{display:flex; gap:5px; margin-bottom:8px;}
  .unitswitch button{
    flex:1; border:1px solid var(--line); background:#fff; border-radius:7px;
    padding:6px; font-size:11.5px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .unitswitch button.active{background:var(--sage); color:#fff; border-color:var(--sage);}
  .pantrybtn{
    border:1px solid var(--line); background:#fff; border-radius:7px; padding:5px 9px;
    font-size:11px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .pantrybtn.saved{background:var(--sage-light); color:var(--sage); border-color:var(--sage-light); cursor:default;}
  .mealtotals{
    display:flex; justify-content:space-between; background:var(--sage-light); border-radius:10px;
    padding:10px 12px; margin-bottom:10px; font-size:12.5px;
  }
  .mealtotals .tot b{font-size:15px; display:block;}

  /* Week/month bars */
  .netchart{width:100%; height:auto; display:block; margin:2px 0 2px;}
  .netchart .axlbl{font-size:9px; fill:var(--muted); font-family:inherit;}
  .netchart .goallbl{font-size:9px; fill:var(--gold); font-family:inherit; font-weight:600;}
  .balancecurve .axlbl{font-size:9px; fill:var(--muted); font-family:inherit;}
  .activerow{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#fff; border:1.5px solid var(--gold); border-radius:12px;
    padding:11px 12px; margin-bottom:8px;
  }
  .activerow.filled{border-color:var(--sage-light); background:var(--sage-light);}
  .activelbl b{display:block; font-size:13.5px; font-weight:600;}
  .activelbl small{display:block; font-size:11px; color:var(--muted); margin-top:1px;}
  .activeinput{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .activeinput input{
    width:64px; border:1px solid var(--line); border-radius:8px; padding:8px 6px;
    font-size:17px; font-weight:600; text-align:center; font-family:inherit;
    background:#fff; color:var(--ink); -moz-appearance:textfield;
  }
  .activeinput .unit{font-size:11px; color:var(--muted);}
  .activesave{
    border:none; background:var(--sage); color:#fff; border-radius:8px;
    padding:8px 11px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .activesave.pending{background:var(--ink);}
  .summaryrow{display:flex; gap:8px; margin-top:14px;}
  .summaryrow .stat{flex:1;}
  .compare{margin-top:14px; padding:12px; background:var(--paper); border-radius:12px;}
  .compare .cmp-row{display:flex; gap:12px;}
  .compare .cmp-row > div{flex:1;}
  .compare .k{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .compare .v{font-size:19px; font-weight:600; margin-top:2px;}
  .cmp-note{font-size:11.5px; color:var(--muted); line-height:1.45; margin-top:8px;}
  .balancehead{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2px;}
  .balanceval{font-size:24px; font-weight:600; margin-top:2px; letter-spacing:-.01em;}
  .balancecurve{width:100%; height:auto; display:block; margin-top:6px;}
  .calcline{display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; padding:5px 0; color:var(--muted);}
  .calcline b{color:var(--ink); font-size:14px;}
  .calcline.total{border-top:1px solid var(--line); margin-top:4px; padding-top:8px; color:var(--ink); font-weight:600;}
  .calcline.total b{font-size:18px; color:var(--sage);}
  .settingsrow select{width:100%; border:1px solid var(--line); border-radius:9px;
    padding:10px; font-size:14px; background:#fff; font-family:inherit; color:var(--ink);}
  .sex-btn{flex:1; border:1px solid var(--line); background:#fff; border-radius:7px;
    padding:8px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer;}
  .sex-btn.active{background:var(--sage); color:#fff; border-color:var(--sage);}

  /* Weight */
  .weightgraph{width:100%; height:auto; display:block;}
  .weightgraph .axlbl{font-size:9px; fill:var(--muted); font-family:inherit;}
  .weightform{display:flex; gap:8px; margin-bottom:12px;}
  .weightform input{flex:1;}
  .weightform button{
    border:none; background:var(--ink); color:#fff; border-radius:9px;
    padding:0 16px; font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .wentry{display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .wentry .d{color:var(--muted);}

  .settingsrow{margin-bottom:14px;}
  .settingsrow label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .settingsrow input{width:100%; border:1px solid var(--line); border-radius:9px; padding:10px; font-size:14px; background:#fff;}

  .loading{text-align:center; padding:60px 0; color:var(--muted); font-size:14px;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">Laddar…</div>
</div>

<script>
window.onerror = function(msg, src, line, col, err){
  const app = document.getElementById('app');
  if(app) app.innerHTML = '<div class="card"><div class="empty">Ett fel uppstod: ' + msg + ' (rad ' + line + ')</div></div>';
};

let state = {
  settings: { dailyGoal: 2200, startWeight: 100, targetWeight: 90,
              height: null, age: null, sex: 'man', activity: 1.3, deficit: 500 },
  weights: [],
  favorites: [],
  pantry: [],
  cache: {},
  view: 'day',
  currentDate: new Date(),
  openForm: null,
  foodFormMode: 'quick',
  mealBuilder: [],
  editingFav: null,
  confirmDelFav: null,
  favQty: {},
  editingTime: null,
  lastSync: null,
  gh: { owner: '', repo: '', token: '', path: 'kaloridagbok-data.json', branch: 'main', sha: null },
  aiKey: '',
};

function loadAiKey(){
  try{ state.aiKey = localStorage.getItem('kaloridagbok-ai-key') || ''; }
  catch(e){ console.error('Could not read AI key', e); }
}
function saveAiKey(key){
  try{ localStorage.setItem('kaloridagbok-ai-key', key); state.aiKey = key; }
  catch(e){ console.error('Could not save AI key', e); }
}

function loadGhConfig(){
  try{
    const raw = localStorage.getItem('kaloridagbok-gh-config');
    if(raw) state.gh = { ...state.gh, ...JSON.parse(raw) };
  }catch(e){ console.error('Could not read GitHub config', e); }
}
function saveGhConfig(){
  try{
    const { owner, repo, token, path, branch } = state.gh;
    localStorage.setItem('kaloridagbok-gh-config', JSON.stringify({ owner, repo, token, path, branch }));
  }catch(e){ console.error('Could not save GitHub config', e); }
}
function ghConfigured(){
  return !!(state.gh.owner && state.gh.repo && state.gh.token);
}

function emptyIngredient(){
  return { name:'', unit:'g', amount:100, kcalPer100:0, proteinPer100:0, fatPer100:0, carbsPer100:0 };
}
/* Faktor att multiplicera näringsvärdena med.
   unit 'g'  -> värdena är per 100 g, mängd i gram
   unit 'st' -> värdena är per 1 styck, mängd i antal */
function ingredientFactor(row){
  const amt = Number(row.amount)||0;
  return row.unit === 'st' ? amt : amt/100;
}
function computeMealTotals(){
  return state.mealBuilder.reduce((acc, row) => {
    const factor = ingredientFactor(row);
    acc.kcal += factor * (Number(row.kcalPer100)||0);
    acc.protein += factor * (Number(row.proteinPer100)||0);
    acc.fat += factor * (Number(row.fatPer100)||0);
    acc.carbs += factor * (Number(row.carbsPer100)||0);
    return acc;
  }, { kcal:0, protein:0, fat:0, carbs:0 });
}
function ingredientSubKcal(row){
  return Math.round(ingredientFactor(row) * (Number(row.kcalPer100)||0));
}
function unitLabel(row){
  return row.unit === 'st' ? '/ st' : '/ 100g';
}

/* ---- Livsmedelsbibliotek ---- */
function normName(s){ return (s||'').trim().toLowerCase(); }
function findInPantry(name, unit){
  const n = normName(name);
  if(!n) return null;
  return state.pantry.find(p => normName(p.name) === n && (unit ? p.unit === unit : true))
      || state.pantry.find(p => normName(p.name) === n)
      || null;
}
function pantryHasExact(row){
  const p = findInPantry(row.name, row.unit);
  return !!(p && p.unit === row.unit
    && Number(p.kcalPer100) === Number(row.kcalPer100)
    && Number(p.proteinPer100) === Number(row.proteinPer100)
    && Number(p.fatPer100) === Number(row.fatPer100)
    && Number(p.carbsPer100) === Number(row.carbsPer100));
}
async function savePantryItem(row){
  const item = {
    name: row.name.trim(), unit: row.unit || 'g',
    kcalPer100: Number(row.kcalPer100)||0,
    proteinPer100: Number(row.proteinPer100)||0,
    fatPer100: Number(row.fatPer100)||0,
    carbsPer100: Number(row.carbsPer100)||0
  };
  state.pantry = state.pantry.filter(p => !(normName(p.name) === normName(item.name) && p.unit === item.unit));
  state.pantry.push(item);
  state.pantry.sort((a,b) => a.name.localeCompare(b.name, 'sv'));
  await ghSaveBundle();
}
function applyPantryToRow(idx, entry){
  const row = state.mealBuilder[idx];
  row.unit = entry.unit;
  row.kcalPer100 = entry.kcalPer100;
  row.proteinPer100 = entry.proteinPer100;
  row.fatPer100 = entry.fatPer100;
  row.carbsPer100 = entry.carbsPer100;
  if(row.unit === 'st' && (!row.amount || row.amount === 100)) row.amount = 1;
}
function updateMealTotalsDOM(){
  const t = computeMealTotals();
  const kcalEl = document.getElementById('buildTotKcal');
  const proteinEl = document.getElementById('buildTotProtein');
  const fatEl = document.getElementById('buildTotFat');
  const carbsEl = document.getElementById('buildTotCarbs');
  if(kcalEl) kcalEl.textContent = Math.round(t.kcal);
  if(proteinEl) proteinEl.textContent = Math.round(t.protein) + 'g';
  if(fatEl) fatEl.textContent = Math.round(t.fat) + 'g';
  if(carbsEl) carbsEl.textContent = Math.round(t.carbs) + 'g';
  state.mealBuilder.forEach((row, i) => {
    const subEl = document.getElementById('ingSub_' + i);
    if(subEl) subEl.textContent = '≈ ' + ingredientSubKcal(row) + ' kcal';
    const pb = document.getElementById('pantryBtn_' + i);
    if(pb){
      const canSave = row.name && row.name.trim() && Number(row.kcalPer100) > 0;
      const saved = pantryHasExact(row);
      pb.style.visibility = canSave ? 'visible' : 'hidden';
      pb.disabled = saved;
      pb.classList.toggle('saved', saved);
      pb.textContent = saved ? '✓ I mitt bibliotek' : '💾 Spara livsmedel';
    }
  });
}

function ymd(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayYmd(){ return ymd(new Date()); }
function sortByTime(list){
  list.sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
  return list;
}
function nowHM(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtDateLabel(d){
  const dayNames = ['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
  const monthNames = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  const isToday = ymd(d) === todayYmd();
  return { main: `${d.getDate()} ${monthNames[d.getMonth()]}`, sub: isToday ? 'Idag' : dayNames[d.getDay()] };
}

function noteSync(ok, label){
  state.lastSync = { ok, label, time: new Date() };
  const el = document.getElementById('syncBanner');
  if(el) el.innerHTML = syncBannerHTML();
}
function syncBannerHTML(){
  if(!state.lastSync) return '';
  const { ok, label, time } = state.lastSync;
  const hh = String(time.getHours()).padStart(2,'0');
  const mm = String(time.getMinutes()).padStart(2,'0');
  const ss = String(time.getSeconds()).padStart(2,'0');
  return `<span style="color:${ok?'var(--sage)':'var(--rust)'}">${ok?'✓':'⚠'} ${label} kl ${hh}:${mm}:${ss}${ok?'':' — sparades EJ till molnet'}</span>`;
}

function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(escape(atob(str)));
}

async function ghRequest(options = {}){
  const cfg = state.gh;
  const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodeURIComponent(cfg.path)}`;
  return fetch(url, {
    ...options,
    headers: {
      'Authorization': `Bearer ${cfg.token}`,
      'Accept': 'application/vnd.github+json',
      ...(options.headers || {})
    }
  });
}

async function ghLoadBundle(){
  if(!ghConfigured()){
    noteSync(false, 'GitHub ej konfigurerat – fyll i under Inställningar');
    return null;
  }
  try{
    const res = await ghRequest({ method: 'GET' });
    if(res.status === 404){
      state.gh.sha = null;
      noteSync(true, 'Ingen datafil i GitHub ännu (skapas vid första sparning)');
      return null;
    }
    if(!res.ok){
      const t = await res.text().catch(() => '');
      throw new Error(`GitHub svarade ${res.status}: ${t.slice(0,120)}`);
    }
    const json = await res.json();
    state.gh.sha = json.sha;
    const decoded = b64DecodeUnicode(json.content.replace(/\n/g, ''));
    const bundle = JSON.parse(decoded);
    noteSync(true, 'Hämtade data från GitHub');
    return bundle;
  }catch(e){
    console.error('GitHub load failed', e);
    noteSync(false, `Kunde inte hämta från GitHub (${(e.message || '').slice(0,80)})`);
    return null;
  }
}

async function ghSaveBundle(retry = true){
  if(!ghConfigured()){
    noteSync(false, 'GitHub ej konfigurerat – fyll i under Inställningar');
    return false;
  }
  const bundle = {
    settings: state.settings,
    weights: state.weights,
    favorites: state.favorites,
    pantry: state.pantry,
    days: state.cache
  };
  try{
    const body = {
      message: `Uppdatera kaloridagbok ${new Date().toISOString()}`,
      content: b64EncodeUnicode(JSON.stringify(bundle)),
      branch: state.gh.branch || 'main'
    };
    if(state.gh.sha) body.sha = state.gh.sha;
    const res = await ghRequest({ method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if(res.status === 409 && retry){
      await ghLoadBundle();
      return await ghSaveBundle(false);
    }
    if(!res.ok){
      const t = await res.text().catch(() => '');
      throw new Error(`GitHub svarade ${res.status}: ${t.slice(0,120)}`);
    }
    const json = await res.json();
    state.gh.sha = json.content.sha;
    noteSync(true, 'Sparat till GitHub');
    return true;
  }catch(e){
    console.error('GitHub save failed', e);
    noteSync(false, `Kunde inte spara till GitHub (${(e.message || '').slice(0,80)})`);
    return false;
  }
}

async function loadDay(dateStr){
  if(!state.cache[dateStr]) state.cache[dateStr] = { food: [], exercise: [] };
  return state.cache[dateStr];
}
async function saveDay(dateStr, data){
  state.cache[dateStr] = data;
  return await ghSaveBundle();
}

function dayTotals(data){
  const intake = data.food.reduce((s,f)=>s+Number(f.kcal||0),0);
  const burned = data.exercise.reduce((s,e)=>s+Number(e.kcal||0),0);
  const protein = data.food.reduce((s,f)=>s+Number(f.protein||0),0);
  const fat = data.food.reduce((s,f)=>s+Number(f.fat||0),0);
  const carbs = data.food.reduce((s,f)=>s+Number(f.carbs||0),0);
  return { intake, burned, net: intake - burned, protein, fat, carbs };
}

  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="top">

        </button>`).join('')}
    </nav>
    <div id="content"></div>
  `;
  app.querySelectorAll('nav.tabs button').forEach(btn=>{
    btn.onclick = () => { state.view = btn.dataset.view; state.openForm = null; render(); };
  });

  renderContent();
}

let renderToken = 0;
function currentToken(){ return renderToken; }
function isStale(token){
  return token !== renderToken || !document.getElementById('content');
}
async function renderContent(){
  const content = document.getElementById('content');
  if(!content) return;
  renderToken++;
  if(state.view === 'day') return renderDay(content);
  if(state.view === 'week') return renderWeek(content);
  if(state.view === 'month') return renderMonth(content);
  if(state.view === 'year') return renderYear(content);
  if(state.view === 'weight') return renderWeightView(content);
  if(state.view === 'settings') return renderSettings(content);
}

  Object.keys(fieldMap).forEach(cls => {
    content.querySelectorAll('.' + cls).forEach(input => {
      input.oninput = () => {
        const idx = Number(input.dataset.idx);
        const key = fieldMap[cls];
        state.mealBuilder[idx][key] = input.value;
        if(key === 'name'){
          const hit = findInPantry(input.value);
          if(hit){
            applyPantryToRow(idx, hit);
            renderContent();
            // behåll fokus i namnfältet efter omritning
            const again = content.querySelector(`.ing-name[data-idx="${idx}"]`);
            if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
            const st = document.getElementById('estStatus_' + idx);
            if(st){ st.style.color = 'var(--sage)'; st.textContent = 'Hämtat från ditt bibliotek'; }
            return;
          }
        }
        updateMealTotalsDOM();
      };
    });
  });

  content.querySelectorAll('.pantrybtn').forEach(btn => {
    btn.onclick = async () => {
      const idx = Number(btn.dataset.idx);
      btn.disabled = true; btn.textContent = 'Sparar…';
      await savePantryItem(state.mealBuilder[idx]);
      renderContent();
    };
  });

  const saveMealBtn = document.getElementById('saveMeal');
  if(saveMealBtn) saveMealBtn.onclick = async () => {
    const components = state.mealBuilder.filter(r => r.name && r.name.trim());
    if(!components.length) return;
    const t = computeMealTotals();
    const nameInput = document.getElementById('buildMealName').value.trim();
    const name = nameInput || components.map(c => c.name).join(', ');
    const entry = {
      name,
      kcal: Math.round(t.kcal),
      protein: Math.round(t.protein),
      fat: Math.round(t.fat),
      carbs: Math.round(t.carbs),
      components,
      time: nowHM()
    };
    if(state.editingFav !== null){
      state.favorites[state.editingFav] = { ...entry };
      state.editingFav = null;
      state.mealBuilder = [];
      await ghSaveBundle();
      state.openForm = 'favorites';
      renderContent();
      return;
    }
    data.food.push(entry);
    sortByTime(data.food);
    await saveDay(dateStr, data);
    const favCb2 = document.getElementById('buildSaveFav');
    if(favCb2 && favCb2.checked){
      state.favorites = state.favorites.filter(f => f.name !== name);
      state.favorites.push({ ...entry });
      await ghSaveBundle();
    }
    state.openForm = null;
    state.mealBuilder = [];
    renderContent();
  };

  const saveExBtn = document.getElementById('saveEx');
  if(saveExBtn) saveExBtn.onclick = async () => {
    const name = document.getElementById('eName').value.trim();
    const kcal = Number(document.getElementById('eKcal').value) || 0;
    if(!name || !kcal) return;
    data.exercise.push({ name, kcal, time: nowHM() });
    sortByTime(data.exercise);
    await saveDay(dateStr, data);
    state.openForm = null;
    renderContent();
  };

  content.querySelectorAll('.entry .del:not(.addfav):not(.delfav):not(.editfav)').forEach(btn=>{
    btn.onclick = async () => {
      const type = btn.dataset.type, idx = Number(btn.dataset.idx);
      if(!type) return;
      data[type].splice(idx,1);
      await saveDay(dateStr, data);
      renderContent();
    };
  });
}

async function estimateMealPhoto(file){
  const statusEl = document.getElementById('quickEstStatus');
  const btn = document.getElementById('quickPhotoBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Analyserar…'; }
  if(statusEl){ statusEl.style.color = 'var(--muted)'; statusEl.textContent = 'Läser bilden…'; }
  try{
    const base64 = await fileToBase64(file);
    const data = await callAnthropic({
      model: "claude-sonnet-4-6",
      max_tokens: 600,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: file.type || 'image/jpeg', data: base64 } },
          { type: "text", text: `Du är en näringsexpert. Identifiera maten på tallriken och uppskatta portionsstorlekar utifrån vad som syns (använd tallrik, bestick eller glas som storleksreferens om möjligt). Var realistisk om tillagning: anta att synligt fett, olja eller smör i stekt mat räknas med. Svara ENDAST med ett JSON-objekt, ingen markdown, inga kodstaket. Format exakt: {"namn": "kort beskrivning av måltiden", "kcal": number, "protein": number, "fat": number, "carbs": number, "delar": "vad du identifierat och vilka mängder du antagit", "osakerhet": "lag" | "medel" | "hog"}` }
        ]
      }]
    });
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock) throw new Error('Tomt svar från modellen');
    const p = JSON.parse(textBlock.text.replace(/```json|```/g, '').trim());

    const setVal = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };
    const nameEl = document.getElementById('fName');
    if(nameEl && !nameEl.value.trim() && p.namn) nameEl.value = p.namn;
    setVal('fKcal', Math.round(Number(p.kcal) || 0));
    setVal('fProtein', Math.round((Number(p.protein) || 0) * 10) / 10);
    setVal('fFat', Math.round((Number(p.fat) || 0) * 10) / 10);
    setVal('fCarbs', Math.round((Number(p.carbs) || 0) * 10) / 10);

    if(statusEl){
      const unc = { lag:'låg', medel:'medel', hog:'hög' }[p.osakerhet] || 'medel';
      const warn = p.osakerhet === 'hog';
      statusEl.style.color = warn ? 'var(--rust)' : 'var(--muted)';
      statusEl.innerHTML = `${p.delar ? p.delar + ' ' : ''}<b>Osäkerhet: ${unc}.</b> Fotouppskattningar slår ofta 20–40 % fel — justera siffrorna om du vet bättre.`;
    }
  } catch(e){
    console.error('Photo estimation failed', e);
    if(statusEl){
      statusEl.style.color = 'var(--rust)';
      statusEl.textContent = 'Fel: ' + (e && e.message ? e.message : 'okänt fel') + '. Fyll i manuellt.';
    }
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = '📸 Fota maten'; }
  }
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function callAnthropic(payload){
  if(!state.aiKey){
    throw new Error('Ingen Anthropic API-nyckel angiven (se Inställningar)');
  }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': state.aiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(payload)
  });
  if(!res.ok){
    const t = await res.text().catch(() => '');
    throw new Error(`API svarade ${res.status}: ${t.slice(0,150)}`);
  }
  return await res.json();
}

async function estimateIngredient(idx){
  const row = state.mealBuilder[idx];
  const statusEl = document.getElementById('estStatus_' + idx);
  if(!row || !row.name || !row.name.trim()){
    if(statusEl) statusEl.textContent = 'Skriv in ett livsmedel först.';
    return;
  }
  const btn = document.getElementById('estBtn_' + idx);
  if(btn){ btn.disabled = true; btn.textContent = 'Uppskattar…'; }
  if(statusEl) statusEl.textContent = '';
  try{
    const perPiece = row.unit === 'st';
    const prompt = perPiece
      ? `Du är en näringsdatabas. Uppskatta näringsinnehållet för EN (1) normalstor portion/enhet av: "${row.name}". Utgå från en typisk svensk normalstorlek (t.ex. 1 medelstor banan ≈ 120 g ätlig del, 1 korv med bröd = korv + bröd inkl. vanliga tillbehör). Anta vanligast förekommande beredning. Svara ENDAST med ett JSON-objekt, inga förklaringar, ingen markdown, inga kodstaket. Fälten avser innehållet PER STYCK. Format exakt: {"kcalPer100": number, "proteinPer100": number, "fatPer100": number, "carbsPer100": number, "antagenVikt": "kort text, t.ex. 1 medelstor banan ca 120 g"}`
      : `Du är en näringsdatabas. Ge en realistisk uppskattning av näringsinnehåll per 100 gram för livsmedlet: "${row.name}". Anta vanligast förekommande beredning/tillagningssätt om inget annat anges. Svara ENDAST med ett JSON-objekt, inga förklaringar, ingen markdown, inga kodstaket. Format exakt: {"kcalPer100": number, "proteinPer100": number, "fatPer100": number, "carbsPer100": number}`;
    const data = await callAnthropic({
      model: "claude-sonnet-4-6",
      max_tokens: 300,
      messages: [{ role: "user", content: prompt }]
    });
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock) throw new Error('Tomt svar från modellen');
    const cleaned = textBlock.text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);

    row.kcalPer100 = Math.round(Number(parsed.kcalPer100) || 0);
    row.proteinPer100 = Math.round((Number(parsed.proteinPer100) || 0) * 10) / 10;
    row.fatPer100 = Math.round((Number(parsed.fatPer100) || 0) * 10) / 10;
    row.carbsPer100 = Math.round((Number(parsed.carbsPer100) || 0) * 10) / 10;

    const setVal = (cls, val) => {
      const el = document.querySelector(`.${cls}[data-idx="${idx}"]`);
      if(el) el.value = val;
    };
    setVal('ing-kcal', row.kcalPer100);
    setVal('ing-protein', row.proteinPer100);
    setVal('ing-fat', row.fatPer100);
    setVal('ing-carbs', row.carbsPer100);
    updateMealTotalsDOM();
    if(statusEl){
      statusEl.style.color = 'var(--muted)';
      statusEl.textContent = perPiece && parsed.antagenVikt ? 'Antagande: ' + parsed.antagenVikt : '';
    }
  } catch(e){
    console.error('Estimation failed', e);
    if(statusEl){
      statusEl.style.color = 'var(--rust)';
      statusEl.textContent = 'Fel: ' + (e && e.message ? e.message : 'okänt fel') + '. Fyll i manuellt.';
    }
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = '✨ Uppskatta'; }
  }
}

async function scanLabel(idx, file){
  const row = state.mealBuilder[idx];
  if(!row) return;
  const btn = document.getElementById('scanBtn_' + idx);
  const statusEl = document.getElementById('estStatus_' + idx);
  const original = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Läser bilden…'; }
  if(statusEl) statusEl.textContent = '';
  try{
    const base64 = await fileToBase64(file);
    const mediaType = file.type || 'image/jpeg';
    const data = await callAnthropic({
      model: "claude-sonnet-4-6",
      max_tokens: 400,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
          { type: "text", text: `Läs näringsdeklarationen på bilden. Om värdena anges per annan mängd än 100 g, räkna om till PER 100 GRAM. Svara ENDAST med ett JSON-objekt, ingen förklaring, ingen markdown, inga kodstaket. Format exakt: {"name": string, "kcalPer100": number, "proteinPer100": number, "fatPer100": number, "carbsPer100": number}` }
        ]
      }]
    });
    const textBlock = (data.content || []).find(b => b.type === 'text');

    row.carbsPer100 = Math.round((Number(parsed.carbsPer100) || 0) * 10) / 10;

    setVal('ing-fat', row.fatPer100);
    setVal('ing-carbs', row.carbsPer100);
    updateMealTotalsDOM();
  } catch(e){
    console.error('Label scan failed', e);
    if(statusEl) statusEl.textContent = 'Fel: ' + (e && e.message ? e.message : 'okänt fel') + '. Prova igen eller fyll i manuellt.';
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = original || '📷 Skanna etikett'; }
  }
}

/* ---------- WEEK VIEW ---------- */
/* Jämför teoretiskt underskott med faktisk viktförändring. */
/* ---------- DIAGRAM ---------- */
function niceStep(max){
  const raw = max/3;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  return [1,2,2.5,5,10].map(m=>m*pow).find(s=>s>=raw) || pow*10;
}
/* Stapeldiagram för netto per dag.
   mode 'week' → veckodagsbokstäver, 'month' → var 5:e datum. */
function netBarChart(results, goal, mode){
  const n = results.length;
  const W = 340, H = 150, padL = 34, padR = 6, padB = 18, padT = 8;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxVal = Math.max(goal * 1.25, ...results.map(r => r.totals.net), 1);
  const step = niceStep(maxVal);
  const top = Math.ceil(maxVal/step)*step;
  const y = v => padT + plotH - (v/top)*plotH;
  const slot = plotW / n;
  const bw = Math.min(mode==='week' ? 22 : 9, slot * 0.66);
  const todayStr = todayYmd();

  const grid = [];
  for(let v = 0; v <= top; v += step){
    grid.push(`<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-6}" y="${y(v)+3.5}" text-anchor="end" class="axlbl">${v>=1000?(v/1000)+'k':v}</text>`);
  }

  const bars = results.map((r,i) => {
    const cx = padL + slot*i + slot/2;
    const has = r.totals.intake > 0;
    if(!has){
      return `<rect x="${cx-bw/2}" y="${y(0)-3}" width="${bw}" height="3" rx="1.5" fill="var(--line)"/>`;
    }
    const v = Math.max(r.totals.net, 0);
    const over = r.totals.net > goal;
    const h = Math.max(y(v) < y(0) ? y(0)-y(v) : 0, 2);
    const isToday = ymd(r.date) === todayStr;
    return `<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${h}" rx="${Math.min(3,bw/2)}"
      fill="${over?'var(--rust)':'var(--sage)'}" opacity="${isToday?1:0.88}"/>
      ${isToday?`<rect x="${cx-bw/2-1.5}" y="${y(v)-1.5}" width="${bw+3}" height="${h+3}" rx="${Math.min(4,bw/2+1)}"
        fill="none" stroke="var(--ink)" stroke-width="1.2" opacity=".55"/>`:''}`;
  });

  const wd = ['M','T','O','T','F','L','S'];
  const labels = results.map((r,i) => {
    const cx = padL + slot*i + slot/2;
    let txt = null;
    if(mode === 'week') txt = wd[i];
    else { const dn = r.date.getDate(); if(dn===1 || dn%5===0) txt = dn; }
    return txt === null ? '' :
      `<text x="${cx}" y="${H-5}" text-anchor="middle" class="axlbl">${txt}</text>`;
  });

  return `<svg class="netchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Netto per dag">
    ${grid.join('')}
    <line x1="${padL}" y1="${y(goal)}" x2="${W-padR}" y2="${y(goal)}"
      stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="${W-padR}" y="${y(goal)-5}" text-anchor="end" class="goallbl">mål ${goal}</text>
    ${bars.join('')}
    ${labels.join('')}
  </svg>`;
}

/* Ackumulerad kaloribalans över perioden + kurva. */
function balanceBlock(results, goal, periodWord){
  const logged = results.filter(r => r.totals.intake > 0);
  if(!logged.length){
    return `<div class="compare"><div class="cmp-note">Logga en dag för att se kaloribalansen för ${periodWord}.</div></div>`;
  }
  // Löpande summa av (mål − netto) för loggade dagar
  let run = 0;
  const points = [];
  results.forEach((r, i) => {
    if(r.totals.intake > 0) run += (goal - r.totals.net);
    points.push({ i, run, logged: r.totals.intake > 0, date: r.date });
  });
  const total = run;
  const deficit = total > 0;
  const avgDev = Math.round(total / logged.length);
  const kg = Math.abs(total) / 7700;

  return `
    <div class="compare">
      <div class="balancehead">
        <div>
          <div class="k">Kaloribalans ${periodWord}</div>
          <div class="balanceval" style="color:${deficit?'var(--sage)':'var(--rust)'}">
            ${deficit ? '−' : '+'}${Math.abs(total).toLocaleString('sv-SE')} kcal
          </div>
        </div>
        <div style="text-align:right;">
          <div class="k">Snitt/dag</div>
          <div class="v" style="color:${deficit?'var(--sage)':'var(--rust)'}">${avgDev > 0 ? '−' : '+'}${Math.abs(avgDev)}</div>
        </div>
      </div>
      ${balanceCurve(points, logged.length)}
      <div class="cmp-note">
        ${deficit
          ? `Ett samlat underskott på ${Math.abs(total).toLocaleString('sv-SE')} kcal motsvarar ca ${kg.toFixed(2).replace('.',',')} kg fett.`
          : `Ett samlat överskott på ${Math.abs(total).toLocaleString('sv-SE')} kcal motsvarar ca ${kg.toFixed(2).replace('.',',')} kg.`}
        Räknas bara på de ${logged.length} dagar du loggat.
      </div>
    </div>`;
}

function balanceCurve(points, loggedCount){
  const W = 340, H = 96, padL = 8, padR = 8, padT = 12, padB = 12;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const vals = points.map(p => p.run);
  const hi = Math.max(...vals, 0), lo = Math.min(...vals, 0);
  const span = (hi - lo) || 1;
  const x = i => points.length > 1 ? padL + (i/(points.length-1))*plotW : padL + plotW/2;
  const y = v => padT + plotH - ((v - lo)/span)*plotH;
  const zeroY = y(0);
  const last = points[points.length-1];
  const pos = last.run >= 0;
  const col = pos ? 'var(--sage)' : 'var(--rust)';
  const line = points.map((p,i)=>`${x(i).toFixed(1)},${y(p.run).toFixed(1)}`).join(' ');
  const area = `${padL},${zeroY} ${line} ${x(points.length-1).toFixed(1)},${zeroY}`;
  const uid = 'bc' + Math.random().toString(36).slice(2,7);

  return `<svg class="balancecurve" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ackumulerad kaloribalans">
    <defs>
      <linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${pos?'var(--sage)':'var(--rust)'}" stop-opacity=".22"/>
        <stop offset="100%" stop-color="${pos?'var(--sage)':'var(--rust)'}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <polygon points="${area}" fill="url(#${uid})"/>
    <line x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}"
      stroke="var(--muted)" stroke-width="1" stroke-dasharray="3,3" opacity=".5"/>
    <text x="${padL}" y="${zeroY-4}" class="axlbl" opacity=".8">balans 0</text>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(points.length-1).toFixed(1)}" cy="${y(last.run).toFixed(1)}" r="4" fill="${col}"/>
    <circle cx="${x(points.length-1).toFixed(1)}" cy="${y(last.run).toFixed(1)}" r="7" fill="${col}" opacity=".18"/>
  </svg>`;
}

function comparisonBlock(st, actualKg, periodWord){
  if(!st.logged) return '';
  const theory = -st.predictedKg; // negativt = nedgång
  const theoryTxt = signed(theory, 2) + ' kg';
  let actualTxt = '—', note;
  if(actualKg === null){
    note = 'Logga vikt i början och slutet av ' + periodWord + ' för att kunna jämföra.';
  } else {
    actualTxt = signed(actualKg, 1) + ' kg';
    const diff = Math.abs(actualKg - theory);
    if(st.logged < st.total){
      note = 'Obs: bara ' + st.logged + ' av ' + st.total + ' dagar loggade, så underskottet är sannolikt underskattat.';
    } else if(diff < 0.4){
      note = 'Stämmer väl överens.';
    } else if(actualKg > theory){
      note = 'Vikten sjönk mindre än beräknat — vanligt vid vätskeretention, eller så är portionerna större än uppskattat.';
    } else {
      note = 'Vikten sjönk mer än beräknat — ofta vätske- eller glykogenförlust snarare än enbart fett.';
    }
  }
  return `
    <div class="compare">
      <div class="cmp-row">
        <div><div class="k">Beräknat av underskott</div><div class="v">${theoryTxt}</div></div>
        <div><div class="k">Faktisk viktförändring</div><div class="v">${actualTxt}</div></div>
      </div>
      <div class="cmp-note">${note}</div>
    </div>`;
}

/* ---- Energibehov (Mifflin-St Jeor) ---- */
function currentWeightKg(){
  const ws = state.weights.slice().sort((a,b)=>a.date.localeCompare(b.date));
  return ws.length ? ws[ws.length-1].kg : state.settings.startWeight;
}
function calcBMR(weight, height, age, sex){
  if(!weight || !height || !age) return null;
  const base = 10*weight + 6.25*height - 5*age;
  return Math.round(sex === 'kvinna' ? base - 161 : base + 5);
}
function goalSuggestion(){
  const s = state.settings;
  const w = currentWeightKg();
  const bmr = calcBMR(w, s.height, s.age, s.sex);
  if(!bmr) return null;
  const act = Number(s.activity) || 1.3;
  const tdee = Math.round(bmr * act);
  const deficit = Number(s.deficit)||0;
  const target = tdee - deficit;
  const baselineMode = act <= 1.0;  // klockan/loggad träning står för allt aktivt
  return {
    weight: w, bmr, tdee, deficit, target, act, baselineMode,
    kgPerWeek: (deficit * 7 / 7700),
    // Vid baslinjeläge är målet inte vad du äter — träning läggs på ovanpå.
    tooLow: baselineMode ? (target < 1200) : (target < 1500)
  };
}

/* Uppskattad vardagsaktivitet när klockan inte används.
   Bygger på samma faktorer som målberäkningen: aktiv del = BMR × (faktor − 1). */
const DAY_TYPES = [
  { key:'lugn',   label:'Lugn dag',    hint:'mest stillasittande',            factor:1.2  },
  { key:'vanlig', label:'Vanlig dag',  hint:'en del rörelse',                 factor:1.3  },
  { key:'rorlig', label:'Rörlig dag',  hint:'på fötter större delen av dagen',factor:1.45 },
  { key:'tung',   label:'Tung dag',    hint:'fysiskt krävande',               factor:1.6  }
];
function estimatedActivityKcal(factor){
  const bmr = calcBMR(currentWeightKg(), state.settings.height, state.settings.age, state.settings.sex);
  if(!bmr) return null;
  return Math.round(bmr * (factor - 1));
}
function inBaselineMode(){
  return Number(state.settings.activity) <= 1.0;
}

/* Statistik för en period. 7700 kcal ≈ 1 kg kroppsfett. */
function periodStats(results, goal){
  const logged = results.filter(r => r.totals.intake > 0);
  const avgNet = logged.length ? Math.round(logged.reduce((s,r)=>s+r.totals.net,0)/logged.length) : 0;
  const avgProtein = logged.length ? Math.round(logged.reduce((s,r)=>s+r.totals.protein,0)/logged.length) : 0;
  const totalBurned = results.reduce((s,r)=>s+r.totals.burned,0);
  const daysUnder = logged.filter(r => r.totals.net <= goal).length;
  // Ackumulerat underskott räknas bara på loggade dagar
  const totalDeficit = logged.reduce((s,r)=>s+(goal - r.totals.net), 0);
  const predictedKg = totalDeficit / 7700;
  return { logged: logged.length, total: results.length, avgNet, avgProtein,
           totalBurned, daysUnder, totalDeficit, predictedKg };
}
/* Faktisk viktförändring inom ett datumintervall (ISO-strängar). */
function weightChangeBetween(fromYmd, toYmd){
  const ws = state.weights
    .filter(w => w.date >= fromYmd && w.date <= toYmd)
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(ws.length < 2) return null;
  return ws[ws.length-1].kg - ws[0].kg;
}
function kgFmt(n){ return String(n).replace('.', ','); }
function signed(n, dec){
  const v = Number(n).toFixed(dec===undefined?1:dec);
  return ((Number(v) > 0 ? '+' : '') + v).replace('.', ',').replace('-', '−');
}

  document.getElementById('nextWeek').onclick = () => { state.currentDate.setDate(state.currentDate.getDate()+7); renderContent(); };
}

function weekNumber(d){
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay()+6)%7;
  target.setDate(target.getDate()-dayNr+3);
  const firstThursday = new Date(target.getFullYear(),0,4);
  const diff = target - firstThursday;
  return 1 + Math.round(diff/(7*24*60*60*1000));
}
function fmtRange(a,b){
  const mn = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  return `${a.getDate()} ${mn[a.getMonth()]} – ${b.getDate()} ${mn[b.getMonth()]}`;
}

/* ---------- MONTH VIEW ---------- */
async function renderMonth(content){
  const token = currentToken();
  content.innerHTML = `<div class="card"><div class="empty">Laddar månad…</div></div>`;
  const year = state.currentDate.getFullYear();
  const month = state.currentDate.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const results = [];
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    const data = await loadDay(ymd(d));
    results.push({ date: d, totals: dayTotals(data) });
  }
  if(isStale(token)) return;
  const goal = state.settings.dailyGoal;
  const st = periodStats(results, goal);
  const maxVal = Math.max(goal*1.3, ...results.map(r=>r.totals.net), 1);
  const mn = ['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];

  const firstYmd = ymd(new Date(year,month,1));
  const lastYmd = ymd(new Date(year,month,daysInMonth));
  const monthWeights = state.weights
    .filter(w => w.date >= firstYmd && w.date <= lastYmd)
    .sort((a,b)=>a.date.localeCompare(b.date));
  const weightChange = weightChangeBetween(firstYmd, lastYmd);

  content.innerHTML = `
    <div class="card">
      <div class="datebar">

        <div class="label">${mn[month]} ${year}</div>
        <button id="nextMonth">›</button>

      <div class="summaryrow">

        <div class="stat"><div class="k">Protein snitt</div><div class="v">${st.avgProtein} g</div></div>
        <div class="stat"><div class="k">Loggade dagar</div><div class="v">${st.logged}/${daysInMonth}</div></div>
      </div>
      <div class="summaryrow">
        <div class="stat sage"><div class="k">Dagar under mål</div><div class="v">${st.daysUnder}/${st.logged}</div></div>
        <div class="stat sage"><div class="k">Träning totalt</div><div class="v">−${st.totalBurned}</div></div>
        <div class="stat ${weightChange!==null && weightChange<0?'sage':'rust'}"><div class="k">Vikt denna månad</div><div class="v">${weightChange!==null ? signed(weightChange,1)+' kg' : '—'}</div></div>
      </div>
      ${balanceBlock(results, goal, 'denna månad')}
      ${comparisonBlock(st, weightChange, 'månaden')}
    </div>
    <div class="card">
      <div class="sectitle" style="margin:0 0 8px 2px;">Viktkurva</div>
      ${monthWeights.length >= 2
        ? `<svg class="weightgraph" viewBox="0 0 340 110">${weightSvg(monthWeights)}</svg>
           <div class="cmp-note" style="margin-top:6px;">${kgFmt(monthWeights[0].kg)} kg → ${kgFmt(monthWeights[monthWeights.length-1].kg)} kg (${monthWeights.length} mätningar)</div>`
        : `<div class="empty">Logga vikt minst två gånger under månaden för att se en kurva.</div>`}
    </div>
  `;
  document.getElementById('prevMonth').onclick = () => { state.currentDate.setMonth(state.currentDate.getMonth()-1); renderContent(); };
  document.getElementById('nextMonth').onclick = () => { state.currentDate.setMonth(state.currentDate.getMonth()+1); renderContent(); };
}

/* ---------- ÅRSVY ---------- */
const MONTH_SHORT = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];

function monthDiverging(months, maxAbs){
  const W = 340, H = 150, padL = 34, padR = 6, padB = 18, padT = 10;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const top = Math.max(maxAbs, 1);
  const step = niceStep(top);
  const lim = Math.ceil(top/step)*step;
  const mid = padT + plotH/2;
  const y = v => mid - (v/lim)*(plotH/2);
  const slot = plotW/12, bw = Math.min(18, slot*0.6);
  const thisMonth = new Date().getMonth(), thisYear = new Date().getFullYear();

  const grid = [];
  for(let v = -lim; v <= lim; v += step){
    if(v === 0) continue;
    grid.push(`<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-6}" y="${y(v)+3.5}" text-anchor="end" class="axlbl">${Math.abs(v)>=1000?(v/1000)+'k':v}</text>`);
  }

  const bars = months.map((m,i) => {
    const cx = padL + slot*i + slot/2;
    if(!m.logged) return `<rect x="${cx-bw/2}" y="${mid-1.5}" width="${bw}" height="3" rx="1.5" fill="var(--line)"/>`;
    const v = m.balance;
    const h = Math.max(Math.abs(y(v) - mid), 2);
    const isNow = m.year === thisYear && i === thisMonth;
    return `<rect x="${cx-bw/2}" y="${v>=0?y(v):mid}" width="${bw}" height="${h}" rx="3"
      fill="${v>=0?'var(--sage)':'var(--rust)'}" opacity="${isNow?1:.88}"/>
      ${isNow?`<rect x="${cx-bw/2-1.5}" y="${(v>=0?y(v):mid)-1.5}" width="${bw+3}" height="${h+3}" rx="4"
        fill="none" stroke="var(--ink)" stroke-width="1.2" opacity=".5"/>`:''}`;
  });

  const labels = months.map((m,i) => {
    const cx = padL + slot*i + slot/2;
    return `<text x="${cx}" y="${H-4}" text-anchor="middle" class="axlbl">${MONTH_SHORT[i][0].toUpperCase()}</text>`;
  });

  return `<svg class="netchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kaloribalans per månad">
    ${grid.join('')}
    <line x1="${padL}" y1="${mid}" x2="${W-padR}" y2="${mid}" stroke="var(--muted)" stroke-width="1" opacity=".45"/>
    <text x="${padL-6}" y="${mid+3.5}" text-anchor="end" class="axlbl">0</text>
    ${bars.join('')}
    ${labels.join('')}
  </svg>`;
}

function renderYear(content){
  const year = state.currentDate.getFullYear();
  const goal = state.settings.dailyGoal;

  const months = [];
  let totalBalance = 0, totalLogged = 0, netSum = 0, proteinSum = 0, maxAbs = 0;
  for(let m = 0; m < 12; m++){
    const dim = new Date(year, m+1, 0).getDate();
    let balance = 0, logged = 0, net = 0, protein = 0;
    for(let d = 1; d <= dim; d++){
      const day = state.cache[ymd(new Date(year, m, d))];
      if(!day) continue;
      const t = dayTotals(day);
      if(t.intake <= 0) continue;
      logged++; balance += goal - t.net; net += t.net; protein += t.protein;
    }
    months.push({ month:m, year, balance, logged, avgNet: logged?Math.round(net/logged):0 });
    totalBalance += balance; totalLogged += logged; netSum += net; proteinSum += protein;
    maxAbs = Math.max(maxAbs, Math.abs(balance));
  }

  const yearWeights = state.weights
    .filter(w => w.date >= year+'-01-01' && w.date <= year+'-12-31')
    .sort((a,b)=>a.date.localeCompare(b.date));
  const kgChange = yearWeights.length >= 2 ? yearWeights[yearWeights.length-1].kg - yearWeights[0].kg : null;
  const avgNet = totalLogged ? Math.round(netSum/totalLogged) : 0;
  const avgProtein = totalLogged ? Math.round(proteinSum/totalLogged) : 0;
  const deficit = totalBalance > 0;
  const kgFromBalance = Math.abs(totalBalance)/7700;
  const best = months.filter(m=>m.logged).sort((a,b)=>b.balance-a.balance)[0];

  content.innerHTML = `
    <div class="card">
      <div class="datebar">
        <button id="prevYear">‹</button>
        <div class="label">${year}<small>${totalLogged} loggade dagar</small></div>
        <button id="nextYear">›</button>
      </div>
      ${totalLogged ? `
        <div class="balancehead">
          <div>
            <div class="k">Kaloribalans ${year}</div>
            <div class="balanceval" style="color:${deficit?'var(--sage)':'var(--rust)'}">
              ${deficit?'−':'+'}${Math.abs(totalBalance).toLocaleString('sv-SE')} kcal
            </div>
          </div>
          <div style="text-align:right;">
            <div class="k">Motsvarar</div>
            <div class="v" style="color:${deficit?'var(--sage)':'var(--rust)'}">${deficit?'−':'+'}${kgFromBalance.toFixed(1).replace('.',',')} kg</div>
          </div>
        </div>
        ${monthDiverging(months, maxAbs)}
        <div class="cmp-note" style="margin-top:2px;">
          Staplar uppåt = underskott, nedåt = överskott. Varje månad räknas bara på de dagar du loggat.
        </div>
        <div class="summaryrow">
          <div class="stat"><div class="k">Snitt netto/dag</div><div class="v">${avgNet}</div></div>
          <div class="stat"><div class="k">Protein snitt</div><div class="v">${avgProtein} g</div></div>
          <div class="stat ${kgChange!==null && kgChange<0?'sage':''}"><div class="k">Vikt i år</div><div class="v">${kgChange!==null?signed(kgChange,1)+' kg':'—'}</div></div>
        </div>
        ${best && best.balance > 0 ? `<div class="cmp-note">Bästa månaden: <b>${MONTH_SHORT[best.month]}</b> med ${best.balance.toLocaleString('sv-SE')} kcal underskott på ${best.logged} loggade dagar.</div>` : ''}
      ` : `<div class="empty">Inga loggade dagar ${year} än.</div>`}
    </div>

    <div class="card">
      <div class="sectitle" style="margin:0 0 8px 2px;">Viktutveckling ${year}</div>
      ${yearWeights.length >= 2
        ? `<svg class="weightgraph" viewBox="0 0 340 110">${weightSvg(yearWeights)}</svg>
           <div class="cmp-note" style="margin-top:6px;">${kgFmt(yearWeights[0].kg)} kg → ${kgFmt(yearWeights[yearWeights.length-1].kg)} kg · ${yearWeights.length} mätningar</div>`
        : `<div class="empty">Logga vikt minst två gånger under året för att se en kurva.</div>`}
    </div>
  `;
  document.getElementById('prevYear').onclick = () => { state.currentDate.setFullYear(year-1); renderContent(); };
  document.getElementById('nextYear').onclick = () => { state.currentDate.setFullYear(year+1); renderContent(); };
}

        <div class="stat"><div class="k">Kvar till mål</div><div class="v">${kgFmt(toGoal)} kg</div></div>

function weightSvg(ws){
  const W = 340, H = 110, padL = 32, padR = 10, padT = 12, padB = 14;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const kg = ws.map(w => w.kg);
  const hi = Math.max(...kg), lo = Math.min(...kg);
  const pad = Math.max((hi - lo) * 0.25, 0.4);
  const top = hi + pad, bot = lo - pad;
  const x = i => ws.length > 1 ? padL + (i/(ws.length-1))*plotW : padL + plotW/2;
  const y = v => padT + plotH - ((v - bot)/(top - bot))*plotH;
  const line = ws.map((w,i)=>`${x(i).toFixed(1)},${y(w.kg).toFixed(1)}`).join(' ');
  const uid = 'wc' + Math.random().toString(36).slice(2,7);
  const down = ws[ws.length-1].kg <= ws[0].kg;
  const col = down ? 'var(--sage)' : 'var(--rust)';
  const fmt = v => String(Math.round(v*10)/10).replace('.', ',');
  return `<defs>
      <linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${down?'var(--sage)':'var(--rust)'}" stop-opacity=".18"/>
        <stop offset="100%" stop-color="${down?'var(--sage)':'var(--rust)'}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <text x="${padL-6}" y="${y(hi)+3.5}" text-anchor="end" class="axlbl">${fmt(hi)}</text>
    <text x="${padL-6}" y="${y(lo)+3.5}" text-anchor="end" class="axlbl">${fmt(lo)}</text>
    <line x1="${padL}" y1="${y(hi)}" x2="${W-padR}" y2="${y(hi)}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${padL}" y1="${y(lo)}" x2="${W-padR}" y2="${y(lo)}" stroke="var(--line)" stroke-width="1"/>
    <polygon points="${padL},${y(bot)} ${line} ${x(ws.length-1).toFixed(1)},${y(bot)}" fill="url(#${uid})"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round"/>
    ${ws.map((w,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(w.kg).toFixed(1)}" r="${i===ws.length-1?4:2.6}" fill="${col}"/>`).join('')}`;
}

        <button class="save" id="importData">Importera</button>
      </div>
      <div class="est-status" id="syncIOStatus" style="margin-top:8px;"></div>
    </div>
  `;
  document.getElementById('sSave').onclick = async () => {
    state.settings.dailyGoal = Number(document.getElementById('sGoal').value) || state.settings.dailyGoal;
    state.settings.startWeight = Number(document.getElementById('sStart').value) || state.settings.startWeight;
    state.settings.targetWeight = Number(document.getElementById('sTarget').value) || state.settings.targetWeight;
    const hv = document.getElementById('cHeight'); if(hv) state.settings.height = Number(hv.value)||null;
    const av = document.getElementById('cAge'); if(av) state.settings.age = Number(av.value)||null;
    await ghSaveBundle();
    renderContent();
  };

  const wireCalc = () => {
    content.querySelectorAll('.sex-btn').forEach(b => {
      b.onclick = async () => {
        state.settings.sex = b.dataset.sex;
        await ghSaveBundle();
        renderContent();
      };
    });
    const applyBtn = document.getElementById('applyGoal');
    if(applyBtn) applyBtn.onclick = async () => {
      const r = goalSuggestion();
      if(!r) return;
      state.settings.dailyGoal = r.target;
      await ghSaveBundle();
      renderContent();
    };
  };
  const refreshCalc = () => {
    const el = document.getElementById('calcResult');
    if(el) el.innerHTML = calcResultHTML();
    wireCalc();
  };
  const onCalcInput = (key, val) => { state.settings[key] = val; refreshCalc(); };
  const hEl = document.getElementById('cHeight');
  if(hEl) hEl.oninput = () => onCalcInput('height', Number(hEl.value)||null);
  const aEl = document.getElementById('cAge');
  if(aEl) aEl.oninput = () => onCalcInput('age', Number(aEl.value)||null);
  const actEl = document.getElementById('cActivity');
  if(actEl) actEl.onchange = () => onCalcInput('activity', Number(actEl.value));
  const defEl = document.getElementById('cDeficit');
  if(defEl) defEl.onchange = () => onCalcInput('deficit', Number(defEl.value));
  refreshCalc();

  content.querySelectorAll('.delpantry').forEach(btn => {
    btn.onclick = async () => {
      state.pantry.splice(Number(btn.dataset.idx), 1);
      await ghSaveBundle();
      renderContent();
    };
  });

  const ghStatus = document.getElementById('ghStatus');
  document.getElementById('ghSave').onclick = async () => {
    state.gh.owner = document.getElementById('ghOwner').value.trim();
    state.gh.repo = document.getElementById('ghRepo').value.trim();
    state.gh.token = document.getElementById('ghToken').value.trim();
    state.gh.branch = document.getElementById('ghBranch').value.trim() || 'main';
    saveGhConfig();
    ghStatus.textContent = 'Ansluter…';
    const bundle = await ghLoadBundle();
    if(bundle){
      if(bundle.settings) state.settings = bundle.settings;
      if(bundle.weights) state.weights = bundle.weights;
      if(bundle.favorites) state.favorites = bundle.favorites;
      if(bundle.pantry) state.pantry = bundle.pantry;
      if(bundle.days) state.cache = bundle.days;
      ghStatus.innerHTML = '<span style="color:var(--sage)">✓ Anslutet och data hämtad.</span>';
    } else if(ghConfigured()){
      ghStatus.innerHTML = '<span style="color:var(--sage)">✓ Anslutet (ingen data i repo ännu — sparas vid första loggning).</span>';
    } else {
      ghStatus.innerHTML = '<span style="color:var(--rust)">Fyll i alla fält.</span>';
    }
    renderContent();
  };

  const aiKeyStatus = document.getElementById('aiKeyStatus');
  document.getElementById('aiKeySave').onclick = () => {
    saveAiKey(document.getElementById('aiKeyInput').value.trim());
    aiKeyStatus.innerHTML = '<span style="color:var(--sage)">✓ Sparad.</span>';
  };

  const ioStatus = document.getElementById('syncIOStatus');

  document.getElementById('exportData').onclick = async () => {
    try{
      const bundle = {
        exportedAt: new Date().toISOString(),
        settings: state.settings,
        weights: state.weights,
        favorites: state.favorites,
        pantry: state.pantry,
        days: state.cache
      };
      const json = JSON.stringify(bundle);
      document.getElementById('syncData').value = json;
      try{
        await navigator.clipboard.writeText(json);
        ioStatus.innerHTML = '<span style="color:var(--sage)">✓ Kopierat till urklipp.</span>';
      }catch(clipErr){
        ioStatus.innerHTML = '<span style="color:var(--sage)">✓ Klart. Markera texten ovan manuellt och kopiera.</span>';
      }
    }catch(e){
      console.error('Export failed', e);
      ioStatus.innerHTML = `<span style="color:var(--rust)">Kunde inte exportera: ${(e.message||'').slice(0,100)}</span>`;
    }
  };

  document.getElementById('importData').onclick = async () => {
    const raw = document.getElementById('syncData').value.trim();
    if(!raw){ ioStatus.textContent = 'Klistra in exporterad data först.'; return; }
    ioStatus.textContent = 'Importerar…';
    try{
      const bundle = JSON.parse(raw);
      if(bundle.settings) state.settings = bundle.settings;
      if(bundle.weights) state.weights = bundle.weights;
      if(bundle.favorites) state.favorites = bundle.favorites;
      if(bundle.pantry) state.pantry = bundle.pantry;
      if(bundle.days) state.cache = bundle.days;
      await ghSaveBundle();
      ioStatus.innerHTML = '<span style="color:var(--sage)">✓ Importerat och sparat till GitHub!</span>';
      renderContent();
    }catch(e){
      console.error('Import failed', e);
      ioStatus.innerHTML = `<span style="color:var(--rust)">Kunde inte importera: ${(e.message||'').slice(0,100)}.</span>`;
    }
  };
}

/* ---------- INIT ---------- */
async function init(){
  loadGhConfig();
  loadAiKey();
  if(ghConfigured()){
    const bundle = await ghLoadBundle();
    if(bundle){
      if(bundle.settings) state.settings = bundle.settings;
      if(bundle.weights) state.weights = bundle.weights;
      if(bundle.favorites) state.favorites = bundle.favorites;
      if(bundle.pantry) state.pantry = bundle.pantry;
      if(bundle.days) state.cache = bundle.days;
    }
  }
  render();
}
init();
</script>
</body>
</html>
