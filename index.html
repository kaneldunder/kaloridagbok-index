<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kaloridagbok</title>
<meta name="theme-color" content="#1F3A2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --paper:#1F3A2E;
    --card:#25453A;
    --field:#2C4E41;
    --ink:#F3EBDD;
    --muted:#A9BFB0;
    --line:#3B5D4F;
    --sage:#8FC9A3;
    --sage-light:#2E5244;
    --rust:#E58462;
    --rust-light:#4E3329;
    --gold:#E9B44C;
    --gold-ink:#F2CD7E;
    --gold-light:#4A4127;
    --on-accent:#17302A;
    --plate:#F3EBDD;
    --plate-ink:#1F3A2E;
    --z-goal:#2F5D47;
    --z-train:#7FA88A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'DM Sans',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .display{font-family:'Fraunces',Georgia,serif;}
  .app{max-width:520px;margin:0 auto;padding:20px 16px 0;}
  @media(min-width:820px){ .app{max-width:700px;} }

  header.top{padding:0 2px 14px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  header.top .apptitle{
    font-size:26px; margin:0 0 3px; font-weight:600;
    letter-spacing:-.01em; color:var(--sage); text-align:left;
  }
  .hdr-left{min-width:0;}
  .hdr-datenav{display:flex; align-items:center; gap:2px; margin-left:-6px;}
  .hdr-date{font-size:14px; color:var(--muted);}
  .daynav{
    border:none; background:transparent; color:var(--muted); font-size:18px;
    cursor:pointer; padding:0 6px; line-height:1; border-radius:6px;
  }
  .daynav:hover{background:var(--line); color:var(--ink);}
  .hdr-actions{display:flex; gap:4px; flex-shrink:0;}
  .iconbtn{
    border:none; background:transparent; color:var(--muted);
    width:34px; height:34px; border-radius:10px; font-size:17px; cursor:pointer;
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:hover{background:var(--line);}
  .iconbtn.on{background:var(--sage); color:var(--on-accent);}
  .iconbtn:disabled{opacity:.5;}
  .syncbar{font-size:11.5px; padding:0 4px 12px; min-height:14px;}

  nav.tabs{
    display:flex; gap:4px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:4px; margin-bottom:18px;
  }
  nav.tabs button{
    flex:1; border:none; background:transparent; padding:9px 4px;
    font-family:inherit; font-size:13px; font-weight:600;
    color:var(--muted); border-radius:10px; cursor:pointer;
  }
  nav.tabs button.active{background:var(--sage); color:var(--on-accent);}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:14px;
  }

  /* Day view */
  .datebar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .datebar button{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:var(--field); font-size:16px; cursor:pointer; color:var(--ink);
  }
  .datebar .label{font-weight:600; font-size:15px; text-align:center;}
  .datebar .label small{display:block; font-weight:400; color:var(--muted); font-size:11.5px; margin-top:1px;}

  .ring-wrap{display:flex; align-items:center; gap:18px;}
  .ring{position:relative; width:112px; height:112px; flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring .center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .ring .center .num{font-size:22px; font-weight:600;}
  .ring .center .unit{font-size:10px; color:var(--muted); letter-spacing:.05em;}

  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; flex:1;}
  .stat{background:var(--paper); border-radius:10px; padding:8px 10px;}
  .stat .k{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .stat .v{font-size:16px; font-weight:600; margin-top:2px;}
  .stat.rust .v{color:var(--rust);}
  .stat.sage .v{color:var(--sage);}

  .qparts{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:9px 11px; margin:8px 0 4px;
  }
  .qpartshead{
    display:flex; align-items:center; justify-content:space-between;
    font-size:10px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); margin-bottom:7px;
  }
  .qpclear{
    border:none; background:transparent; color:var(--muted); font-size:11px;
    cursor:pointer; font-family:inherit; text-transform:none; letter-spacing:0; padding:0;
  }
  .qpclear:hover{color:var(--rust);}
  .qprow{display:flex; align-items:center; gap:7px; margin-bottom:5px;}
  .qpsrc{
    width:15px; height:15px; border-radius:5px; flex-shrink:0; font-size:9.5px;
    font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .qpsrc.lib{background:var(--sage-light); color:var(--sage);}
  .qpsrc.ai{background:var(--gold-light); color:var(--gold-ink);}
  .qpname{flex:1 1 auto; min-width:0; font-size:13px; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .qparts .qpamt{
    flex:0 0 62px; width:62px; min-width:0; box-sizing:border-box;
    border:1px solid var(--line); border-radius:7px; padding:5px 7px;
    font-size:13px; font-family:inherit; text-align:right; background:var(--field);
  }
  .qpgps{font-size:10.5px; color:var(--muted); font-weight:400;}
  .qpunit{font-size:11px; color:var(--muted); width:14px;}
  .qpkcal{font-size:12.5px; font-weight:600; color:var(--ink); width:46px; text-align:right;}
  .qptot{
    border-top:1px solid var(--line); margin-top:7px; padding-top:6px;
    font-size:12.5px; color:var(--muted); text-align:right;
  }
  .qptot b{color:var(--ink); font-size:14px;}
  .qpnote{font-size:11px; color:var(--muted); margin-top:5px; line-height:1.45;}

  .splitbtn{
    width:100%; border:1px dashed var(--line); background:var(--paper); color:var(--muted);
    border-radius:9px; padding:9px; font-size:12.5px; font-weight:600;
    cursor:pointer; font-family:inherit; margin-bottom:9px;
  }
  .splitbtn:hover{border-color:var(--sage); color:var(--sage);}
  .splitbtn:disabled{opacity:.6;}

  .scalerow{display:flex; align-items:center; gap:5px; margin-bottom:9px; flex-wrap:wrap;}
  .scalelbl{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-right:3px;}
  .scalebtn{
    border:1px solid var(--line); background:var(--field); color:var(--ink); border-radius:8px;
    padding:6px 11px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .scalebtn:hover{border-color:var(--sage);}
  .scalebtn.active{background:var(--sage); color:var(--on-accent); border-color:var(--sage);}
  .scalebtn.plus{border-color:var(--gold); color:var(--gold-ink);}

  .compedit{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:9px 11px; margin-bottom:9px;
  }
  .complbl{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px;}
  .comprow{display:flex; align-items:center; gap:7px; margin-bottom:5px;}
  .compname{flex:1 1 auto; min-width:0; font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .compedit .compamt{
    flex:0 0 66px; width:66px; min-width:0; box-sizing:border-box;
    border:1px solid var(--line); border-radius:7px; padding:5px 7px;
    font-size:13.5px; font-family:inherit; text-align:right; background:var(--field);
  }
  .compunit{font-size:11.5px; color:var(--muted); width:16px;}
  .compkcal{font-size:11.5px; color:var(--muted); width:62px; text-align:right;}
  .comptot{
    border-top:1px solid var(--line); margin-top:7px; padding-top:6px;
    font-size:12.5px; color:var(--muted); text-align:right;
  }
  .comptot b{color:var(--ink); font-size:14px;}

  .linkbtn{
    border:none; background:transparent; color:var(--muted); font-size:12.5px;
    cursor:pointer; font-family:inherit; padding:8px 2px 0; display:block;
  }
  .linkbtn:hover{color:var(--sage);}

  .sechead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:20px 0 9px;}
  .secactions{display:flex; gap:7px;}
  .secbtn{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .secbtn:hover{border-color:var(--sage);}
  .secbtn.primary{background:var(--sage); color:var(--on-accent); border-color:var(--sage);}

  .eicon{
    width:38px; height:38px; border-radius:11px; display:flex; align-items:center;
    justify-content:center; font-size:17px; flex-shrink:0;
  }
  .ename{font-size:15px; font-weight:600; color:var(--ink); line-height:1.3;}
  .esub{font-size:12.5px; color:var(--muted); margin-top:2px; display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
  .esub .etime{
    border:none; background:transparent; color:var(--muted); font-family:inherit;
    font-size:12.5px; padding:0; cursor:pointer; text-decoration:underline; text-decoration-color:var(--line);
  }
  .esub .etime:hover{color:var(--ink);}
  .entry .kcal{font-size:16px; font-weight:600;}

  .herostatus{flex:1; min-width:0;}
  .hs-label{
    font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.09em; margin-bottom:5px;
  }
  .hs-line{font-size:16.5px; font-weight:600; color:var(--ink); margin-bottom:11px; line-height:1.25;}
  .pbar{height:7px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:5px;}
  .pbar i{display:block; height:100%; border-radius:4px; transition:width .3s ease;}
  .pbar-lbl{font-size:12.5px; color:var(--muted);}

  .heroin{margin-top:14px; padding-top:13px; border-top:1px solid var(--line);}
  .hirow{display:flex; align-items:center; gap:11px;}
  .hirow + .hirow{margin-top:11px;}
  .hicon{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center;
    justify-content:center; font-size:16px; flex-shrink:0;
  }
  .hicon.gold{background:var(--gold-light);}
  .hicon.sage{background:var(--sage-light);}
  .hitext{flex:1; min-width:0;}
  .hiname{font-size:13.5px; font-weight:600; color:var(--ink);}
  .hidelta{font-weight:500; font-size:12px;}
  .hisub{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .hinput{
    width:82px; text-align:right; border:1px solid var(--line); border-radius:9px;
    padding:9px 10px; font-size:16px; font-weight:600; font-family:inherit;
    background:var(--paper);
  }
  .hinput.gold{color:var(--gold-ink);}
  .hinput.sage{color:var(--sage);}
  .hinput:focus{outline:none; border-color:var(--sage);}

  .macrosplit{margin-top:16px;}
  .msbar{
    display:flex; height:26px; border-radius:8px; overflow:hidden;
    background:var(--line); margin-bottom:10px;
  }
  .msbar.empty{opacity:.5;}
  .msseg{
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:700; color:var(--on-accent); letter-spacing:.01em;
    transition:width .25s ease;
  }
  .mslegend{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .msitem{display:flex; align-items:flex-start; gap:6px; min-width:0;}
  .msdot{width:9px; height:9px; border-radius:3px; flex-shrink:0; margin-top:3px;}
  .mstext{min-width:0;}
  .mstext b{font-size:12px; font-weight:600; display:block; line-height:1.25;}
  .mstext .mspct{font-size:11px; color:var(--muted);}
  .mstext em{
    display:block; font-style:normal; font-size:10.5px; color:var(--muted); margin-top:1px;
  }
  .mstext em.good{color:var(--sage);}
  .mstext em.bad{color:var(--rust);}
  .msempty{font-size:12px; color:var(--muted);}
  .sectitle{
    font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
    font-weight:700; margin:18px 0 8px 2px;
  }
  .entry{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:11px 12px; margin-bottom:8px;
  }
  .entry .name{font-size:14px; font-weight:600;}
  .entry .sub{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .entry .right{display:flex; align-items:center; gap:10px;}
  .entry .kcal{font-size:14px; font-weight:600;}
  .entry.exercise .kcal{color:var(--sage);}
  .entry .del{
    border:none; background:none; color:var(--muted); font-size:16px; cursor:pointer;
    width:24px; height:24px; line-height:1;
  }
  .entry .addfav{color:var(--sage); font-size:19px; font-weight:700;}
  .etime{
    display:inline-block; font-size:11px; font-weight:600; color:var(--muted);
    background:var(--paper); border-radius:5px; padding:1px 5px; margin-right:6px;
    vertical-align:1px;
  }
  .qtypick{display:flex; align-items:center; gap:2px; background:var(--paper); border-radius:14px; padding:2px;}
  .qtybtn{
    border:none; background:var(--field); color:var(--ink); width:22px; height:22px;
    border-radius:50%; font-size:14px; line-height:1; cursor:pointer; font-family:inherit;
  }
  .qtyval{font-size:12px; font-weight:600; min-width:22px; text-align:center;}
  .entry.confirmdel{border-color:var(--rust); background:var(--rust-light);}
  .confirmbtn{
    border:none; border-radius:7px; padding:6px 10px; font-size:11.5px;
    font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .confirmbtn.no{background:var(--field); color:var(--muted);}
  .confirmbtn.yes{background:var(--rust); color:var(--on-accent);}
  .confirmbtn.save{background:var(--ink); color:var(--on-accent);}
  .entry.sel-active{background:var(--sage-light); border-color:var(--sage);}
  .selbtn{
    border:none; background:transparent; cursor:pointer; padding:0 8px 0 0;
    flex-shrink:0; display:flex; align-items:center;
  }
  .bulkbar{
    background:var(--sage); color:var(--on-accent); border-radius:12px;
    padding:10px 12px; margin-bottom:10px;
    display:flex; flex-direction:column; gap:8px;
  }
  .bulkbar .bulkcount{font-size:12px; font-weight:600; opacity:.85;}
  .bulkcancel{
    border:none; background:rgba(255,255,255,.2); color:var(--on-accent); border-radius:7px;
    padding:5px 10px; font-size:11.5px; font-weight:600; cursor:pointer;
    font-family:inherit; align-self:flex-start;
  }
  .bulktypes{display:flex; gap:5px; flex-wrap:wrap;}
  .bulktype{
    border:1.5px solid rgba(255,255,255,.5); background:transparent; color:var(--on-accent);
    border-radius:14px; padding:6px 11px; font-size:12px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .bulktype:hover{background:rgba(255,255,255,.2);}
  .selstart{
    border:none; background:transparent; color:var(--line); font-size:15px;
    cursor:pointer; padding:2px 4px; border-radius:5px; opacity:0;
    transition:opacity .15s;
  }
  @media(hover:hover){
    .entry:hover .selstart{ opacity:1; color:var(--muted); }
  }
  /* Always visible on touch devices since there's no hover */
  @media(hover:none){
    .selstart{ display:none; }
  }
  .editentry{
    border:none; background:transparent; color:var(--muted); font-size:14px;
    cursor:pointer; padding:2px 4px; border-radius:5px;
  }
  .editentry:hover{background:var(--line);}
  .entry.editrow{align-items:flex-start; flex-direction:column; gap:8px; flex-wrap:wrap;}
  .eefield{
    width:100%; border:1px solid var(--line); border-radius:8px;
    padding:8px 9px; font-size:14px; font-family:inherit; background:var(--field); color:var(--ink);
  }
  button.etime{border:1px solid transparent; cursor:pointer; font-family:inherit;}
  button.etime:hover{border-color:var(--line);}
  button.etime.notime{color:var(--line);}
  .entry.timeedit{border-color:var(--ink); align-items:flex-end;}
  .whenrow{display:flex; gap:6px; flex-wrap:wrap;}
  .entry.timeedit input[type="date"],
  .entry.timeedit input[type="time"]{
    border:1px solid var(--line); border-radius:8px; padding:7px 9px;
    font-size:15px; font-family:inherit; background:var(--field); color:var(--ink);
  }
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:18px 0;}

  .addbtn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; padding:11px; border-radius:12px; border:1.5px dashed var(--line);
    background:transparent; color:var(--muted); font-size:13px; font-weight:600;
    cursor:pointer; margin-bottom:8px;
  }
  .addbtn.food{color:var(--rust); border-color:var(--rust-light);}
  .addbtn.exercise{color:var(--sage); border-color:var(--sage-light);}

  .form{background:var(--paper); border-radius:12px; padding:12px; margin-bottom:10px;}
  .form .row{display:flex; gap:8px; margin-bottom:8px;}
  .form input{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 10px;
    font-size:14px; font-family:inherit; background:var(--field);
  }
  .form .row input{flex:1;}
  .form .actions{display:flex; gap:8px;}
  .form .actions button{
    flex:1; border:none; border-radius:9px; padding:10px; font-weight:600;
    font-size:13.5px; cursor:pointer;
  }
  .form .save{background:var(--ink); color:var(--on-accent);}
  .form .cancel{background:var(--line); color:var(--ink);}

  .modeswitch{display:flex; gap:6px; margin-bottom:10px;}
  .modeswitch button{
    flex:1; border:1px solid var(--line); background:var(--field); border-radius:8px;
    padding:7px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .modeswitch button.active{background:var(--ink); color:var(--on-accent); border-color:var(--ink);}
  .editbanner{
    background:var(--gold-light); border:1px solid var(--gold); color:var(--gold-ink);
    border-radius:9px; padding:8px 10px; font-size:12.5px; margin-bottom:10px;
  }
  .sliderval{text-align:center; margin-bottom:6px;}
  .sliderval b{font-size:32px; font-weight:600; color:var(--sage); display:block; line-height:1.1;}
  .sliderval span{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  #activitySlider{
    -webkit-appearance:none; appearance:none; width:100%; height:8px;
    border-radius:4px; background:var(--line); outline:none; margin:8px 0 2px;
  }
  #activitySlider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%;
    background:var(--field); border:2px solid var(--sage); cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  #activitySlider::-moz-range-thumb{
    width:26px; height:26px; border-radius:50%; background:var(--field);
    border:2px solid var(--sage); cursor:pointer;
  }
  .sliderends{display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); margin-bottom:12px;}
  .presets{display:flex; gap:5px; margin-bottom:12px; flex-wrap:wrap;}
  .presets .preset{
    flex:1 1 auto; border:1px solid var(--line); background:var(--field); border-radius:20px;
    padding:7px 10px; font-size:11.5px; font-weight:600; color:var(--muted);
    cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .budget{background:var(--field); border:1px solid var(--line); border-radius:11px; padding:11px 12px;}
  .budgetrow{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; padding:3px 0; color:var(--muted);}
  .budgetrow b{color:var(--ink); font-weight:600;}
  .budgetrow.total{border-top:1px solid var(--line); margin-top:5px; padding-top:8px; color:var(--ink); font-weight:600;}
  .budgetrow.total b{font-size:19px;}

  .ingcard{background:var(--field); border:1px solid var(--line); border-radius:11px; padding:10px; margin-bottom:8px;}
  .ingcard .toprow{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .ingcard .toprow input{flex:1;}
  .ingcard .rmv{

function loadAiKey(){
  try{ state.aiKey = localStorage.getItem('kaloridagbok-ai-key') || ''; }
  catch(e){ console.error('Could not read AI key', e); }
}
function saveAiKey(key){
  try{ localStorage.setItem('kaloridagbok-ai-key', key); state.aiKey = key; }
  catch(e){ console.error('Could not save AI key', e); }
}

function loadGhConfig(){
  try{
    const raw = localStorage.getItem('kaloridagbok-gh-config');
    if(raw) state.gh = { ...state.gh, ...JSON.parse(raw) };
  }catch(e){ console.error('Could not read GitHub config', e); }
}
function saveGhConfig(){
  try{
    const { owner, repo, token, path, branch } = state.gh;
    localStorage.setItem('kaloridagbok-gh-config', JSON.stringify({ owner, repo, token, path, branch }));
  }catch(e){ console.error('Could not save GitHub config', e); }
}
function ghConfigured(){
  return !!(state.gh.owner && state.gh.repo && state.gh.token);
}

   unit 'st' -> värdena är per 1 styck, mängd i antal */
function ingredientFactor(row){
  const amt = Number(row.amount)||0;
  return row.unit === 'st' ? amt : amt/100;
}
function computeMealTotals(){
  return state.mealBuilder.reduce((acc, row) => {
    const factor = ingredientFactor(row);
    acc.kcal += factor * (Number(row.kcalPer100)||0);
    acc.protein += factor * (Number(row.proteinPer100)||0);
    acc.fat += factor * (Number(row.fatPer100)||0);
    acc.carbs += factor * (Number(row.carbsPer100)||0);
    return acc;
  }, { kcal:0, protein:0, fat:0, carbs:0 });
}
function ingredientSubKcal(row){
  return Math.round(ingredientFactor(row) * (Number(row.kcalPer100)||0));
}
function unitLabel(row){
  return row.unit === 'st' ? '/ st' : '/ 100g';
}

/* ---- Livsmedelsbibliotek ---- */
function normName(s){ return (s||'').trim().toLowerCase(); }
/* Ord som aldrig ska styra en biblioteksträff på egen hand. */
const LOOKUP_STOPWORDS = new Set([
  'med','och','samt','en','ett','lite','till','av','på','i','plus','extra','ca','cirka'
]);
function nameWords(s){
  return normName(s).split(/[^a-zA-ZåäöÅÄÖ0-9]+/).filter(Boolean);
}
/* Sant bara när alla sökord finns som HELA ord i rad i namnet.
   "ost" matchar alltså inte "majskakor med ostsmak". */
function wordRunMatch(haystack, needle){
  const H = nameWords(haystack), N = nameWords(needle);
  if(!N.length || N.length > H.length) return false;
  for(let i = 0; i <= H.length - N.length; i++){
    let ok = true;
    for(let j = 0; j < N.length; j++){ if(H[i+j] !== N[j]){ ok = false; break; } }
    if(ok) return true;
  }
  return false;
}
/* Ett ensamt kort ord duger inte som sökterm — för lätt att träffa fel. */
function usableLookupTerm(name){
  const w = nameWords(name).filter(x => !LOOKUP_STOPWORDS.has(x) && !/^\d+$/.test(x));
  if(!w.length) return null;
  if(w.length === 1 && w[0].length < 4) return null;
  return w.join(' ');
}
function findInPantry(name, unit){
  const n = normName(name);
  if(!n) return null;
  const byUnit = (p) => !unit || p.unit === unit;
  // 1. Exakt match — alltid tillåten, även för korta namn som "ris"
  const exact = state.pantry.find(p => normName(p.name) === n && byUnit(p));
  if(exact) return exact;
  const exactAny = state.pantry.find(p => normName(p.name) === n);
  if(exactAny) return exactAny;

  // Därefter krävs en sökterm som duger
  const term = usableLookupTerm(n);
  if(!term) return null;

  // 2. Söktermen finns som hela ord i biblioteksnamnet
  //    ("grekisk yoghurt" → "Arla Grekisk Yoghurt")
  const contains = state.pantry.find(p => wordRunMatch(p.name, term) && byUnit(p))
                || state.pantry.find(p => wordRunMatch(p.name, term));
  if(contains) return contains;

  // 3. Biblioteksnamnet finns som hela ord i söktermen
  //    ("200 g Arla Grekisk Yoghurt" → "Arla Grekisk Yoghurt")
  const contained = state.pantry.find(p =>
    nameWords(p.name).length >= 2 && wordRunMatch(term, p.name) && byUnit(p))
    || state.pantry.find(p => nameWords(p.name).length >= 2 && wordRunMatch(term, p.name));
  return contained || null;
}
function pantryHasExact(row){
  const p = findInPantry(row.name, row.unit);
  return !!(p && p.unit === row.unit
    && Number(p.kcalPer100) === Number(row.kcalPer100)
    && Number(p.proteinPer100) === Number(row.proteinPer100)
    && Number(p.fatPer100) === Number(row.fatPer100)
    && Number(p.carbsPer100) === Number(row.carbsPer100));
}
async function savePantryItem(row){
  const item = {
    name: row.name.trim(), unit: row.unit || 'g',
    kcalPer100: Number(row.kcalPer100)||0,
    proteinPer100: Number(row.proteinPer100)||0,
    fatPer100: Number(row.fatPer100)||0,
    carbsPer100: Number(row.carbsPer100)||0,
    portion: Number(row.amount) || (row.unit === 'st' ? 1 : 100),
    lastUsed: Date.now()
  };
  state.pantry = state.pantry.filter(p => !(normName(p.name) === normName(item.name) && p.unit === item.unit));
  state.pantry.push(item);
  state.pantry.sort((a,b) => a.name.localeCompare(b.name, 'sv'));
  await ghSaveBundle();
}
/* Sorterad lista: senast använda först, sedan alfabetiskt. */
/* Läser ut mängd ur fritext: "40 g gurka", "2 ägg", "1,5 dl grädde".
   Returnerar null om ingen mängd hittas. */
function parseAmountFromName(text){
  const t = (text || '').trim();
  if(!t) return null;
  const m = t.match(/^(\d+(?:[.,]\d+)?)\s*(kg|hg|gram|gr|g|st|stycken|styck|dl|cl|ml|l|msk|tsk|kkp|kopp|skiva|skivor|näve|nävar)?\b\s*(.*)$/i);
  if(!m) return null;
  const num = parseFloat(m[1].replace(',', '.'));
  if(!isFinite(num) || num <= 0) return null;
  const unitWord = (m[2] || '').toLowerCase();
  let rest = (m[3] || '').trim();
  // Ta bort inledande "av"/"med"
  rest = rest.replace(/^(av|med)\s+/i, '');
  const gramFactors = { kg:1000, hg:100, gram:1, gr:1, g:1 };
  const volFactors  = { dl:100, cl:10, ml:1, l:1000, msk:15, tsk:5, kkp:240, kopp:240 };
  if(unitWord in gramFactors)
    return { amount: Math.round(num * gramFactors[unitWord]), unit:'g', name: rest || t, exact:true };
  if(unitWord in volFactors)
    return { amount: Math.round(num * volFactors[unitWord]), unit:'g', name: rest || t, exact:false };
  if(['st','stycken','styck','skiva','skivor','näve','nävar'].includes(unitWord))
    return { amount: num, unit:'st', name: rest || t, exact:true };
  // Enbart siffra + livsmedel, t.ex. "2 ägg"
  if(!unitWord && rest) return { amount: num, unit:'st', name: rest, exact:true };
  return null;
}

/* Som parseAmountFromName men klarar även efterställd mängd: "Grekisk yoghurt 125 g". */
function parseQuantityAnywhere(text){
  const t = (text||'').trim();
  if(!t) return null;
  const lead = parseAmountFromName(t);
  if(lead) return lead;
  const m = t.match(/^(.*?)[\s,]*(\d+(?:[.,]\d+)?)\s*(kg|hg|gram|gr|g|st|stycken|styck|dl|cl|ml|l|msk|tsk)\.?$/i);
  if(!m) return null;
  const name = m[1].trim();
  if(!name) return null;
  const flipped = m[2] + ' ' + m[3] + ' ' + name;
  const parsed = parseAmountFromName(flipped);
  return parsed ? { ...parsed, name } : null;
}

/* Slår upp fritext mot biblioteket. Kräver att ALLA delar hittas.
   Om en del är okänd returneras null och AI tar hela texten. */
/* Partiell uppslag: kända delar från biblioteket + mängd för okända.
   Returnerar { known, unknownText } eller null om ingenting hittas. */
/* Gör om en textbit till { entry, amount, unit } om den finns i biblioteket. */
/* Mängd- och enhetsord som inte säger något om vilket livsmedel det är. */
const FILLER_WORDS = new Set([
  'g','gram','gr','kg','hg','st','styck','stycken','dl','cl','ml','l',
  'msk','tsk','skiva','skivor','liten','litet','stor','stort','rund','runt'
]);
function contentWords(s){
  return nameWords(s).filter(w =>
    !LOOKUP_STOPWORDS.has(w) && !FILLER_WORDS.has(w) && !/^\d+$/.test(w));
}
/* Sant när biblioteksvaran förklarar varje betydelsebärande ord i texten. */
function entryCoversText(text, entry){
  const have = new Set(contentWords(entry.name));
  return contentWords(text).every(w => have.has(w));
}

function lookupPart(part){
  const q = parseQuantityAnywhere(part);
  const entry = findInPantry(q ? q.name : part) || findInPantry(part);
  if(!entry) return null;
  const unit = entry.unit;
  const amount = (q && ((q.unit === 'st') === (unit === 'st')))
    ? q.amount
    : (Number(entry.portion) || (unit === 'st' ? 1 : 100));
  return { entry, amount, unit };
}

function pantryPartialLookup(text){
  const raw = (text||'').trim();
  if(!raw) return null;
  const known=[], unknown=[];

  // Hela texten kan vara ett enda livsmedel vars NAMN innehåller "med"
  // ("majskakor med ostsmak 30 g") — pröva den odelad först, men bara om
  // varan täcker HELA texten. Annars skulle "riven ost och 2 frallor"
  // svälja frallorna.
  const whole = lookupPart(raw);
  if(whole && entryCoversText(raw, whole.entry)){
    known.push(whole);
  } else {
    const parts = raw.split(/\s*(?:,|\boch\b|\bmed\b|\+|&)\s*/i).map(x=>x.trim()).filter(Boolean);
    if(!parts.length) return null;
    for(const part of parts){
      const hit = lookupPart(part);
      if(hit){
        // Samma vara två gånger betyder nästan alltid att delningen skar
        // mitt i ett produktnamn — räkna den bara en gång.
        if(known.some(k => k.entry === hit.entry)) continue;
        known.push(hit);
      } else {
        unknown.push(part);
      }
    }
  }
  if(!known.length) return null;
  const tot = known.reduce((a,it)=>{
    const f = it.unit==='st' ? it.amount : it.amount/100;
    a.kcal += f*(Number(it.entry.kcalPer100)||0);
    a.protein += f*(Number(it.entry.proteinPer100)||0);
    a.fat += f*(Number(it.entry.fatPer100)||0);
    a.carbs += f*(Number(it.entry.carbsPer100)||0);
    return a;
  },{kcal:0,protein:0,fat:0,carbs:0});
  return { known, unknown, totals:tot };
}

function pantryLookupFromText(text){
  const parts = (text||'').split(/\s*(?:,|\boch\b|\bmed\b|\+|&)\s*/i).map(x=>x.trim()).filter(Boolean);
  if(!parts.length) return null;
  const items = [];
  for(const part of parts){
    const q = parseQuantityAnywhere(part);
    const nameGuess = q ? q.name : part;
    const entry = findInPantry(nameGuess) || findInPantry(part);
    if(!entry) return null;   // okänd del → låt AI:n ta hela texten
    const unit = entry.unit;
    let amount;
    if(q && ((q.unit === 'st') === (unit === 'st'))) amount = q.amount;
    else amount = Number(entry.portion) || (unit === 'st' ? 1 : 100);
    items.push({ entry, amount, unit });
  }
  // Kräv att minst en del hittades och att de kända delarna är meningsfulla
  if(!items.length) return null;
  const tot = items.reduce((a,it) => {
    const f = it.unit === 'st' ? it.amount : it.amount/100;
    a.kcal += f * (Number(it.entry.kcalPer100)||0);
    a.protein += f * (Number(it.entry.proteinPer100)||0);
    a.fat += f * (Number(it.entry.fatPer100)||0);
    a.carbs += f * (Number(it.entry.carbsPer100)||0);
    return a;
  }, {kcal:0,protein:0,fat:0,carbs:0});
  return { items, totals: tot };
}

function pantrySorted(query){
  const q = normName(query || '');
  return state.pantry
    .filter(p => !q || normName(p.name).includes(q))
    .sort((a,b) => (b.lastUsed||0) - (a.lastUsed||0) || a.name.localeCompare(b.name,'sv'));
}
function pantryPortionKcal(p){
  const amt = Number(p.portion) || (p.unit==='st' ? 1 : 100);
  return Math.round((p.unit==='st' ? amt : amt/100) * (Number(p.kcalPer100)||0));
}

/* "Måndag 8 september" — versal begynnelsebokstav. */
/* "Idag" / "Igår" / "" för äldre datum. */
function relLabel(d){
  const a = new Date(d); a.setHours(12,0,0,0);
  const now = new Date(); now.setHours(12,0,0,0);
  const diff = Math.round((now - a) / 86400000);
  if(diff === 0) return 'Idag';
  if(diff === 1) return 'Igår';
  if(diff === -1) return 'Imorgon';
  return '';
}

function longDateLabel(d){
  const s = d.toLocaleDateString('sv-SE', { weekday:'long', day:'numeric', month:'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function ymd(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayYmd(){ return ymd(new Date()); }
function sortByTime(list){
  list.sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
  return list;
}
const MEAL_SLOTS = [
  { key:'frukost',   label:'Frukost',   time:'07:30', words:['frukost','morgonmål'] },
  { key:'lunch',     label:'Lunch',     time:'12:00', words:['lunch'] },
  { key:'mellanmal', label:'Mellanmål', time:'15:00', words:['mellanmål','mellis','fika','snack'] },
  { key:'middag',    label:'Middag',    time:'18:30', words:['middag','kvällsmat'] },
  { key:'kvall',     label:'Kvällsmål', time:'21:00', words:['kvällsmål','nattmat','kvällsfika'] }
];
function detectSlot(name){
  const n = (name||'').toLowerCase();
  // Längsta nyckelordet först så "kvällsmat" inte fångas av "kväll"
  const all = MEAL_SLOTS.flatMap(s => s.words.map(w => ({ w, s })))
    .sort((a,b) => b.w.length - a.w.length);
  const hit = all.find(x => n.includes(x.w));
  return hit ? hit.s : null;
}
/* Föreslår tid utifrån namnet, annars klockan nu. */
function suggestTime(name){
  const slot = detectSlot(name);
  return slot ? slot.time : nowHM();
}

function nowHM(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ---- Måltidstyper ----
   Etiketten är valfri och påverkar inte tidsstämpeln på dagens datum.
   Föreslagen tid används bara när man loggar en tidigare dag. */
const MEAL_TYPES = [
  { key:'frukost',   label:'Frukost',   time:'07:30', match:/^\s*frukost\b|^\s*breakfast\b/i },
  { key:'lunch',     label:'Lunch',     time:'12:00', match:/^\s*lunch\b/i },
  { key:'middag',    label:'Middag',    time:'18:00', match:/^\s*(middag|kvällsmat|dinner)\b/i },
  { key:'mellanmal', label:'Mellanmål', time:'15:00', match:/^\s*(mellanmål|fika)\b/i },
  { key:'snack',     label:'Snack',     time:'21:00', match:/^\s*(snack|kvällsmat|gottis|chips|nötter|frukt)\b/i },
  { key:'alkohol',   label:'Alkohol',   time:'19:00', match:/(^|\s)(alkohol|öl|vin|sprit|cocktail|cider|champagne|prosecco|whisky|whiskey|vodka|gin\b|rom|calvados|cognac|aperol|aperitif)(\s|$|,)/i }
];
function mealTypeLabel(key){
  const m = MEAL_TYPES.find(x => x.key === key);
  return m ? m.label : null;
}
function detectMealType(name){
  const m = MEAL_TYPES.find(x => x.match.test(name || ''));
  return m ? m.key : null;
}
/* Idag: faktisk tid. Tidigare dag: föreslagen tid för måltidstypen. */
function timeForEntry(name, mealType){
  if(ymd(state.currentDate) === todayYmd()) return nowHM();
  const key = mealType || detectMealType(name);
  const m = MEAL_TYPES.find(x => x.key === key);
  return m ? m.time : '12:00';
}

function fmtDateLabel(d){
  const dayNames = ['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
  const monthNames = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  const isToday = ymd(d) === todayYmd();
  return { main: `${d.getDate()} ${monthNames[d.getMonth()]}`, sub: isToday ? 'Idag' : dayNames[d.getDay()] };
}

function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(escape(atob(str)));
}

async function ghRequest(options = {}){
  const cfg = state.gh;
  const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodeURIComponent(cfg.path)}`;
  return fetch(url, {
    ...options,
    headers: {
      'Authorization': `Bearer ${cfg.token}`,
      'Accept': 'application/vnd.github+json',
      ...(options.headers || {})
    }
  });
}

async function ghLoadBundle(){
  if(!ghConfigured()){
    noteSync(false, 'GitHub ej konfigurerat – fyll i under Inställningar');
    return null;
  }
  try{
    const res = await ghRequest({ method: 'GET' });
    if(res.status === 404){
      state.gh.sha = null;
      noteSync(true, 'Ingen datafil i GitHub ännu (skapas vid första sparning)');
      return null;
    }
    if(!res.ok){
      const t = await res.text().catch(() => '');
      throw new Error(`GitHub svarade ${res.status}: ${t.slice(0,120)}`);
    }
    const json = await res.json();
    state.gh.sha = json.sha;
    const decoded = b64DecodeUnicode(json.content.replace(/\n/g, ''));
    const bundle = JSON.parse(decoded);
    noteSync(true, 'Hämtade data från GitHub');
    return bundle;
  }catch(e){
    console.error('GitHub load failed', e);
    noteSync(false, `Kunde inte hämta från GitHub (${(e.message || '').slice(0,80)})`);
    return null;
  }
}

/* ---- Synk: senast synkade version används som bas för en trevägssammanslagning ---- */
function bundleFromState(){
  return {
    settings: state.settings,
    weights: state.weights,
    favorites: state.favorites,
    pantry: state.pantry,
    skippedDays: state.skippedDays,
    days: state.cache
  };
}
function snapshotSyncBase(bundle){
  try{ state.syncBase = JSON.parse(JSON.stringify(bundle || bundleFromState())); }catch(e){ state.syncBase = null; }
}
function applyBundle(bundle){
  if(bundle.settings) state.settings = bundle.settings;
  if(bundle.weights) state.weights = bundle.weights;
  if(bundle.favorites) state.favorites = bundle.favorites;
  if(bundle.pantry){
    state.pantry = bundle.pantry.map(p => ({
      ...p,
      portion: p.portion || (p.unit === 'st' ? 1 : 100)
    }));
  }
  if(bundle.skippedDays) state.skippedDays = bundle.skippedDays;
  if(bundle.days) state.cache = bundle.days;
  snapshotSyncBase(bundle);
}
/* Det som ändrats här sedan senaste synk vinner, allt annat tas från GitHub.
   Dagar och vikter slås ihop per datum, övrigt per del. */
function mergeBundles(base, local, remote){
  const J = v => JSON.stringify(v === undefined ? null : v);
  base = base || {};
  const pick = k => (J(local[k]) !== J(base[k])) ? local[k] : (remote[k] !== undefined ? remote[k] : local[k]);
  const out = {
    settings: pick('settings'),
    favorites: pick('favorites'),
    pantry: pick('pantry'),
    skippedDays: pick('skippedDays'),
    days: {},
    weights: []
  };
  const bd = base.days || {}, ld = local.days || {}, rd = remote.days || {};
  new Set([...Object.keys(ld), ...Object.keys(rd)]).forEach(k => {
    const changedHere = J(ld[k]) !== J(bd[k]);
    const v = changedHere ? ld[k] : (k in rd ? rd[k] : ld[k]);
    if(v !== undefined && v !== null) out.days[k] = v;
  });
  const byDate = a => Object.fromEntries((a || []).map(w => [w.date, w]));
  const bw = byDate(base.weights), lw = byDate(local.weights), rw = byDate(remote.weights);
  new Set([...Object.keys(lw), ...Object.keys(rw), ...Object.keys(bw)]).forEach(d => {
    const changedHere = J(lw[d]) !== J(bw[d]);
    const v = changedHere ? lw[d] : rw[d];
    if(v) out.weights.push(v);
  });
  out.weights.sort((a,b) => a.date.localeCompare(b.date));
  return out;
}

async function ghSaveBundle(retry = true){
  if(!ghConfigured()){
    noteSync(false, 'GitHub ej konfigurerat – fyll i under Inställningar');
    return false;
  }
  const sentJson = JSON.stringify(bundleFromState());
  const bundle = JSON.parse(sentJson);
  try{
    const body = {
      message: `Uppdatera kaloridagbok ${new Date().toISOString()}`,
      content: b64EncodeUnicode(sentJson),
      branch: state.gh.branch || 'main'
    };
    if(state.gh.sha) body.sha = state.gh.sha;
    const res = await ghRequest({ method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if(retry && (res.status === 409 || res.status === 422)){
      // Någon annan enhet har sparat sedan vi hämtade — slå ihop istället för att skriva över
      const local = bundleFromState();
      const remote = await ghLoadBundle();
      if(remote){
        applyBundle(mergeBundles(state.syncBase, local, remote));
        snapshotSyncBase(remote); // servern har nu remote — våra ändringar räknas mot den
      }
      return await ghSaveBundle(false);
    }
    if(!res.ok){
      const t = await res.text().catch(() => '');
      throw new Error(`GitHub svarade ${res.status}: ${t.slice(0,120)}`);
    }
    const json = await res.json();
    state.gh.sha = json.content.sha;
    snapshotSyncBase(bundle);
    noteSync(true, 'Sparat till GitHub');
    return true;
  }catch(e){
    console.error('GitHub save failed', e);
    noteSync(false, `Kunde inte spara till GitHub (${(e.message || '').slice(0,80)})`);
    return false;
  }
}

function dayTotals(data){
  const intake = data.food.reduce((s,f)=>s+Number(f.kcal||0),0);
  const burned = data.exercise.reduce((s,e)=>s+Number(e.kcal||0),0);
  const protein = data.food.reduce((s,f)=>s+Number(f.protein||0),0);
  const fat = data.food.reduce((s,f)=>s+Number(f.fat||0),0);
  const carbs = data.food.reduce((s,f)=>s+Number(f.carbs||0),0);
  return { intake, burned, net: intake - burned, protein, fat, carbs };
}

/* ---- Måltidsmönster: vad händer dagar då ett mål hoppas över? ---- */
function mealPatterns(results){
  const logged = results.filter(r => r.totals.intake > 0 && r.day);
  const out = [];
  MEAL_TYPES.slice(0,3).forEach(kind => {
    const withIt = [], without = [];
    logged.forEach(r => {
      const has = r.day.food.some(f =>
        (f.mealType || detectMealType(f.name)) === kind.key);
      (has ? withIt : without).push(r.totals);
    });
    if(withIt.length < 4 || without.length < 4) return;
    const avg = (arr, key) => Math.round(arr.reduce((s,t)=>s+t[key],0)/arr.length);
    out.push({
      kind,
      nWith: withIt.length, nWithout: without.length,
      intakeWith: avg(withIt,'intake'), intakeWithout: avg(without,'intake'),
      proteinWith: avg(withIt,'protein'), proteinWithout: avg(without,'protein')
    });
  });
  return out;
}

function mealPatternBlock(results){
  const pats = mealPatterns(results);
  if(!pats.length){
    return `<div class="card">
      <div class="sectitle" style="margin:0 0 8px 2px;">Måltidsmönster</div>
      <div class="empty" style="text-align:left; padding:0;">

        Kräver minst 4 dagar i varje grupp.
      </div>
    </div>`;
  }
  return `<div class="card">
    <div class="sectitle" style="margin:0 0 8px 2px;">Måltidsmönster</div>
    ${pats.map(p => {
      const diff = p.intakeWithout - p.intakeWith;
      const pDiff = p.proteinWithout - p.proteinWith;
      const more = diff > 0;
      return `<div class="patrow">

          <small>${p.nWithout} dagar utan · ${p.nWith} med</small></div>

      </div>
      <div class="cmp-note" style="margin:0 0 12px;">
        ${p.kind.key === 'alkohol'
          ? (Math.abs(diff) < 50
            ? `Liten skillnad i totalt intag mellan alkohol-dagar och andra (${p.intakeWith} mot ${p.intakeWithout} kcal).`
            : `Alkohol bidrar med i snitt ${Math.abs(p.intakeWith - p.intakeWithout)} extra kcal på dessa dagar (${p.intakeWith} mot ${p.intakeWithout} kcal). Kom ihåg att alkohol även bromsar fettförbränningen medan det förbränns.`)
          : p.kind.key === 'snack'
          ? (Math.abs(diff) < 50
            ? `Liten skillnad i totalt intag mellan snack-dagar och andra (${p.intakeWith} mot ${p.intakeWithout} kcal).`
            : `Snack bidrar med i snitt ${Math.abs(p.intakeWith - p.intakeWithout)} extra kcal (${p.intakeWith} mot ${p.intakeWithout} kcal utan snack).`)
          : Math.abs(diff) < 100
            ? `Intaget skiljer sig knappt (${p.intakeWith} mot ${p.intakeWithout} kcal). Att hoppa över verkar inte påverka totalen.`
            : more
              ? `Du åt i snitt mer totalt de dagar ${p.kind.label.toLowerCase()} saknades (${p.intakeWithout} mot ${p.intakeWith} kcal) — det äts alltså upp senare på dagen och lite till.`
              : `Du åt i snitt mindre totalt de dagar ${p.kind.label.toLowerCase()} saknades (${p.intakeWithout} mot ${p.intakeWith} kcal) — måltiden kompenserades inte fullt ut.`}
        ${Math.abs(pDiff) >= 15 ? ` Proteinet ${pDiff < 0 ? 'sjönk' : 'steg'} ${Math.abs(pDiff)} g i snitt.` : ''}
      </div>`;
    }).join('')}
    <div class="cmp-note" style="border-top:1px solid var(--line); padding-top:8px;">

    </div>
  </div>`;
}

/* ---- Kopiera en tidigare dag ---- */
function recentLoggedDays(limit){
  const cur = ymd(state.currentDate);
  const out = [];
  for(let i = 1; i <= 30 && out.length < (limit||6); i++){
    const d = new Date(state.currentDate);
    d.setDate(d.getDate() - i);
    const key = ymd(d);
    if(key === cur) continue;
    const day = state.cache[key];
    if(!day) continue;
    const t = dayTotals(day);
    if(t.intake <= 0) continue;
    out.push({ date: d, key, totals: t, meals: day.food.length });
  }
  return out;
}

/* AI:n svarar alltid med näringsvärden PER 100 GRAM och delens TOTALA VIKT
   i gram — två siffror modellen är pålitlig på. Styckvara blir det bara när
   en styckvikt följer med; saknas den faller vi tillbaka på gram i stället
   för att tolka per-100-gram-värden som per styck (2 ägg blev annars 310
   kcal, 3 skivor sidfläsk 960). */
function partFromAi(c){
  const per100 = k => {
    const a = c[k + 'Per100g'], b = c[k + 'Per100'];
    return Number(a != null && a !== '' ? a : b) || 0;
  };
  const kcal100 = per100('kcal'), prot100 = per100('protein'),
        fat100  = per100('fat'),  carb100 = per100('carbs');
  const name = String(c.name || c.namn || '').trim();
  const num = v => { const n = Number(v); return isFinite(n) && n > 0 ? n : null; };

  const antal  = num(c.styckAntal) || (c.unit === 'st' ? num(c.amount) : null);
  const vikt   = num(c.styckvikt)  || num(c.gramPerStyck);
  const gram   = num(c.gram) || (c.unit !== 'st' ? num(c.amount) : null);

  const make = (unit, amount, f, extra) => ({
    name, unit, amount,
    kcalPer100:    Math.round(kcal100 * f),
    proteinPer100: Math.round(prot100 * f * 10) / 10,
    fatPer100:     Math.round(fat100  * f * 10) / 10,
    carbsPer100:   Math.round(carb100 * f * 10) / 10,
    ...extra, src: 'ai'
  });

  // Styck kräver en känd styckvikt — annars vet vi inte vad en styck är
  if(antal && vikt) return make('st', antal, vikt / 100, { gramPerStyck: Math.round(vikt) });

  // Gram: per-100-gram-värdena används precis som de är
  return make('g', Math.round(gram || 100), 1, {});
}


function componentKcal(c){
  const amt = Number(c.amount) || 0;
  const f = c.unit === 'st' ? amt : amt/100;
  return Math.round(f * (Number(c.kcalPer100) || 0));
}
function componentMacros(c){
  const amt = Number(c.amount) || 0;
  const f = c.unit === 'st' ? amt : amt/100;
  return {
    kcal: f * (Number(c.kcalPer100)||0),
    protein: f * (Number(c.proteinPer100)||0),
    fat: f * (Number(c.fatPer100)||0),
    carbs: f * (Number(c.carbsPer100)||0)
  };
}

/* ---------- Tallriken ----------
   Tallriken = dagens utrymme enligt plan: målet + det du förbränt.
   Färgen visar var maten hamnar, med samma zoner som vecko- och månadsvyn:
   mörkgrönt inom målet, ljusgrönt i träningskalorierna (fortfarande enligt plan),
   guld över planen men under förbrukningen, rött över förbrukningen. */
function maintenanceFor(goal){
  const sug = goalSuggestion();
  return (sug && sug.tdee > goal) ? sug.tdee : Math.round(goal * 1.10);
}
function netZone(net, goal){
  if(net <= goal) return 'goal';
  return net <= maintenanceFor(goal) ? 'gold' : 'rust';
}
const ZONE_COL = { goal:'var(--z-goal)', train:'var(--z-train)', gold:'var(--gold)', rust:'var(--rust)' };

function plateSVG(foods, burned, goal){
  const CX = 138, R = 92, C = 2*Math.PI*R;
  const items = foods.map(f => Number(f.kcal)||0).filter(k => k > 0);
  const I = items.reduce((s,k)=>s+k, 0);
  const G = goal, A = goal + burned, M = maintenanceFor(goal) + burned;
  const T = Math.max(A, I, 1);
  const pos = v => v / T * C;
  const colFor = end => end <= G ? 'goal' : end <= A ? 'train' : end <= M ? 'gold' : 'rust';
  let arcs = '', at = 0;
  items.forEach(k => {
    const a = at, b = at + k; at = b;
    const cuts = [a, ...[G, A, M].filter(x => x > a && x < b), b];
    for(let i = 0; i < cuts.length - 1; i++){
      const s = cuts[i], e = cuts[i+1];
      let L = pos(e) - pos(s);
      if(e === b && L > 9) L -= 3.5;
      if(L <= 0.3) continue;
      arcs += `<circle cx="${CX}" cy="${CX}" r="${R}" fill="none" stroke="${ZONE_COL[colFor(e)]}" stroke-width="30"
        stroke-dasharray="${L.toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-pos(s)).toFixed(1)}" transform="rotate(-90 ${CX} ${CX})"/>`;
    }
  });
  const tick = v => {
    const ang = v / T * 2*Math.PI - Math.PI/2;
    return `<line x1="${(CX+100*Math.cos(ang)).toFixed(1)}" y1="${(CX+100*Math.sin(ang)).toFixed(1)}"
      x2="${(CX+131*Math.cos(ang)).toFixed(1)}" y2="${(CX+131*Math.sin(ang)).toFixed(1)}" stroke="#1F3A2E" stroke-width="2" stroke-linecap="round"/>`;
  };
  let rim = '';
  if(burned > 0){
    const r2 = 124, c2 = 2*Math.PI*r2;
    const s = G / T * c2, L = burned / T * c2;
    rim = `<circle cx="${CX}" cy="${CX}" r="${r2}" fill="none" stroke="var(--gold)" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${Math.max(0, L-6).toFixed(1)} ${c2.toFixed(1)}" stroke-dashoffset="${(-(s+3)).toFixed(1)}" transform="rotate(-90 ${CX} ${CX})"/>`
      + tick(G);
  }
  if(I > A) rim += tick(A);
  return { I, svg: `<svg viewBox="0 0 276 276" aria-hidden="true">
    <defs><radialGradient id="plateRim" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FBF6EC"/><stop offset="78%" stop-color="#F3EBDD"/><stop offset="100%" stop-color="#DCCFB8"/>
    </radialGradient></defs>
    <circle cx="138" cy="146" r="134" fill="rgba(0,0,0,.28)"/>
    <circle cx="138" cy="138" r="134" fill="url(#plateRim)"/>
    <circle cx="138" cy="138" r="92" fill="none" stroke="#E9E0CE" stroke-width="30"/>
    ${rim}${arcs}
  </svg>` };
}

function weekDays(d){
  const base = new Date(d); base.setHours(12,0,0,0);
  base.setDate(base.getDate() - (base.getDay()+6)%7);
  return Array.from({length:7}, (_,i) => { const x = new Date(base); x.setDate(base.getDate()+i); return x; });
}

function weekLabelHTML(d){
  const goal = state.settings.dailyGoal;
  const results = weekDays(d).map(x => {
    const day = state.cache[ymd(x)] || { food:[], exercise:[] };
    return { date:x, day, totals: dayTotals(day) };
  });
  const st = periodStats(results, goal);
  let bal = '';
  if(st.logged){
    const v = Math.round(st.totalVsMaintenance / 100) * 100;
    bal = ` · ${v >= 0 ? 'underskott' : 'överskott'} <b>${Math.abs(v).toLocaleString('sv-SE')} kcal</b>`;
  }
  return `Vecka ${weekNumber(d)}${bal}`;
}

function weekStripHTML(){
  const goal = state.settings.dailyGoal;
  const sel = ymd(state.currentDate), today = todayYmd();
  const names = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
  return `<div class="wkstrip">${weekDays(state.currentDate).map((d,i) => {
    const k = ymd(d);
    const day = state.cache[k];
    const t = day ? dayTotals(day) : null;
    const isSel = k === sel;
    let svg;
    if(!t || t.intake <= 0){
      svg = `<svg width="32" height="32" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="none" stroke="${isSel?'#8FA898':'#4E7464'}" stroke-width="1.5" stroke-dasharray="3 3"/></svg>`;
    } else {
      const C = 2*Math.PI*11;
      const f = Math.min(1, t.intake / Math.max(1, goal + t.burned));
      const col = ZONE_COL[netZone(t.net, goal)];
      svg = `<svg width="32" height="32" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="${isSel?'#FFFFFF':'#F3EBDD'}"/>
        <circle cx="17" cy="17" r="11" fill="none" stroke="#E2D8C5" stroke-width="6"/>
        <circle cx="17" cy="17" r="11" fill="none" stroke="${col}" stroke-width="6" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-f)).toFixed(1)}" transform="rotate(-90 17 17)"/></svg>`;
    }
    return `<button class="wkday ${isSel?'sel':''} ${k===today?'today':''}" data-ymd="${k}" ${isSel?'aria-current="date"':''}>${svg}${names[i]}</button>`;
  }).join('')}</div>`;
}

function dayHeroHTML(data, t){
  const goal = state.settings.dailyGoal;
  const remaining = goal - t.net;
  const plate = plateSVG(data.food, t.burned, goal);
  const zone = netZone(t.net, goal);
  const logged = t.intake > 0;

  // Status
  const st = dayStatus(t, goal, remaining);
  const sCol = !logged ? 'var(--muted)' : remaining >= 0 ? '#BFE0C6' : (zone === 'gold' ? 'var(--gold-ink)' : 'var(--rust)');
  const sBg  = !logged ? 'rgba(243,235,221,.06)' : remaining >= 0 ? 'rgba(127,168,138,.18)' : (zone === 'gold' ? 'rgba(233,180,76,.16)' : 'rgba(229,132,98,.16)');
  const statusLabel = remaining < 0 && zone === 'gold' ? 'Över planen' : st.label;

  // Vikt
  const dateStr = ymd(state.currentDate);
  const wToday = state.weights.find(w => w.date === dateStr);
  const ws = state.weights.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const last = ws.length ? ws[ws.length-1] : null;
  const before = ws.filter(w => w.date < dateStr);
  const prevW = before.length ? before[before.length-1] : null;
  const shownW = wToday ? wToday.kg : (prevW ? prevW.kg : (last ? last.kg : ''));
  const delta = (wToday && prevW) ? wToday.kg - prevW.kg : null;
  const wVal = shownW !== '' ? Number(shownW).toFixed(1).replace('.', ',') : '';
  const trendSeries = weightTrendSeries();
  const trendNow = trendSeries[dateStr];
  const firstW = ws.length ? ws[0].date : null;
  const histDays = firstW ? (new Date(dateStr) - new Date(firstW)) / 86400000 : 0;
  const rate = (histDays >= 7) ? trendRatePerWeek(dateStr) : null;

  // Text under tallriken
  let note;
  if(!logged) note = t.burned > 0 ? `Tallriken rymmer ${goal + t.burned} kcal idag: målet ${goal} + ${t.burned} från träningen.` : `Inga måltider loggade än. Målet är ${goal} kcal.`;
  else if(remaining >= 0){
    if(t.burned > 0 && t.intake < goal) note = `${goal - t.intake} kvar inom målet, sedan ${t.burned} från träningen.`;
    else if(t.burned > 0) note = `Målet nått – ${remaining} kvar av träningskalorierna.`;
    else note = `${remaining} kvar av målet ${goal}.`;
  } else note = zone === 'gold'
    ? `${-remaining} över planen, men fortfarande under din förbrukning.`
    : `Över din förbrukning idag.`;

  // Teckenförklaring: bara det som är relevant
  const leg = [['goal','Inom målet']];
  if(t.burned > 0) leg.push(['train','Träningskalorier']);
  if(plate.I > goal + t.burned) leg.push(['gold','Över planen']);
  if(plate.I > maintenanceFor(goal) + t.burned) leg.push(['rust','Över förbrukningen']);

  // Aktiva kalorier + protein
  const baseline = inBaselineMode();
  const activeEntry = (data.exercise||[]).find(e => e.active);
  const activeVal = activeEntry ? activeEntry.kcal : '';
  const mt = macroTargets();
  const pPct = mt ? Math.min(100, Math.round(t.protein / mt.protein * 100)) : 0;

  return `
    ${weekStripHTML()}
    <div class="dh-chips">
      <span class="dh-status" style="color:${sCol}; background:${sBg};"><i></i>${statusLabel}</span>
      <label class="wchip" title="${rate !== null ? 'Trendvikt ' + kgFmt(Math.round(trendNow*10)/10) + ' kg, förändring senaste veckan' : 'Dagens vikt'}"><input type="text" inputmode="decimal" id="weightInput" value="${wVal}" placeholder="—" aria-label="Vikt i kg">kg${
        rate !== null ? ` <span style="color:${rate<=0?'var(--sage)':'var(--rust)'}">${signed(rate,1)}/v</span>`
        : delta !== null ? ` <span style="color:${delta<=0?'var(--sage)':'var(--rust)'}">${signed(delta,1)}</span>` : ''}</label>
    </div>
    <div class="dh-plate">${plate.svg}
      <div class="dh-center">
        <b style="${remaining < 0 ? `color:${zone==='gold'?'#B8862A':'#C2502E'}` : ''}">${Math.abs(remaining)}</b>
        <span>kcal ${remaining >= 0 ? 'kvar' : 'över'}</span>
      </div>
    </div>
    <div class="dh-legend">${leg.map(([k,l]) => `<span><i style="background:${ZONE_COL[k]};${k==='goal'?' box-shadow:0 0 0 1px #6F927C;':''}"></i>${l}</span>`).join('')}</div>
    <div class="dh-note">${note}</div>
    <div class="dh-row">
      ${baseline ? `<label class="dh-active ${activeVal !== '' ? 'filled' : ''}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
        <span class="lbl"><b>Aktiva kalorier</b><small>gör tallriken större</small></span>
        <input type="text" inputmode="numeric" id="activeInput" value="${activeVal}" placeholder="0" aria-label="Aktiva kalorier">
      </label>` : ''}
      ${mt ? `<div class="dh-prot ${baseline ? '' : 'wide'}">
        <small>Protein</small>
        <b>${Math.round(t.protein)}<em>/${mt.protein} g</em></b>
        <div class="bar"><i style="width:${pPct}%; background:${t.protein >= mt.protein ? 'var(--sage)' : 'var(--ink)'}"></i></div>
      </div>` : ''}
    </div>`;
}

function escapeHtml(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  const dash = circumference * (pct/100);
  const overGoal = t.net > goal;

  content.innerHTML = `
    ${dayHeroHTML(data, t)}

    ${missingDaysNotice()}
    <div class="sechead">

    ${(() => {
      const shown = data.exercise.map((e,i)=>({e,i})).filter(x => !(inBaselineMode() && x.e.active));
      // I baslinjeläge bor aktiva kalorier i toppkortet — visa sektionen bara om något annat finns

        ${state.openForm === 'exercise' ? exerciseForm()

  if(modeQuick) modeQuick.onclick = () => { state.foodFormMode = 'quick'; renderContent(); };

    if(!state.mealBuilder.length) state.mealBuilder = [emptyIngredient()];

  };

  const openPickerBtn = document.getElementById('openPicker');
  if(openPickerBtn) openPickerBtn.onclick = () => {
    state.pickerOpen = true; state.pantryQuery = ''; renderContent();

  };
  const closePickerBtn = document.getElementById('closePicker');
  if(closePickerBtn) closePickerBtn.onclick = () => { state.pickerOpen = false; renderContent(); };

  const pSearch = document.getElementById('pantrySearch');
  if(pSearch){
    pSearch.oninput = () => {
      state.pantryQuery = pSearch.value;
      const box = document.querySelector('.pickerlist');
      const wrap = document.querySelector('.pickerbox');
      if(!wrap) return;
      const tmp = document.createElement('div');
      tmp.innerHTML = pantryPicker();
      const fresh = tmp.querySelector('.pickerlist');
      if(box && fresh) box.replaceWith(fresh);
      else renderContent();
      wirePickItems();
    };
  }

  function wirePickItems(){
    content.querySelectorAll('.pickitem').forEach(btn => {
      btn.onclick = async () => {
        const entry = findInPantry(btn.dataset.name, btn.dataset.unit);
        if(!entry) return;
        // Ersätt en tom rad, annars lägg till ny
        const empties = state.mealBuilder.filter(r => !r.name || !r.name.trim());
        let idx;
        if(empties.length){ idx = state.mealBuilder.indexOf(empties[0]); }
        else { state.mealBuilder.push(emptyIngredient()); idx = state.mealBuilder.length - 1; }
        const row = state.mealBuilder[idx];
        row.name = entry.name;
        applyPantryToRow(idx, entry);
        row.portion = Number(entry.portion) || (entry.unit==='st' ? 1 : 100);
        row.amount = row.portion;
        entry.lastUsed = Date.now();
        state.pickerOpen = false;
        state.pantryQuery = '';
        await ghSaveBundle();
        renderContent();
      };
    });
  }
  wirePickItems();

  content.querySelectorAll('.amtchip').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      state.mealBuilder[idx].amount = Number(btn.dataset.amt);
      const inp = content.querySelector(`.ing-amount[data-idx="${idx}"]`);
      if(inp) inp.value = btn.dataset.amt;
      content.querySelectorAll(`.amtchip[data-idx="${idx}"]`).forEach(c =>
        c.classList.toggle('active', c === btn));
      updateMealTotalsDOM();
    };
  });

  const addIngBtn = document.getElementById('addIngredient');
  if(addIngBtn) addIngBtn.onclick = () => { state.mealBuilder.push(emptyIngredient()); renderContent(); };

  content.querySelectorAll('.rmv').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      state.mealBuilder.splice(idx, 1);
      if(!state.mealBuilder.length) state.mealBuilder = [emptyIngredient()];
      renderContent();
    };
  });

  content.querySelectorAll('.estbtn[id^="estBtn_"]').forEach(btn => {
    btn.onclick = () => estimateIngredient(Number(btn.dataset.idx));
  });

  content.querySelectorAll('.mtbtn').forEach(b => {
    b.onclick = () => {
      // Redigeringsrad: bara byt aktiv klass, påverka inte state.mealType
      if(b.closest('.entry.editrow')){
        b.closest('.entry.editrow').querySelectorAll('.mtbtn').forEach(x =>
          x.classList.toggle('active', x === b));
        return;
      }
      // Normalt formulär: växla markeringen på plats
      state.mealType = state.mealType === b.dataset.mt ? null : b.dataset.mt;
      content.querySelectorAll('.mtbtn').forEach(x =>
        x.classList.toggle('active', x.dataset.mt === state.mealType));
    };
  });

  const quickEstBtn = document.getElementById('quickEstBtn');
  if(quickEstBtn) quickEstBtn.onclick = () => estimateQuickMeal();

  const quickPhotoBtn = document.getElementById('quickPhotoBtn');
  const quickPhotoInput = document.getElementById('quickPhotoInput');
  if(quickPhotoBtn && quickPhotoInput){
    quickPhotoBtn.onclick = () => quickPhotoInput.click();
    quickPhotoInput.onchange = () => {
      const f = quickPhotoInput.files && quickPhotoInput.files[0];
      if(f) estimateMealPhoto(f);
      quickPhotoInput.value = '';
    };
  }

  content.querySelectorAll('.unit-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      const newUnit = btn.dataset.unit;
      const row = state.mealBuilder[idx];
      if(row.unit === newUnit) return;
      row.unit = newUnit;
      // Rimliga standardmängder och nollställ näringsvärden (de byter betydelse)
      row.amount = newUnit === 'st' ? 1 : 100;
      row.kcalPer100 = 0; row.proteinPer100 = 0; row.fatPer100 = 0; row.carbsPer100 = 0;
      renderContent();
    };
  });

  content.querySelectorAll('.estbtn[id^="scanBtn_"]').forEach(btn => {
    btn.onclick = () => {
      const idx = btn.dataset.idx;
      const input = content.querySelector(`.scan-input[data-idx="${idx}"]`);
      if(input) input.click();
    };
  });

  content.querySelectorAll('.scan-input').forEach(input => {
    input.onchange = () => {
      const file = input.files && input.files[0];
      if(file) scanLabel(Number(input.dataset.idx), file);
      input.value = '';
    };
  });

  const fieldMap = {
    'ing-name': 'name', 'ing-amount': 'amount', 'ing-kcal': 'kcalPer100',
    'ing-protein': 'proteinPer100', 'ing-fat': 'fatPer100', 'ing-carbs': 'carbsPer100'
  };
  Object.keys(fieldMap).forEach(cls => {
    content.querySelectorAll('.' + cls).forEach(input => {
      input.oninput = () => {
        const idx = Number(input.dataset.idx);
        const key = fieldMap[cls];
        state.mealBuilder[idx][key] = input.value;
        if(key === 'amount' || key === 'name') state.mealBuilder[idx].note = null;
        if(key === 'name'){
          // Skriver man "40 g gurka" ska mängdfältet följa med direkt
          const q = parseAmountFromName(input.value);
          if(q && q.exact){
            const amtEl = content.querySelector(`.ing-amount[data-idx="${idx}"]`);
            if(amtEl && Number(amtEl.value) !== q.amount){
              state.mealBuilder[idx].amount = q.amount;
              amtEl.value = q.amount;
            }
          }
          const hit = findInPantry(input.value);
          if(hit){
            applyPantryToRow(idx, hit);
            renderContent();
            // behåll fokus i namnfältet efter omritning
            const again = content.querySelector(`.ing-name[data-idx="${idx}"]`);
            if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
            const st = document.getElementById('estStatus_' + idx);
            if(st){ st.style.color = 'var(--sage)'; st.textContent = 'Hämtat från ditt bibliotek'; }
            return;
          }
        }
        updateMealTotalsDOM();
      };
    });
  });

  content.querySelectorAll('.pantrybtn').forEach(btn => {
    btn.onclick = async () => {
      const idx = Number(btn.dataset.idx);
      btn.disabled = true; btn.textContent = 'Sparar…';
      await savePantryItem(state.mealBuilder[idx]);
      renderContent();
    };
  });

  const saveMealBtn = document.getElementById('saveMeal');
  if(saveMealBtn) saveMealBtn.onclick = async () => {
    const components = state.mealBuilder.filter(r => r.name && r.name.trim());
    if(!components.length) return;
    const t = computeMealTotals();
    const nameInput = document.getElementById('buildMealName').value.trim();
    // Namn är valfritt: måltidstypen först, annars ingredienserna
    const name = nameInput
      || mealTypeLabel(state.mealType)
      || components.map(c => c.name).join(', ');
    const entry = {
      name,
      kcal: Math.round(t.kcal),
      protein: Math.round(t.protein),
      fat: Math.round(t.fat),
      carbs: Math.round(t.carbs),
      components,
      time: (()=>{ const bt=document.getElementById('buildTime'); return bt&&bt.value?bt.value:timeForEntry(name,state.mealType); })(),
      ...(state.mealType ? { mealType: state.mealType } : {})
    };
    if(state.editingFav !== null){
      state.favorites[state.editingFav] = { ...entry };
      state.editingFav = null;
      state.mealBuilder = [];
      await ghSaveBundle();
      state.openForm = 'favorites';
      renderContent();
      return;
    }
    data.food.push(entry);
    sortByTime(data.food);
    await saveDay(dateStr, data);
    const favCb2 = document.getElementById('buildSaveFav');
    if(favCb2 && favCb2.checked){
      state.favorites = state.favorites.filter(f => f.name !== name);
      state.favorites.push({ ...entry });
      await ghSaveBundle();
    }
    state.mealType = null;
    state.openForm = null;
    state.mealBuilder = [];
    renderContent();
  };

  const saveExBtn = document.getElementById('saveEx');
  if(saveExBtn) saveExBtn.onclick = async () => {
    const name = document.getElementById('eName').value.trim();
    const kcal = Number(document.getElementById('eKcal').value) || 0;
    if(!name || !kcal) return;
    data.exercise.push({ name, kcal, time: nowHM() });
    sortByTime(data.exercise);
    await saveDay(dateStr, data);
    state.openForm = null;
    renderContent();
  };

  content.querySelectorAll('.entry .del:not(.addfav):not(.delfav):not(.editfav)').forEach(btn=>{
    btn.onclick = async () => {
      const type = btn.dataset.type, idx = Number(btn.dataset.idx);
      if(!type) return;
      data[type].splice(idx,1);
      await saveDay(dateStr, data);
      renderContent();
    };
  });
}

/* Liggande staplat diagram: andel av dagens kalorier per makro.
   Färgerna är kategoriska; måluppfyllelse står i förklaringen under. */
/* Kort statusrad ovanför proteinstapeln — tolkar dagen istället för att räkna upp den. */
function dayStatus(t, goal, remaining){
  const mt = macroTargets();
  const logged = t.intake > 0;
  if(!logged) return { label:'Ingen mat loggad', line:'Lägg till dagens första måltid.' };
  const pct = goal ? t.net / goal : 0;
  if(remaining < 0)
    return { label:'Över målet', line:`${Math.abs(remaining)} kcal över planen.` };
  if(mt && t.protein >= mt.protein && pct <= 1)
    return { label:'Målen nådda', line:'Både kalorier och protein ligger rätt.' };
  if(pct > 0.9)
    return { label:'Nästan i mål', line:'Lite utrymme kvar för kvällen.' };
  if(mt && t.protein < mt.protein * 0.5 && pct > 0.5)
    return { label:'Proteinet släpar', line:'Mycket kalorier kvar, lite protein.' };
  return { label:'På väg enligt plan', line:'Bra balans idag.' };
}

/* De två raderna man faktiskt fyller i varje dag: aktiva kalorier och vikt. */
function heroInputs(data, t){
  const baseline = inBaselineMode();
  const activeEntry = (data.exercise||[]).find(e => e.active);
  const activeVal = activeEntry ? activeEntry.kcal : '';
  const dateStr = ymd(state.currentDate);
  const wToday = state.weights.find(w => w.date === dateStr);
  const ws = state.weights.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const last = ws.length ? ws[ws.length-1] : null;
  const prev = ws.length > 1 ? ws[ws.length-2] : null;
  const shownW = wToday ? wToday.kg : (last ? last.kg : '');
  const delta = (wToday && prev) ? wToday.kg - prev.kg
              : (!wToday && last && prev) ? last.kg - prev.kg : null;
  const tw = Number(state.settings.targetWeight) || null;
  const toGo = (tw && shownW) ? shownW - tw : null;
  let wNote = '';
  if(wToday) wNote = 'Idag';
  else if(last) wNote = daysAgoLabel(last.date);
  else wNote = 'Ingen vikt loggad';
  if(toGo !== null && toGo > 0) wNote += ` · ${kgFmt(Math.round(toGo*10)/10)} kg till målet`;

  return `<div class="heroin">
    ${baseline ? `<div class="hirow">
      <div class="hicon gold">🔥</div>
      <div class="hitext">
        <div class="hiname">Aktiva kalorier</div>
        <div class="hisub">Från klockan</div>
      </div>
      <input type="text" inputmode="numeric" id="activeInput" value="${activeVal}" placeholder="0" class="hinput gold">
    </div>` : ''}
    <div class="hirow">
      <div class="hicon sage">⚖</div>
      <div class="hitext">
        <div class="hiname">Vikt${delta !== null ? ` <span class="hidelta" style="color:${delta<=0?'var(--sage)':'var(--rust)'}">${signed(delta,1)}</span>` : ''}</div>
        <div class="hisub">${wNote}</div>
      </div>
      <input type="text" inputmode="decimal" id="weightInput" value="${shownW !== '' ? kgFmt(shownW) : ''}" placeholder="—" class="hinput sage">
    </div>
  </div>`;
}

function daysAgoLabel(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  const now = new Date(); now.setHours(12,0,0,0);
  const diff = Math.round((now - d) / 86400000);
  if(diff <= 0) return 'Idag';
  if(diff === 1) return 'Igår';
  return `För ${diff} dagar sedan`;
}

function macroSplit(t){
  const mt = macroTargets();
  const kP = t.protein*4, kF = t.fat*9, kC = t.carbs*4;
  const sum = kP + kF + kC;
  if(sum <= 0){
    return `<div class="macrosplit">
      <div class="msbar empty"></div>
      <div class="mslegend"><span class="msempty">Ingen mat loggad än</span></div>
    </div>`;
  }
  const segs = [
    { key:'p', label:'Protein', g:Math.round(t.protein), kcal:kP, col:'var(--sage)',
      note: mt ? (t.protein >= mt.protein ? 'mål ' + mt.protein + 'g nått' : 'mål ' + mt.protein + 'g') : '',
      ok: mt ? t.protein >= mt.protein : null },
    { key:'f', label:'Fett', g:Math.round(t.fat), kcal:kF, col:'var(--gold)',
      note: mt ? (t.fat >= mt.fatFloor ? 'över golv ' + mt.fatFloor + 'g' : 'under golv ' + mt.fatFloor + 'g') : '',
      ok: mt ? t.fat >= mt.fatFloor : null },
    { key:'c', label:'Kolhydrater', g:Math.round(t.carbs), kcal:kC, col:'var(--rust)', note:'', ok:null }
  ];
  // Avrunda så att andelarna summerar till exakt 100
  let acc = 0;
  segs.forEach((sg,i) => {
    sg.pct = i === segs.length-1 ? 100-acc : Math.round(sg.kcal/sum*100);
    acc += sg.pct;
  });

  return `<div class="macrosplit">
    <div class="msbar">
      ${segs.filter(sg=>sg.pct>0).map(sg =>
        `<div class="msseg" style="width:${sg.pct}%; background:${sg.col}">
          ${sg.pct >= 10 ? sg.pct + '%' : ''}
        </div>`).join('')}
    </div>
    <div class="mslegend">
      ${segs.map(sg => `<div class="msitem">
        <span class="msdot" style="background:${sg.col}"></span>
        <span class="mstext"><b>${sg.label} ${sg.g}g</b>${sg.pct < 10 ? ` <span class="mspct">${sg.pct}%</span>` : ''}
          ${sg.note ? `<em class="${sg.ok===false?'bad':(sg.ok?'good':'')}">${sg.note}</em>` : ''}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

function favoritesPanel(){
  const grouped = state.favGrouped;

  function favCard(f, i){
    if(state.confirmDelFav === i){
      return `<div class="entry food confirmdel" style="margin-bottom:8px;">
        <div>
          <div class="name">Ta bort "${f.name}"?</div>
          <div class="sub">Favoriten raderas permanent.</div>

          <button class="confirmbtn yes delfav" data-idx="${i}">Ta bort</button>
        </div>

    }
    return `<div class="entry food" style="margin-bottom:8px;">
      <div>
        <div class="name">${f.name}</div>
        <div class="sub">${f.components && f.components.length
          ? f.components.map(c=>c.unit==='st'?`${Number(c.amount)||0} st ${c.name}`:`${c.name} ${Number(c.amount)||0}g`).join(', ')
          : `P ${f.protein||0}g · F ${f.fat||0}g · K ${f.carbs||0}g`}</div>
      </div>
      <div class="right">
        <div class="qtypick">
          <button class="qtybtn" data-idx="${i}" data-dir="-1">−</button>
          <span class="qtyval" id="favQty_${i}">${favQty(i)}</span>
          <button class="qtybtn" data-idx="${i}" data-dir="1">+</button>
        </div>
        <div class="kcal" id="favKcal_${i}">${Math.round(f.kcal * favQty(i))} kcal</div>
        <button class="del editfav" data-idx="${i}" title="Redigera">✎</button>
        <button class="del addfav" data-idx="${i}" title="Lägg till idag">＋</button>
        <button class="del delfav" data-idx="${i}" title="Ta bort">×</button>
      </div>
    </div>`;
  }

  let body = '';
  if(!favs.length){
    body = '<div class="empty">Inga favoriter ännu.</div>';
  } else if(!grouped){
    body = favs.map((f,i) => favCard(f,i)).join('');
  } else {
    // Group by mealType — detect from saved mealType or name
    const ORDER = ['frukost','lunch','middag','mellanmal','snack','alkohol',null];
    const groups = {};
    ORDER.forEach(k => groups[k] = []);
    favs.forEach((f,i) => {
      const mt = f.mealType || detectMealType(f.name) || null;
      const key = ORDER.includes(mt) ? mt : null;
      groups[key].push({f,i});
    });
    const LABELS = {
      frukost:'Frukost', lunch:'Lunch', middag:'Middag',
      mellanmal:'Mellanmål', snack:'Snack', alkohol:'Alkohol', null:'Övrigt'
    };
    ORDER.forEach(k => {
      if(!groups[k].length) return;
      body += `<div class="favgroup">
        <div class="favgrouplbl">${LABELS[k]}</div>
        ${groups[k].map(({f,i}) => favCard(f,i)).join('')}
      </div>`;
    });
  }

async function estimateMealPhoto(file){
  const statusEl = document.getElementById('quickEstStatus');
  const btn = document.getElementById('quickPhotoBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Analyserar…'; }
  if(statusEl){ statusEl.style.color = 'var(--muted)'; statusEl.textContent = 'Läser bilden…'; }
  try{
    const base64 = await fileToBase64(file);
    const data = await callAnthropic({
      model: "claude-sonnet-4-6",
      max_tokens: 600,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: file.type || 'image/jpeg', data: base64 } },
          { type: "text", text: `Du är en näringsexpert. Identifiera maten på tallriken och uppskatta portionsstorlekar utifrån vad som syns (använd tallrik, bestick eller glas som storleksreferens om möjligt). Var realistisk om tillagning: anta att synligt fett, olja eller smör i stekt mat räknas med. Svara ENDAST med ett JSON-objekt, ingen markdown, inga kodstaket. Format exakt: {"namn": "kort beskrivning av måltiden", "kcal": number, "protein": number, "fat": number, "carbs": number, "delar": "vad du identifierat och vilka mängder du antagit", "osakerhet": "lag" | "medel" | "hog"}` }
        ]
      }]
    });
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock) throw new Error('Tomt svar från modellen');
    const p = JSON.parse(textBlock.text.replace(/```json|```/g, '').trim());

    // Fotot ersätter en tidigare textuppskattning — släng gamla delar
    if(state.quickParts){ state.quickParts = null; state.quickNote = null; paintQuickParts(); }
    const setVal = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };
    const nameEl = document.getElementById('fName');
    if(nameEl && !nameEl.value.trim() && p.namn) nameEl.value = p.namn;
    setVal('fKcal', Math.round(Number(p.kcal) || 0));
    setVal('fProtein', Math.round((Number(p.protein) || 0) * 10) / 10);
    setVal('fFat', Math.round((Number(p.fat) || 0) * 10) / 10);
    setVal('fCarbs', Math.round((Number(p.carbs) || 0) * 10) / 10);

    if(statusEl){
      const unc = { lag:'låg', medel:'medel', hog:'hög' }[p.osakerhet] || 'medel';
      const warn = p.osakerhet === 'hog';
      statusEl.style.color = warn ? 'var(--rust)' : 'var(--muted)';
      statusEl.innerHTML = `${p.delar ? p.delar + ' ' : ''}<b>Osäkerhet: ${unc}.</b> Fotouppskattningar slår ofta 20–40 % fel — justera siffrorna om du vet bättre.`;
    }
  } catch(e){
    console.error('Photo estimation failed', e);
    if(statusEl){
      statusEl.style.color = 'var(--rust)';
      statusEl.textContent = 'Fel: ' + (e && e.message ? e.message : 'okänt fel') + '. Fyll i manuellt.';
    }
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = '📸 Fota maten'; }
  }
}

/* Delar upp en fritext i ingredienser: biblioteket först, resten till AI.
   Returnerar { parts, note } eller kastar. Används av både snabbformuläret
   och redigeringsläget. */
async function estimateMealParts(desc){
  const partial = pantryPartialLookup(desc);
  const libParts = partial ? partial.known.map(i => ({
    name: i.entry.name, unit: i.unit, amount: i.amount,
    kcalPer100: i.entry.kcalPer100, proteinPer100: i.entry.proteinPer100,
    fatPer100: i.entry.fatPer100, carbsPer100: i.entry.carbsPer100,
    src: 'lib'
  })) : [];

  if(partial && !partial.unknown.length){
    partial.known.forEach(i => { i.entry.lastUsed = Date.now(); });
    ghSaveBundle();
    return { parts: libParts, note: null };
  }

  const aiDesc = (partial && partial.unknown.length) ? partial.unknown.join(' och ') : desc;
  const data = await callAnthropic({
    model: "claude-sonnet-4-6",
    max_tokens: 700,
    messages: [{
      role: "user",
      content: `Du är en näringsdatabas. Dela upp denna måltid i sina delar och uppskatta varje del: "${aiDesc}"

Regler:
1. En rad per livsmedel. Enhet "g" för sådant som vägs, "st" för sådant som räknas (ägg, frukt, frallor, skivor).
2. Näringsvärdena ska ALLTID vara PER 100 GRAM — aldrig per styck, aldrig multiplicerat med mängden.
3. gram = delens TOTALA vikt i gram. "3 skivor sidfläsk" med 20 g per skiva → gram: 60.
4. Räknas livsmedlet i stycken, ange även styckAntal och styckvikt (ägg ≈ 60 g, brödskiva ≈ 30 g, fralla ≈ 45 g). Appen räknar själv.
3. Anges ingen mängd, utgå från typisk svensk normalstorlek.
4. Anta vanligast förekommande beredning.

Svara ENDAST med JSON, inga förklaringar, ingen markdown:
{"delar":[{"name":string,"gram":number,"styckAntal":number|null,"styckvikt":number|null,"kcalPer100g":number,"proteinPer100g":number,"fatPer100g":number,"carbsPer100g":number}],"antaganden":"kort text"}`
    }]
  });
  const textBlock = (data.content || []).find(b => b.type === 'text');
  if(!textBlock) throw new Error('Tomt svar från modellen');
  const parsed = JSON.parse(textBlock.text.replace(/```json|```/g, '').trim());
  const aiParts = (parsed.delar || []).map(partFromAi)
    .filter(c => c.name && c.amount > 0);

  if(!aiParts.length){
    // Svarade modellen ändå med en klumpsumma, använd den som en enda del
    const k = Number(parsed.kcal);
    if(!isFinite(k) || k <= 0) throw new Error('Inga delar i svaret');
    aiParts.push({
      name: aiDesc.length > 40 ? aiDesc.slice(0,40) + '…' : aiDesc,
      unit: 'g', amount: 100,
      kcalPer100: Math.round(k),
      proteinPer100: Math.round((Number(parsed.protein)||0)*10)/10,
      fatPer100: Math.round((Number(parsed.fat)||0)*10)/10,
      carbsPer100: Math.round((Number(parsed.carbs)||0)*10)/10,
      src: 'ai'
    });
  }
  if(libParts.length) ghSaveBundle();
  return { parts: libParts.concat(aiParts), note: parsed.antaganden || null };
}

async function estimateQuickMeal(){

  const host = document.getElementById('quickEstStatus');
